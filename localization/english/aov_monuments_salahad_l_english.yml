 building_aov_monument_bronze_dragon_academy_01: "Bronze Dragon Academy"
 building_aov_monument_bronze_dragon_academy_01_desc: "During the reign of Aakhet the Bronze, no group was more loyal to the dragon than the Ahati. Their reverence for him went beyond his status as the ruler of Kheterata, attempting to harness the power of a dragon within themselves to increase their fighting power. Although it has been some time since his disappearance, this martial academy has been constructed to give the Ahati renewed purpose; a place for them to hone their skills as they did in centuries past. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
