 building_aov_monument_the_lake_palace_03: "The Lake Palace (III)"
 building_aov_monument_the_lake_palace_03_desc: "Near the northern shores of Lake Themarenn sits the Grand Lake Palace, calmly watching over the city and the farm fields surrounding it. Built during the apex of the Kingdom of Esmaria, this palace is a monument to Esmarian ingenuity, splendor, and... decadence. Located outside the reach of noisy streets and nosy priests and nobles of Esmaraine, the palace was originally built as a fort - some of the walls and infrastructure being interconnected with the modern castle of Themarenn to this day. However, its main purpose changed with time. As prosperity reigned over Esmaria during the 12th century, the palace was frequently used as a residence for the Kings of Esmaria and their entourage. The structure itself was made in cooperation with gnomish engineers, dwarven smiths, and elven architects. Those who have been privileged enough to visit speak of its countless rooms of various sizes, no less than four kitchens, a wine cellar the size of a small town, gargantuan marble columns, and the magnificent Grand Courtroom in the middle of the building. Another famous part of the building, The King's Terrace overlooking the lake, was instead used for 'less pressing matters' and additionally to entertain more prestigious guests. The structure would however slowly wither away with the dissolution of the Kingdom and then the Grand Duchy of Esmaria. Many blueprints and finer details about the structure were lost, preventing its inheritors from properly maintaining it, but hope might yet not be lost as Cannor enters an Age of Rediscovery. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
 building_aov_monument_the_necropolis_02: "The Neratic Necropolis (II)"
 building_aov_monument_the_necropolis_02_desc: "Across the river Cotumer from Corseton rises a bone-white limestone cliff adorned with the cliff tombs of the ancient Milcorissian nobility, and atop it the Neratic Necropolis - a sprawling complex of temples, ossuaries, crypts and tombs stretching for miles along the cliff face and into the surrounding woodlands. At its center lies the High Hall of Judgment, heart of the Neratic faith, seat of Nerat's Council and the ultimate destination for bone pilgrimages from all over Cannor. But as vast as the sacred precinct is above ground, the Neratic priesthood ever-vigilant against necromantic defilement, it is even more expansive below. A network of catacombs and subterranean chapels has been hewn into the stone over the millennia, creating a veritable labyrinth. It is rumored that even the Neratic priesthood is not entirely familiar with the full extent of this maze, filled with corseted corpses, some of whom seem to be aware of every sign of movement disturbing their rest."
 building_aov_monument_the_necropolis_03: "The Neratic Necropolis (III)"
 building_aov_monument_the_necropolis_03_desc: "Across the river Cotumer from Corseton rises a bone-white limestone cliff adorned with the cliff tombs of the ancient Milcorissian nobility, and atop it the Neratic Necropolis - a sprawling complex of temples, ossuaries, crypts and tombs stretching for miles along the cliff face and into the surrounding woodlands. At its center lies the High Hall of Judgment, heart of the Neratic faith, seat of Nerat's Council and the ultimate destination for bone pilgrimages from all over Cannor. But as vast as the sacred precinct is above ground, the Neratic priesthood ever-vigilant against necromantic defilement, it is even more expansive below. A network of catacombs and subterranean chapels has been hewn into the stone over the millennia, creating a veritable labyrinth. It is rumored that even the Neratic priesthood is not entirely familiar with the full extent of this maze, filled with corseted corpses, some of whom seem to be aware of every sign of movement disturbing their rest."
 building_aov_monument_the_north_citadel_02: "The North Citadel (II)"
 building_aov_monument_the_north_citadel_02_desc: "Built at the base of the Trialmount, the North Citadel served as the court of Castanor's emperors for centuries. It was from here that they would begin their journey up the Trialmount, undertaking the Trials of Castan, and it was from here that many Castans ruled over one of the greatest empires the world has ever seen and will ever see. Although the Great Aqueduct linking the North Citadel to the City of Castonath has been destroyed and the Citadel itself damaged during the Battle of Trialmount, the North Citadel remains whole. If the Court of Castan were to be restored and its halls once again crowded and roaring with life, perhaps some measure of the Empire of Castanor's former glory can yet be found. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
