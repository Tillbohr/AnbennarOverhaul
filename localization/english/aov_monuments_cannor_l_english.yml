 building_aov_monument_lorent_new_adea_naval_school_01: "New Adea Naval School"
 building_aov_monument_lorent_new_adea_naval_school_01_desc: "The Shrouded Coast was never particularly rich in resources, yet its strategic location on a protected waterway with easy access to inland seas and the open waves of the Lament means that it is a prime location for a naval academy to educate the next generation of captains and admirals. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
