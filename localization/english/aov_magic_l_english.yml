 # Level up
 aov_magic.1.t: "Deeper Mastery"
 aov_magic.1.a: "The craft rewards the patient."
 aov_magic.1.desc.abjuration: "Long study has borne fruit. My command of Abjuration has deepened, and I can now work its spells up to level #V [ROOT.Char.MakeScope.ScriptValue('aov_school_abjuration_level')|0]#!."
 aov_magic.1.desc.conjuration: "Long study has borne fruit. My command of Conjuration has deepened, and I can now work its spells up to level #V [ROOT.Char.MakeScope.ScriptValue('aov_school_conjuration_level')|0]#!."
 aov_magic.1.desc.divination: "Long study has borne fruit. My command of Divination has deepened, and I can now work its spells up to level #V [ROOT.Char.MakeScope.ScriptValue('aov_school_divination_level')|0]#!."
 aov_magic.1.desc.enchantment: "Long study has borne fruit. My command of Enchantment has deepened, and I can now work its spells up to level #V [ROOT.Char.MakeScope.ScriptValue('aov_school_enchantment_level')|0]#!."
 aov_magic.1.desc.evocation: "Long study has borne fruit. My command of Evocation has deepened, and I can now work its spells up to level #V [ROOT.Char.MakeScope.ScriptValue('aov_school_evocation_level')|0]#!."
 aov_magic.1.desc.illusion: "Long study has borne fruit. My command of Illusion has deepened, and I can now work its spells up to level #V [ROOT.Char.MakeScope.ScriptValue('aov_school_illusion_level')|0]#!."
 aov_magic.1.desc.necromancy: "Long study has borne fruit. My command of Necromancy has deepened, and I can now work its spells up to level #V [ROOT.Char.MakeScope.ScriptValue('aov_school_necromancy_level')|0]#!."
 aov_magic.1.desc.transmutation: "Long study has borne fruit. My command of Transmutation has deepened, and I can now work its spells up to level #V [ROOT.Char.MakeScope.ScriptValue('aov_school_transmutation_level')|0]#!."

 # Casting
 AOV_SPELL_REQ_READY: "The spell is not on cooldown"
 AOV_SPELL_REQ_WAR: "Is at war"
 AOV_STUDY_REQ_NOT_MASTERED: "This school is not yet mastered (level 3)"
 aov_spell_ward_target: "Warded"
 aov_spell_ward_target_desc: "Protective wards fray every plot aimed at this character."
 aov_spell_steal_vitality_victim: "Vitality Stolen"
 aov_spell_steal_vitality_victim_desc: "Something has drained this character's strength."
 aov_charmed_opinion: "Charmed"

 # Special spells
 aov_elemental_army_name: "Conjured Elementals"
 aov_conjured_elementals: "Conjured Elementals"
 aov_conjured_elementals_flavor: "#F Stone and flame given shape, bound to their summoner until the spell runs out.#!"
 aov_magic.20.t: "Beyond the Veil"
 aov_magic.20.desc: "The circle flares, and something answers. It speaks without a mouth and offers knowledge, wonders or wealth. It does not say what it wants in return."
 aov_magic.20.a: "Teach me what you know."
 aov_magic.20.b: "Show me the lore of your plane."
 aov_magic.20.c: "Gold. Plain, honest gold."
 aov_magic.30.t: "A Promising Arrival"
 aov_magic.30.desc: "The threads of fate led me to [aov_talent.GetName], who has accepted a place at my court."
 aov_magic.30.a: "Welcome."
 AOV_SPELL_REQ_NOT_FORBIDDEN: "The target is not protected by a Field of Forbiddance"
 start_compel_interaction_desc: "Thoughtweave (Enchantment, level 2): weave a compulsion into the target's thoughts. Costs #V 100#! mana."
 start_dominate_interaction_desc: "Dominate to Surrender (Enchantment, level 3): bend the target's will to yours. Costs #V 200#! mana."
 anb_enhance_ability_interaction_desc: "Enhance Ability (Transmutation, level 1): refine one of the target's skills. Costs #V 50#! mana."
