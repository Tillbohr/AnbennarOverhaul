 building_aov_monument_humacs_tomb_01: "Humac's Tomb"
 building_aov_monument_humacs_tomb_01_desc: "Father of Castan I the Progenitor, Humac was a foundational hero and military commander of the Castanites, leading his troops to victory in countless battles until he was personally slain by the First Xhazobine at the Battle of the Burning Hill. His son Castan, not wanting his father's corpse and resting place defiled by the gnolls, carried his remains all the way through the Lost Years in the Deepwoods until they finally found friendly lands. There he buried his father, along with all of his possessions save his holy mace, which he kept for himself. As neither Castan I nor Castan II left any mortal remains behind, Humac's Tomb became the most significant burial monument from the early Castanorian era, and many later Castans would embellish the Tomb over the years, until it was finally destroyed by the Greentide. Many Escanni believe that just as 'elves' are named after Venaan, the word 'human' comes from Humac. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
