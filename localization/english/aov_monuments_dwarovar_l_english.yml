 building_aov_monument_khugdihr_bank_02_desc: "Khugdhir is a hold famous for its Asra Bank, founded by Fognir Asra after he reclaimed the Gem of Asra. The Asra Bank has branches all across Halann, from Anbenncost to far eastern Haless in Tianlou. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
