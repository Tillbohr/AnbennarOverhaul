 building_aov_monument_adenica_longlance_knights_academy_01: "Longlance Knights Academy"
 building_aov_monument_adenica_longlance_knights_academy_01_desc: "Caylen Longlance - a name synonymous with 'hero' and 'knight' to the many children who grew up hearing tales of his honorable deeds and valiant actions in the long War of the Sorcerer-King - is considered by many to be the first modern knight. As such, the foundation of an academy in his name dedicated to teaching proper knightly conduct and martial skills is downright reasonable. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
 building_aov_monument_adenica_longlance_knights_academy_02: "Longlance Knights Academy (II)"
