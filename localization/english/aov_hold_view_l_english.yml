l_english:
 AOV_HOLD_DIG_PROGRESS:0 "Delving to Level [HoldingView.GetProvince.MakeScope.Var('aov_dig_target_level').GetValue|0]: [HoldingView.GetProvince.MakeScope.Var('aov_dig_progress').GetValue|0] / [HoldingView.GetProvince.MakeScope.ScriptValue('aov_dig_months')|0] months"
 AOV_HOLD_DIG_PROGRESS_TT:0 "#T Delving Deeper#!\nThe dwarves are digging [HoldingView.GetProvince.GetTitle.GetNameNoTierNoTooltip] down to level [HoldingView.GetProvince.MakeScope.Var('aov_dig_target_level').GetValue|0]: [HoldingView.GetProvince.MakeScope.Var('aov_dig_progress').GetValue|0] of [HoldingView.GetProvince.MakeScope.ScriptValue('aov_dig_months')|0] months dug, about [HoldingView.GetProvince.MakeScope.ScriptValue('aov_dig_years_left')|0] years left.\n\nThe dig gains 3 months each quarter while a dwarf holds the hold and it is not occupied. Dig events can move it forward or back."
