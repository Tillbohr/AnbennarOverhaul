 building_aov_monument_eduz_ginakku_01: "Eduz-Ginakku"
 building_aov_monument_eduz_ginakku_01_desc: "On the northern shore of the Saluraš, connected to old Aqatbar by Kalešin's Bridge, lies the temple city of Eduz-Ginakku, also called the Great Library of Aqatbar by foreigners. While the true origins of the temple-library are uncertain, many favor the theory that it was Birsartan the Scribe, who brought the Sun Cult to Bahar, who founded the temple. Over the centuries, Eduz-Ginakku grew to include not only the central temple complex, but also countless scriptoria, libraries, and workshops, as well as housing for the clergy. The temple-garden surrounding the central Ziggurat with its famed Altar of the Truth is unique as well, as papyrus reeds and a vast array of flowers used in the production of ink dyes are grown there, instead of the more traditionally grown decorative plants. One quarter of the library district is occupied by Zheh's palace-fortress, built by the gnollish matriarch Zheh who came to Aqatbar for plunder but fell in love with the amassed knowledge found in Eduz-Ginakku and became a famed patron of the literary arts. Eduz-Ginakku has been one of if not the most prominent center of scholarship and learning in all of Bulwar, and has been the undisputed religious center of eastern Bahar for millennia. It is here where Cannorians desiring to sip from the fountain of wisdom of Bulwari civilization come to broaden their horizons. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
