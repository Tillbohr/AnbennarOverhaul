 building_aov_monument_nathalaire_city_of_pirates_01: "Nathalaire, City of Pirates"
 building_aov_monument_nathalaire_city_of_pirates_01_desc: "Nathalaire is a city renowned for its patronage of agents skilled in the arts of espionage and information, as well as being a haven for pirates. The city is named after the Cannorian goddess Nathalalyne, who is the patron and protector of the city. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
