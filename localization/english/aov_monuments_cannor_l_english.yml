 building_aov_monument_bayvic_grandest_city_of_the_reach_01: "Bayvic, Grandest City of the Reach"
 building_aov_monument_bayvic_grandest_city_of_the_reach_01_desc: "Bayvic has long been a large and influential city along the Alenic Reach, but with the recent orcish invasion of Escann, it has grown into an even bigger city. Any aspiring trader or conqueror would do well to respect the economic influence wielded by Bayvic. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
