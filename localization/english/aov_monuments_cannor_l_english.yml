 building_aov_monument_black_iron_mine_02_desc: "The center of Gawed's iron production, the Black Iron Mine was established first by the Castanorian Empire, but was later taken over by the Alenic tribesmen, and expanded after Gawed's founding. The mine consists of a honey-comb complex of tunnels and shafts buried deep into the moorlands Vanbury is built upon, with reinforced eastern sides to prevent tunneling into the Alen river. The site is known not only for the vast quantities of iron it produces, but also for its impressive amount of smithies and forges. The famous oath-rings of the Gawedi Great Lords are forged here, by the famed Stone Dwarven clans of Vanbury."
