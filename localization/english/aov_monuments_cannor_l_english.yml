 building_aov_monument_grave_forest_of_ilvandet_01: "Grave Forest of Ilvandet"
 building_aov_monument_grave_forest_of_ilvandet_01_desc: "Deep in the primeval Deruwren, in the 'groves of death' of Ilvandet and in the wilderness that separates them, the Carnetori druids gather, remnants of an ancient world. Keepers of ancient lore and secrets since before the first Castanorian colony in the region was founded, the druids use their powers, learned from the fey, to tend to the Gravetrees and protect the Grave Forest from would-be destroyers. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
