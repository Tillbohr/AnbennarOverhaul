 building_aov_monument_bal_dostan_02: "Bal Dostan (II)"
 building_aov_monument_bal_dostan_02_desc: "In 470, the Raven King and his tribesmen stumbled on the abandoned citadel of Bal Dostan, its gates left wide open. In the high solar, the petty king found the Sapphire Key badge of the Bal Dostan castellans, and seized it as divine favor for his rule. For a time, the reign of the Korbarids was good. Nowadays, their Corvurian descendants have the dubious honor of ruling over cow manure and dirt farmers. Arca Corvur's vaults are beyond empty, the old Dragon Road that once enriched the Korbarid Kings worn into a mud trail for herding livestock. Recently, however, strange screeches are heard in the night above Corvuria. The yearly Masquerades, which shrunk slowly over the ages, now seem to never end. The endless feasts of Arca Corvur draw in impoverished nobles like flies. It is strange however: After leaving, the partiers say the best wine in the Godshield is found here, yet no one has ever seen a barrel leave the palace... Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
 building_aov_monument_bal_dostan_03: "Bal Dostan (III)"
 building_aov_monument_bal_dostan_03_desc: "In 470, the Raven King and his tribesmen stumbled on the abandoned citadel of Bal Dostan, its gates left wide open. In the high solar, the petty king found the Sapphire Key badge of the Bal Dostan castellans, and seized it as divine favor for his rule. For a time, the reign of the Korbarids was good. Nowadays, their Corvurian descendants have the dubious honor of ruling over cow manure and dirt farmers. Arca Corvur's vaults are beyond empty, the old Dragon Road that once enriched the Korbarid Kings worn into a mud trail for herding livestock. Recently, however, strange screeches are heard in the night above Corvuria. The yearly Masquerades, which shrunk slowly over the ages, now seem to never end. The endless feasts of Arca Corvur draw in impoverished nobles like flies. It is strange however: After leaving, the partiers say the best wine in the Godshield is found here, yet no one has ever seen a barrel leave the palace... Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
 building_aov_monument_bal_hyl_02: "Bal Hyl (II)"
 building_aov_monument_bal_hyl_02_desc: "During the Dragonwake, three Alenic Tribes fled pell-mell into the eastern Dameshead. With Gawedi behind, and Damerians ahead, they turned to fight before the noose closed completely. In a desperate gambit, they put Bal Hyl at their backs and armed every man, woman and child. The Battle of the Hyl was so grave that their backline was crushed against the castle walls. Afterwards, the castellan of Bal Hyl offered vassalage but refused the tribesmen sanctuary. Surprisingly, the Wex played along: scouts had found entrance into tunnels beneath Bal Hyl. As talks stalled above, warriors delved deeper below. When Damenath fell, Wexonard braves boiled through the catacombs and slaughtered the demoralized garrison. In victory, the Wex chieftain cast the Damerian flag onto the pyre of his enemies, naming his conquest Wexkeep. Now, the House sil Wex rules Wexkeep with an iron fist. The same labyrinth that doomed the Damerians houses both supplies and spies, the full extent thereof known only to the sil Wex line. The descendants of those bloodsoaked braves still man the walls. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
