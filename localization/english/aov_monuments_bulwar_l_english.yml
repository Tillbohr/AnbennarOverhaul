 building_aov_monument_ebbusubtu_01: "Ebbušubtu"
 building_aov_monument_ebbusubtu_01_desc: "Rising like a mirage above the Salahad, ancient Ebbušubtu towers. This westernmost peak of the Paravimvata range is known to the Bulwari as the Mountain of Clear Sight. The mountain itself is riddled with the remains of an abandoned djinn palace. These ruins were shunned by the local Mašnsih and only sporadically entered by harpy squatters, until Andrellion of the Desert Legion was brought here by his harpy allies. There he established his headquarters, and with the rise of the Jadd, the palace has been restored and expanded, the spiritual center of the Jaddari Legion. The palace contains many grand halls and terraces carved from the rock, with secluded gardens and awe-inspiring views littered throughout its heights. While many pilgrims arrive every day, only a few attempt to ascend the Endless Stair, ending in a colossal platform atop a lesser peak, from which the pilgrims can view the sun rising over the summit of Ebbušubtu, where it is said Jaddar received his revelations. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
