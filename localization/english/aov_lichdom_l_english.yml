l_english:
 # Lichdom's steps (events/aov_lichdom_events.txt), after EU4 Anbennar's Pursue Lichdom
 aov_lichdom_back_out: "Let us put an end to this madness!"
 aov_lichdom_back_out_tt: "The level in progress is abandoned; nothing is refunded, and prestige is lost the deeper the work has gone"
 aov_lichdom_hasten_fast_tt: "The work goes faster: #V +[GetPlayer.MakeScope.ScriptValue('aov_lichdom_months_fast')|0]#! months of progress"
 aov_lichdom_hasten_faster_tt: "The work goes much faster: #V +[GetPlayer.MakeScope.ScriptValue('aov_lichdom_months_faster')|0]#! months of progress"
 aov_lichdom_mana_tt: "Costs #V [GetPlayer.MakeScope.ScriptValue('aov_lichdom_mana')|0]#! mana"

 aov_lichdom.2.t: "Lichdom: Crafting the Phylactery"
 aov_lichdom.2.desc: "Whenever a righteous realm burns the books, the knowledge of lichdom survives somewhere: in the margins of innocent tomes, in nursery rhymes, on the walls of old tombs. [ROOT.Char.GetFirstName] has gathered enough of it to begin.\n\nFirst comes the phylactery, the vessel that will hold a soul when the body no longer can."
 aov_lichdom.2.a: "An amulet capable of containing a small object."
 aov_lichdom.2.a.tt: "The phylactery will be an amulet, worn on our person"
 aov_lichdom.2.b: "An ornate, jewel-encrusted box."
 aov_lichdom.2.b.tt: "The phylactery will be a jewelled box, kept at court"
 aov_lichdom.3.t: "Lichdom: Engraving the Phylactery"
 aov_lichdom.3.desc: "A phylactery must be covered, inside and out, in magical notation: enough to hold a spirit, and to let it cast spells from within."
 aov_lichdom.3.a: "Scribe dark spells on tiny magical scrolls to put inside."
 aov_lichdom.3.b: "Carve unholy runes on the inner walls and fill them with liquefied damestear."
 aov_lichdom.3.c: "Coat the insides with the enchanted blood of a magical beast."
 aov_lichdom.4.t: "Lichdom: Enchanting the Phylactery"
 aov_lichdom.4.desc: "Bereft of a body, most souls move on. The phylactery must be enchanted into a beacon for one soul in particular, so that when [ROOT.Char.GetFirstName] dies, [ROOT.Char.GetSheHe] does not."
 aov_lichdom.4.a: "Perform dark enchantments."
 aov_lichdom.4.b: "Pour myself into the work."

 aov_lichdom.5.t: "Lichdom: The Transformation Potion"
 aov_lichdom.5.desc: "The Transformation Potion is a poison, made to kill its drinker in exactly the right way. Its first reagent must be bought from people who do not ask questions."
 aov_lichdom.5.a: "Four roots of Queen's Belladonna."
 aov_lichdom.5.b: "Two bowls of ground Halanna's Tears."
 aov_lichdom.5.c: "Ten blooms of fey-touched hemlock."
 aov_lichdom.6.t: "Lichdom: The Deadly Catalyst"
 aov_lichdom.6.desc: "The potion needs a catalyst: something said to be deadly to anyone at all. Several are on offer, at several prices."
 aov_lichdom.6.a: "Three grams of black damestear."
 aov_lichdom.6.b: "Six drops of Neratic asp venom."
 aov_lichdom.6.c: "One tincture of wyvern blood."
 aov_lichdom.7.t: "Lichdom: The Potion Vessel"
 aov_lichdom.7.desc: "No ordinary bottle will hold the finished potion. Its vessel must be as dark and accursed as the road itself, made by the vilest of means."
 aov_lichdom.7.a: "Rip out the heart of an innocent."
 aov_lichdom.7.b: "Find me a unicorn and bring me its horn!"
 aov_lichdom.7.c: ".......... (There is silence.)"

 aov_lichdom.8.t: "Lichdom: Preparing the Ritual"
 aov_lichdom.8.desc: "The ritual is dangerous, and the chamber must be made ready for it: overlapping circles of power, warded doors, enchanted ornaments, everything in its place."
 aov_lichdom.8.a: "Make the preparations, as best we can."
 aov_lichdom.8.b: "I wield expertise in this area!"
 aov_lichdom.9.t: "Lichdom: The Cleansing"
 aov_lichdom.9.desc: "Before the end, [ROOT.Char.GetFirstName] must cleanse body and soul of all that ties them to the living: food, warmth, sleep, company. It may take years."
 aov_lichdom.9.a: "Begin the cleanse."
 aov_lichdom.9.b: "Transmutation will hasten the process."
 aov_lichdom.20.t: "Lichdom: Turning Back"
 aov_lichdom.20.desc: "Somewhere in the long fast, the faces of the living began to blur together: friends, servants, kin, all of them warm and fat with a life they do not deserve. [ROOT.Char.GetFirstName] notices it, and for one moment is afraid of what [ROOT.Char.GetSheHe] is becoming."
 aov_lichdom.20.a: "What was I thinking? I must stop this, now."
 aov_lichdom.20.a.tt: "The Dark Ritual is abandoned; the phylactery and the potion are kept"
 aov_lichdom.20.b: "Another soul for the phylactery."
 aov_lichdom.10.t: "Lichdom: Consumption"
 aov_lichdom.10.desc: "The night has come. [ROOT.Char.GetFirstName] stands in the ritual chamber beside the phylactery, the potion in hand. It must be drunk quickly, and it must kill at once; done wrong, body and soul are lost together."
 aov_lichdom.10.a: "Drink."
 aov_lichdom.11.t: "Ascension to Lichdom"
 aov_lichdom.11.desc: "The pain is beyond anything: the poison scours the bones and the ritual tears the spirit loose, burning, freezing and dissolving all at once. Then it fades, and [ROOT.Char.GetFirstName] is still standing.\n\nThe flesh falls away in the days that follow. The servants flee, and word spreads faster than they can: there is a Lich in [ROOT.Char.GetPrimaryTitle.GetNameNoTier], and every court knows its name."
 aov_lichdom.11.a: "Look upon me. I am perfect."
