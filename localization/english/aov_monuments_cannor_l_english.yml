 building_aov_monument_deranne_westport_gateway_to_aelantir_02_desc: "Deranne has many ports along its coastline for merchants, adventurers, and explorers alike, but none more prominent or influential than Westport. Many Derranians hope to use the resources and location of Westport to fuel explorations of the ruins of Aelantir, for riches and glory alike. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
