l_english:
 building_aov_monument_gor_ozumbrog_the_topaz_throne_01: "The Topaz Throne"
 building_aov_monument_gor_ozumbrog_the_topaz_throne_01_desc: "While never as mighty as the Kronium Throne of the High King of Amldhir, the Topaz Throne is a symbol of the power of the Old Kings of Gor Ozumbrog before the fall of the hold during the collapse of the Dwarven Empire led to its near total destruction. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
