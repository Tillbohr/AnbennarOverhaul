 AOV_ARTIFICERY_BUTTON: "Artificery"
 AOV_ARTIFICERY_WINDOW_TITLE: "Artificery"
 AOV_ARTIFICERY_TAB_FACTIONS: "Factions"
 AOV_ARTIFICERY_TAB_INVENTIONS: "Inventions"

