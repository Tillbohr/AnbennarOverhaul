 building_aov_monument_damish_temple_temple_of_the_highest_moon_02: "Temple of the Highest Moon (II)"
 building_aov_monument_damish_temple_temple_of_the_highest_moon_02_desc: "The Temple of the Highest Moon is the largest temple in cannor dedicated to the goddess of tolerance, harvests, and magic: the Dame. Due to its location, it is also the highest temple in Cannor, due to its location near the summit of the Moonmount. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
