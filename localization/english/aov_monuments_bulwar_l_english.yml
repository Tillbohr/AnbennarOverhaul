 building_aov_monument_dasmati_halls_of_reverence_01: "Dasmati Halls of Reverence"
 building_aov_monument_dasmati_halls_of_reverence_01_desc: "The Halls of Reverence are where the Maqeti people buried their former kings, honored for their achievements in the struggle against the gnollish slavers that once hunted them. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
