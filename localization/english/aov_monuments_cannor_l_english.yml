 building_aov_monument_calascandar_02: "Calascandar (II)"
 building_aov_monument_calascandar_02_desc: "Who doesn't know the legend of the crafty hero Calasandur the Magnificent and his most famous castle Calascandar? Strategically positioned to protect North Esmaria and the old Havoric lands, it is famed for holding back an invasion from Black Castanor, giving the Free Realms time to break the siege and open the way into Escanni heartlands. Calascandar is a name famed throughout the Empire of Anbennar as the site of the founding of the famed Knights Magnificent and the original headquarters of the Calasanni Trading Company. Calasandur himself ruled from this fortress as founder of the affluent House of Silcalas, one of the brightest and most fecund Silver families of the Empire. Nowadays, Calascandar still safeguards the Ainsway, an immensely profitable trade route, but the CLSTC has since moved their headquarters to Damescrown. The now sidelined Calascandar CSLTC branch eyes the new headquarters with anger, but they continue their duty of turning one coin into two."
 building_aov_monument_calascandar_03: "Calascandar (III)"
 building_aov_monument_calascandar_03_desc: "Who doesn't know the legend of the crafty hero Calasandur the Magnificent and his most famous castle Calascandar? Strategically positioned to protect North Esmaria and the old Havoric lands, it is famed for holding back an invasion from Black Castanor, giving the Free Realms time to break the siege and open the way into Escanni heartlands. Calascandar is a name famed throughout the Empire of Anbennar as the site of the founding of the famed Knights Magnificent and the original headquarters of the Calasanni Trading Company. Calasandur himself ruled from this fortress as founder of the affluent House of Silcalas, one of the brightest and most fecund Silver families of the Empire. Nowadays, Calascandar still safeguards the Ainsway, an immensely profitable trade route, but the CLSTC has since moved their headquarters to Damescrown. The now sidelined Calascandar CSLTC branch eyes the new headquarters with anger, but they continue their duty of turning one coin into two."
 building_aov_monument_celmaldor_icewind_palace_of_commerce_01: "Icewind Palace of Commerce"
 building_aov_monument_celmaldor_icewind_palace_of_commerce_01_desc: "After the landing of the elves in Celmaldor, one of the largest elven clans, the Icewinds, eventually took power and began to develop the city of Celmaldor into a proper trading port to rival others along the Alenic Reach and Dalr. In the Palace of Commerce, the most magnificent building constructed by the Icewinds, Celmaldorian merchants gather to discuss business and development of the city."
 building_aov_monument_celmaldor_icewind_palace_of_commerce_02: "Icewind Palace of Commerce (II)"
 building_aov_monument_celmaldor_icewind_palace_of_commerce_02_desc: "After the landing of the elves in Celmaldor, one of the largest elven clans, the Icewinds, eventually took power and began to develop the city of Celmaldor into a proper trading port to rival others along the Alenic Reach and Dalr. In the Palace of Commerce, the most magnificent building constructed by the Icewinds, Celmaldorian merchants gather to discuss business and development of the city."
