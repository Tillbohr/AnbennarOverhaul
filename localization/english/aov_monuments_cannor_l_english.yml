 building_aov_monument_neckcliffe_the_imperial_dockyard_01: "The Imperial Dockyard"
 building_aov_monument_neckcliffe_the_imperial_dockyard_01_desc: "Since Anbennar's founding, Neckcliffe has been the primary port of call for the Imperial Navy due to its natural harbor and strategic position."
