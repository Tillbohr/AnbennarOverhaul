 building_aov_monument_well_of_majesty_01: "Well Of Majesty"
 building_aov_monument_well_of_majesty_01_desc: "A deep spring in Treopyr whose waters are held to carry a trace of royal blessing. Those who drink from it are said to leave with a more commanding bearing. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
