 building_aov_monument_ara_temple_01: "Temple of Ara"
 building_aov_monument_ara_temple_01_desc: "Ara (also known as lady luck) is the goddess of trade and fortune. Her followers were responsible for setting up the first human mint and currency, allowing ancient Castanor to move from its reliance on dwarven coinage. The largest temple to Ara in Cannor is found in the Dameshead, geographically between the cities of Vertesk and Damescrown and only a short distance away from other important cities. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
