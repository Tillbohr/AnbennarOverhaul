 AOV_MAGIC_TAB_ADVANCEMENTS: "Advancements"
 AOV_MAGIC_TAB_SPELLS: "Spells"
 AOV_ADV_REQ_ELIGIBLE: "Is a landed ruler with Magical Affinity"
 AOV_ADV_REQ_NOT_COMMITTED: "Is not working on a magic advancement"
 AOV_ADV_REQ_NOT_DONE: "Has not completed all three levels"
 AOV_ADV_START: "Begin"
 AOV_ADV_ABANDON: "Abandon"
 AOV_ADV_ABANDON_TT: "Stop working on this advancement. The gold and mana spent are lost."
 AOV_ADV_PROGRESS: "#V [GetPlayer.MakeScope.ScriptValue('aov_adv_months_left')|0]#! months left"
 AOV_ADV_COMPLETE: "#P All three levels completed#!"
 AOV_ADV_LEVEL_DONE: "Completed"
 AOV_ADV_LEVEL_NEXT: "Next"
 AOV_ADV_LEVEL_LOCKED: "Locked"

 aov_advancement.1.t: "A Magical Advancement"
 aov_advancement.1.a: "The work goes on."
 aov_advancement.1.desc.magical_fortress: "The wards are laid. Lines of power run through the stones of [ROOT.Char.GetPrimaryTitle.GetNameNoTier], and no besieger will find them easy to break."
 aov_advancement.1.desc.summon_extraplanars: "The circle flares and is still. What came through it now waits on [ROOT.Char.GetFirstName]'s word."
 aov_advancement.1.desc.orb_of_omniscience: "In the depths of the orb, shapes move: what was, what is, and what may yet come."
 aov_advancement.1.desc.enchanted_artifact: "The last rune is cut and the enchantment settles into the work like a held breath let go."
 aov_advancement.1.desc.battlemage_academy: "Students drill in the courtyard, and the walls are scorched black where their spells went astray."
 aov_advancement.1.desc.mirror_image: "In every mirror of the palace, [ROOT.Char.GetFirstName] sees a face that is not quite a reflection."
 aov_advancement.1.desc.lichdom: "Another step taken on the dark road. There is no light behind, and only cold ahead."
 aov_advancement.1.desc.homunculus: "The alembic bubbles, and in the murk something small and patient opens its eyes."

 # Magical Fortress
 aov_ward_1: "Warded"
 aov_ward_1_desc: "Wards woven into the stones of this county turn back besiegers and shelter the land within."
 aov_ward_3: "Unbreakable Wards"
 aov_ward_3_desc: "Wards of great power guard this county; its walls have never been stronger."
 aov_ward_capital: "Warded Seat"
 aov_ward_capital_desc: "The heart of the wards lies here, where they are strongest."

 # Summon Extraplanars
 aov_advancement.10.t: "Summon Extraplanars"
 aov_advancement.10.desc: "The summoning circle is drawn and the words are ready. Three doors stand open beyond the veil, and only one host may come through."
 aov_advancement.10.a: "The Shining City sends its angels."
 aov_advancement.10.a.tt: "Unlocks the #V Host of the Shining City#!, heavy infantry, free to recruit and maintain"
 aov_advancement.10.b: "The weird ones from the far planes."
 aov_advancement.10.b.tt: "Unlocks #V The Weird Ones#!, heavy cavalry, free to recruit and maintain"
 aov_advancement.10.c: "Beings of fire and rage."
 aov_advancement.10.c.tt: "Unlocks the #V Beings of Fire and Rage#!, archers, free to recruit and maintain"
 aov_host_angels: "Host of the Shining City"
 aov_host_angels_flavor: "#F Winged soldiers of the Shining City, bound to their summoner's banner.#!"
 aov_host_eldritch: "The Weird Ones"
 aov_host_eldritch_flavor: "#F Riders from planes no map records. Horses flee from their mounts.#!"
 aov_host_devils: "Beings of Fire and Rage"
 aov_host_devils_flavor: "#F Devils who hurl fire from the back rows and laugh as it lands.#!"
 aov_host_angels_2: "Bound Host"
 aov_host_angels_3: "Host Eternal"
 aov_host_eldritch_2: "Bound Host"
 aov_host_eldritch_3: "Host Eternal"
 aov_host_devils_2: "Bound Host"
 aov_host_devils_3: "Host Eternal"

 # Orb of Omniscience
 aov_orb_of_omniscience_name: "Orb of Omniscience"
 aov_orb_of_omniscience_desc: "An orb of glass and starlight ground by [owner.GetFirstName]. Within it, shapes move: what was, what is, and what may yet come."
 aov_orb_1: "Orb of Omniscience"
 aov_orb_2: "Clear Sight"
 aov_orb_3: "All-Seeing"

 # Enchanted Artifact
 aov_adv_can_craft_enchanted_artifact_tt: "Has never crafted an enchanted artifact"
 aov_adv_owns_enchanted_artifact_tt: "Owns the enchanted artifact they crafted"
 aov_advancement.20.t: "The Enchanted Artifact"
 aov_advancement.20.desc: "A mage may pour this much of themselves into only one work in a lifetime. The materials are laid out on the workbench, each waiting to become something more."
 aov_advancement.20.weapon: "A weapon, to strike as no other can."
 aov_advancement.20.armor: "Armor, that no blade may find me."
 aov_advancement.20.crown: "A crown, to command the hearts of men."
 aov_advancement.20.regalia: "Regalia, to rule the realm well."
 aov_advancement.20.trinket: "A ring, to deepen my magic."
 aov_enchanted_weapon_name: "Enchanted Blade"
 aov_enchanted_weapon_desc: "A blade forged and spellbound by [owner.GetFirstName]. It never dulls, and it never misses its mark."
 aov_enchanted_weapon_1: "Enchanted Blade"
 aov_enchanted_weapon_2: "Deepened Enchantment"
 aov_enchanted_weapon_3: "Masterwork Enchantment"
 aov_enchanted_armor_name: "Enchanted Armor"
 aov_enchanted_armor_desc: "Plate etched with wards by [owner.GetFirstName]. Arrows turn aside before they touch it."
 aov_enchanted_armor_1: "Enchanted Armor"
 aov_enchanted_armor_2: "Deepened Enchantment"
 aov_enchanted_armor_3: "Masterwork Enchantment"
 aov_enchanted_crown_name: "Enchanted Crown"
 aov_enchanted_crown_desc: "A crown enchanted by [owner.GetFirstName]. Those who look upon it find themselves inclined to obey."
 aov_enchanted_crown_1: "Enchanted Crown"
 aov_enchanted_crown_2: "Deepened Enchantment"
 aov_enchanted_crown_3: "Masterwork Enchantment"
 aov_enchanted_regalia_name: "Enchanted Regalia"
 aov_enchanted_regalia_desc: "Regalia bound with the magic of [owner.GetFirstName]. Ledgers balance themselves in its presence."
 aov_enchanted_regalia_1: "Enchanted Regalia"
 aov_enchanted_regalia_2: "Deepened Enchantment"
 aov_enchanted_regalia_3: "Masterwork Enchantment"
 aov_enchanted_trinket_name: "Enchanted Ring"
 aov_enchanted_trinket_desc: "A ring that [owner.GetFirstName] filled with magic. It hums softly when spells are near."
 aov_enchanted_trinket_1: "Enchanted Ring"
 aov_enchanted_trinket_2: "Deepened Enchantment"
 aov_enchanted_trinket_3: "Masterwork Enchantment"

 # Battlemage Academy
 building_type_battlemage_academy_01: "Battlemage Academy"
 building_type_battlemage_academy_01_desc: "A school where mages learn to turn their spells on the battlefield. The practice yard is scorched black."
 building_battlemage_academy_01: "Battlemage Academy"
 building_battlemage_academy_01_desc: "$building_type_battlemage_academy_01_desc$"
 building_battlemage_academy_02: "Battlemage College"
 building_battlemage_academy_02_desc: "$building_type_battlemage_academy_01_desc$"
 building_battlemage_academy_03: "Grand Battlemage Academy"
 building_battlemage_academy_03_desc: "$building_type_battlemage_academy_01_desc$"
 battlemage_academy_01_effect_desc: "#low Unlocks:#!\nThe Recruit Battlemage Commander [decision|E]\n\n#low A [ruler|E] may only have one Battlemage Academy in their [domain|E]. If they hold more than one, all of them are disabled until only one remains.#!"
 battlemage_academy_02_effect_desc: "#low Unlocks:#!\nRecruitment of [GetMaA('aov_battlemages').GetName] [men_at_arms|E]\nBetter battlemage commanders"
 battlemage_academy_03_effect_desc: "#low Unlocks:#!\nRecruitment of [GetMaA('aov_battlemages_3').GetName] [men_at_arms|E]\nBattlemage commanders trained to command (+5 [advantage|E])"
 battlemage_academy_none_in_domain_tt: "No other Battlemage Academy in the holder's [domain|E]"
 battlemage_academy_domain_limit_tt: "The holder has no more than one Battlemage Academy in their [domain|E]"
 aov_adv_battlemage_academy_1_effect_tt: "Can build the #V Battlemage Academy#! and recruit battlemage commanders"
 aov_adv_battlemage_academy_2_effect_tt: "Can upgrade it to the #V Battlemage College#!, which trains Battlemages"
 aov_adv_battlemage_academy_3_effect_tt: "Can upgrade it to the #V Grand Battlemage Academy#!"
 aov_battlemages: "Battlemages"
 aov_battlemages_flavor: "#F Mages drilled to fight in ranks, hurling fire and lightning from the back lines.#!"
 aov_battlemages_3: "Grand Battlemages"
 aov_battlemages_3_flavor: "#F The finest war-mages of the academy. Their volleys break shield walls.#!"
 aov_battlemage_trained: "Academy-Trained Battlemage"
 aov_battlemage_trained_desc: "Trained at a Grand Battlemage Academy to lead armies with spell and sword."
 aov_recruit_battlemage_decision: "Recruit Battlemage Commander"
 aov_recruit_battlemage_decision_desc: "The masters of our academy have trained a war-mage fit to lead our armies in the field. Summon them to court as a commander: a mage with #V Magical Affinity#! and the battle-spells of #V Evocation#!, strong in Martial and Prowess.\n\nThe better our academy, the better the graduate:\n- #V Battlemage Academy#!: Martial and Prowess 10-14, Evocation level 1\n- #V Battlemage College#!: Martial and Prowess 13-17, Evocation level 2\n- #V Grand Battlemage Academy#!: Martial and Prowess 16-20, Evocation level 3, and #V +5 advantage#! as a commander"
 aov_recruit_battlemage_decision_tooltip: "A battlemage commander graduates from your academy and joins your court"
 aov_recruit_battlemage_decision_confirm: "Recruit"

 # Mirror Image
 aov_mirror_image_1: "Mirror Images"
 aov_mirror_image_1_desc: "Doubles of light and shadow move with this character, confusing friend and foe alike."
 aov_mirror_image_2: "Body Double"
 aov_mirror_image_2_desc: "Somewhere, a perfect double of this character waits to take their place."
 aov_mirror_image_3: "Grand Simulacrum"
 aov_mirror_image_3_desc: "This character's simulacrum holds court, signs letters and charms guests while its maker is elsewhere."
 aov_adv_mirror_image_2_effect_tt: "When imprisoned, a #V 50%#! chance a body double is taken instead"
 aov_advancement.50.t: "The Body Double"
 aov_advancement.50.desc: "The guards were very pleased with themselves, right up until their prisoner smiled, flickered, and was gone. By then the real [ROOT.Char.GetFirstName] was miles away."
 aov_advancement.50.a: "They never had me at all."

 # Lichdom
 aov_adv_owns_phylactery_tt: "Holds the phylactery they crafted"
 aov_adv_has_sacrifice_tt: "Has a prisoner to sacrifice"
 aov_adv_can_become_lich_tt: "Is not already undead, immortal or incapable"
 aov_lichdom_crime: "The Crime Begun"
 aov_lichdom_crime_desc: "This character has taken the first step on the dark road to undeath."
 aov_phylactery: "Phylactery"
 aov_phylactery_name: "Phylactery of [owner.GetFirstName]"
 aov_phylactery_desc: "A cold amulet engraved with words that should not be read aloud. It waits to hold a soul."
 aov_advancement.40.t: "The Ritual"
 aov_advancement.40.desc: "The phylactery lies on the altar, and the circle is drawn. All that remains is a life to pay for the one that will never end."
 aov_advancement.40.a: "[aov_sacrifice_1.GetFullName] will pay the price."
 aov_advancement.40.a2: "[aov_sacrifice_2.GetFullName] will pay the price."
 aov_advancement.40.a3: "[aov_sacrifice_3.GetFullName] will pay the price."
 aov_advancement.40.b: "There is no one left to give. The ritual will wait for one."
 aov_advancement.41.t: "The Phylactery Is Lost"
 aov_advancement.41.desc: "The phylactery is no longer in [ROOT.Char.GetFirstName]'s hands. Without it, the ritual cannot be finished, and a new vessel must be made."
 aov_advancement.41.a: "I will make another."

 # Homunculus
 trait_aov_homunculus: "Homunculus"
 trait_aov_homunculus_desc: "[ROOT.Char.GetFirstName] was not born but made, shaped in an alembic by a transmuter. Homunculi cannot have children or inherit."
 trait_aov_homunculus_character_desc: "[ROOT.Char.GetFirstName] was not born but made, shaped in an alembic by a transmuter."
 aov_homunculus_maker_opinion: "My Maker"
 aov_homunculus_labour: "Homunculus Labour"
 aov_homunculus_labour_desc: "Tireless homunculi labour in this character's fields and building sites."
 aov_advancement.30.t: "Refining the Homunculus"
 aov_advancement.30.desc: "[aov_homunculus.GetFirstName] lies still on the table while [ROOT.Char.GetFirstName] works. One gift can be woven into the homunculus's mind."
 aov_advancement.30.diplomacy: "A silver tongue."
 aov_advancement.30.martial: "A soldier's mind."
 aov_advancement.30.stewardship: "A head for ledgers."
 aov_advancement.30.intrigue: "A spy's eyes."
 aov_advancement.30.learning: "A scholar's memory."

 # Failed levels
 aov_adv_owns_orb_tt: "Owns the Orb of Omniscience they made"
 aov_advancement.42.t: "The Ritual Waits"
 aov_advancement.42.desc: "All is ready: the phylactery, the circle, the words. All but the life the ritual demands. When a prisoner sits in [ROOT.Char.GetFirstName]'s dungeon, the work will be finished."
 aov_advancement.42.a: "Find me someone."
 aov_advancement.43.t: "The Ritual Fails"
 aov_advancement.43.desc: "The words are spoken and the circle flares, but death will not take hold of [ROOT.Char.GetFirstName]. Something in their nature refuses the change. The ritual is spent, and must be begun again."
 aov_advancement.43.a: "Then I will find another way."
 aov_advancement.44.t: "The Work Is Lost"
 aov_advancement.44.desc.orb_of_omniscience: "The Orb of Omniscience is no longer in [ROOT.Char.GetFirstName]'s hands. Without it, the work on the Orb cannot go on, and what was spent on it is gone."
 aov_advancement.44.desc.enchanted_artifact: "The enchanted artifact is no longer in [ROOT.Char.GetFirstName]'s hands. Without it, the enchantment cannot be deepened, and what was spent on it is gone."
 aov_advancement.44.a: "A bitter loss."
 aov_advancement.70.t: "A Battlemage Graduates"
 aov_advancement.70.desc: "The masters of the academy present their finest student. [aov_battlemage.GetFullName] kneels before me, the smell of scorched air still clinging to [aov_battlemage.GetHerHis] robes. [aov_battlemage.GetSheHe|U] has learned to lead soldiers as well as to call down fire, and now offers [aov_battlemage.GetHerHis] spells and sword to my service."
 aov_advancement.70.desc.trained: "\n\nTrained at the Grand Battlemage Academy, [aov_battlemage.GetFirstName] will give any army [aov_battlemage.GetSheHe] commands a sharp advantage."
 aov_advancement.70.desc.untrained: ""
 aov_advancement.70.a: "Welcome to my court, Battlemage."
