 building_aov_monument_mount_lazzaward_01: "Mount Lazzaward"
 building_aov_monument_mount_lazzaward_01_desc: "Mount Lazzaward, also known as Mount Serrukur, is a sacred mountain located in the lower slopes of the Serpentspine in the lands of the Gelkar kingdom of Lawaššar. The mountain is home to Lahmaš the Wise-master, leader of the Lamassus and one of the Sun Cult Erbatraši, as well as several clans of Kurešimi, mages that practice the art of Inscription. The mountain, believed to be the result of Wish or unknown magic, is completely made of Lapis Lazuli, with large veins of pyrite inclusions that give the mountain a dim glow during daytime. The top of the mountain is permanently covered by snow. Millennia ago, Lahmaš made its residence near the top of the mountain, and since then, a massive temple complex has been built, home to priests, scribes, and Lahmaš' students in the ways of Bulwari magic, and In the roots of the mountains lies Kurešim-kišbar, the city of the Wishcrafters, where most of the best mages and artisans from all of Bulwar practice the art of Inscription, the fabrication of magic items. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
