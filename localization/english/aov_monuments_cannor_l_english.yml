 building_aov_monument_giberd_academy_of_engineering_01: "Giberd Academy of Engineering"
 building_aov_monument_giberd_academy_of_engineering_01_desc: "The Giberd Engineering Academy (technically the Giberd *Civil* Engineering Academy but the name was considered too long) serves to teach the citizens of the Empire about the techniques and ideas found within gnomish craftsmanship, and to hone the skills of all aspiring artisans. Many of the foremost developments in urban design have originated from Giberd thanks to this academy. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
 building_aov_monument_giberd_academy_of_engineering_02: "Giberd Academy of Engineering (II)"
