l_english:
 # Anbennar Overhaul: generated by tools/build_rie_dwarves.py from Realms in Exile and Anbennar.
 # Anbennar Overhaul: do not edit by hand; rerun the generator after an RiE, Anbennar or CK3 update.
 building_dwarven_ale_house_01: "Local Brewer"
 building_dwarven_ale_house_01_desc: "Local dwarves have taken it on themselves to set up rudimentary stills to supply the alcoholic needs of the hold."
 building_type_dwarven_ale_house_01_desc: "The hold doesn't have an alcohol problem per se, but rather an alcohol solution."
 building_dwarven_ale_house_02: "Rough-Hewn Tavern"
 building_dwarven_ale_house_02_desc: "A section of the hold has been carved to make room for a small tavern; though crudely shaped, it has already proven a popular social meeting place."
 building_dwarven_ale_house_03: "Roadside Inns"
 building_dwarven_ale_house_03_desc: "By adding rooms to the hold's taverns, the innkeepers can charge migrants for room and board, doubling their profits."
 building_dwarven_ale_house_04: "Drinkslingers Union"
 building_dwarven_ale_house_04_desc: "Innkeepers and their employees have begun congregating into social clubs that exchange tips and network amongst themselves. Bartenders of the world, unite!"
 building_dwarven_ale_house_05: "Distillery"
 building_dwarven_ale_house_05_desc: "Advances in metallurgy have allowed the distillation of more potent varieties of liquor. The aromatic fragrance wafts throughout the district where the distillation occurs."
 building_dwarven_ale_house_06: "Sturdy Casks"
 building_dwarven_ale_house_06_desc: "The use of sealants prevents the leakage of precious alcohol whilst it is being stored."
 building_dwarven_ale_house_07: "Wine Larders"
 building_dwarven_ale_house_07_desc: "Advancements in storage and distillation techniques have given rise to the establishment of vast cellars packed to the brim with alcohol. Among the rows and rows of casks, some liquors wait for decades as their subtle flavors and rich tannins are skillfully drawn out."
 building_dwarven_ale_house_08: "Additional taps"
 building_dwarven_ale_house_08_desc: "Due to the vast array of patrons and regulars, taverns across the hold have installed additional taps to accommodate the surge."
 building_dwarven_ale_house_09: "A Tavern on Every Corner..."
 building_dwarven_ale_house_09_desc: "And a mug in every hand."
 building_dwarven_ale_house_10: "A Hall of Revelry"
 building_dwarven_ale_house_10_desc: "Tales of mythic alcohols flow from this hold like a river of red ale. Travelers and adventurers from all realms of Halann make the journey to this hold, hoping for but a drop of divine liquor."
 building_type_dwarven_ale_house_10_desc: "Tales of mythic alcohols flow from this hold like a river of red ale. Travelers and adventurers from all realms of Halann make the journey to this hold, hoping for but a drop of divine liquor."
 building_dwarven_fungal_farm_01: "Mushroom Foraging Camps"
 building_dwarven_fungal_farm_01_desc: "Lacking the resources to develop agricultural plots, these dwarves are reduced to foraging for wild mushrooms dotting the cave walls."
 building_type_dwarven_fungal_farm_01_desc: "Mushrooms have proven nutritious and can be cultivated in sufficient numbers to supply a hold with no natural light."
 building_dwarven_fungal_farm_02: "Household Garden"
 building_dwarven_fungal_farm_02_desc: "Farming initiatives have given rise to the practice of household plots being set aside to cultivate mushrooms for personal consumption."
 building_dwarven_fungal_farm_03: "Crop Diversification"
 building_dwarven_fungal_farm_03_desc: "The hold has begun to import foreign mushrooms to the hold in an attempt to diversify their diet."
 building_dwarven_fungal_farm_04: "Abolishment of the Common Land"
 building_dwarven_fungal_farm_04_desc: "The common plots of the hold have been parceled up and handed out to the largest farmers in each region. The introduction of larger farms should make the cultivation easier to manage."
 building_dwarven_fungal_farm_05: "Fungal Plantations"
 building_dwarven_fungal_farm_05_desc: "As the Fungal Farms get larger and larger, a wealthy planter class emerges with control of the major farms. The common Dwarf now works as a labourer in the expansive fields."
 building_dwarven_fungal_farm_06: "Shroomshine Stills"
 building_dwarven_fungal_farm_06_desc: "Plantation owners have begun to set aside a portion of the excess crop to be turned into cheap alcohol. This maximizes the value gained from each batch of mushrooms."
 building_dwarven_fungal_farm_07: "Deals with the Mushroom Guilds"
 building_dwarven_fungal_farm_07_desc: "The largest farms have begun organizing together into guilds; by working more closely with these organizations, the hold can attempt to maximize the output of the farms under their sway."
 building_dwarven_fungal_farm_08: "Farm Integration"
 building_dwarven_fungal_farm_08_desc: "The hold has made efforts to merge the mushroom plots under its control into larger sections under direct control. This allows for the maximization of planting and harvesting of foodstuffs for the hold."
 building_dwarven_fungal_farm_09: "Central Planning Initiatives"
 building_dwarven_fungal_farm_09_desc: "A central administration has been established to oversee the operations of the farms. Every harvest must be inspected and every mushroom approved before consumption."
 building_dwarven_fungal_farm_10: "Fungal Forest"
 building_dwarven_fungal_farm_10_desc: "The sprawling farms have reached an immensity unimaginable to the original colonists of the hold. In caverns the size of castles, great forests of fungi carpet the surfaces. The Hold meticulously catalogs and cultivates each section."
 building_dwarven_terrace_farm_01: "Root Excavations"
 building_dwarven_terrace_farm_01_desc: "The deep, fertile soil layers within the mountain are excavated and redistributed. Dwarven miners carefully carve out steps from the terrain upon which crops may be grown."
 building_type_dwarven_terrace_farm_01_desc: "Farming in mountainous or hilly terrain, whether it be above or below them, is a monumental task. One which the dwarves have perfected over the ages."
 building_dwarven_terrace_farm_02: "Strong Foundations"
 building_dwarven_terrace_farm_02_desc: "Expert stonemasons meticulously craft the terrace walls, ensuring their stability and durability. Each stone is placed with precision, creating a tiered structure that will support the weight of the crops and withstand the test of time for ages to come."
 building_dwarven_terrace_farm_03: "Irrigation Canals"
 building_dwarven_terrace_farm_03_desc: "Dwarven engineers channel water from under and overground water sources to irrigate the farm. Complex networks of aqueducts and channels are designed to distribute water evenly, guaranteeing optimal hydration for the crops throughout the entire farm."
 building_dwarven_terrace_farm_04: "Toolmaking"
 building_dwarven_terrace_farm_04_desc: "Blacksmiths forge specialized tools designed for terraced farming. These tools, with reinforced handles and unique blades, ensure the efficiency and productivity of the farm."
 building_dwarven_terrace_farm_05: "Crop Rotation"
 building_dwarven_terrace_farm_05_desc: "Meticulous crop rotation strategies are put in place, maximizing the fertility of the soil on each terrace. Dwarven farmers balance the needs of various crops, enhancing overall yield."
 building_dwarven_terrace_farm_06: "Subterranean Mirrors"
 building_dwarven_terrace_farm_06_desc: "A true marvel of dwarven engineering, an intricate network of giant mirrors is put in place that reflects the light of the sun that graces the top of the mountain onto the farm underground."
 building_dwarven_terrace_farm_07: "Mushroom Integration"
 building_dwarven_terrace_farm_07_desc: "Specialized fungi are introduced to the terraced fields, enhancing soil fertility and promoting symbiotic relationships with the crops. These carefully cultivated fungi contribute to the overall health of the farm's ecosystem."
 building_dwarven_terrace_farm_08: "Overlook Platforms"
 building_dwarven_terrace_farm_08_desc: "Majestic platforms are constructed along the edges of the terraces, offering elevated viewpoints for overseeing the expansive fields."
 building_dwarven_terrace_farm_09: "Subterranean Vaults"
 building_dwarven_terrace_farm_09_desc: "Massive storage vaults are carved out beneath the terraces. Dwarven miners create secure chambers to store the abundant harvest, preserving the fruits of their labour for times of need or trade."
 building_dwarven_terrace_farm_10: "A Reshaped Mountainside"
 building_dwarven_terrace_farm_10_desc: "A true triumph of dwarven engineering prowess. Dwarven engineers and farmers marvel at the landscape they have meticulously crafted, which can now be seen from a distance of several leagues, a testament to their dedication and ingenuity in transforming the mountain's embrace into a harmonious, productive masterpiece."
 building_dwarven_quarry_01: "Prospector's Camp"
 building_dwarven_quarry_01_desc: "A humble camp marks the beginning of dwarven industry; Dwarven engineers draw up plans, and the foremen can be heard shouting orders."
 building_type_dwarven_quarry_01_desc: "To turn the stone walls of mountains into grand halls, good quality stone must be excavated."
 building_dwarven_quarry_02: "Excavation Pits"
 building_dwarven_quarry_02_desc: "As the dwarves dig deeper, the excavation pits expand, revealing veins of precious minerals and hard stones for the construction of great halls."
 building_dwarven_quarry_03: "Workshops"
 building_dwarven_quarry_03_desc: "Craftsmen set up a workshop amidst the quarry, fashioning the first rough-hewn stones."
 building_dwarven_quarry_04: "Stonecutter's Guild"
 building_dwarven_quarry_04_desc: "A guild of skilled stonecutters forms, refining their techniques and producing expertly shaped stones."
 building_dwarven_quarry_05: "Refinery"
 building_dwarven_quarry_05_desc: "Dwarven engineers introduce refining facilities to extract the valuable ores from the rocks, elevating the quarry's production to include precious metals."
 building_dwarven_quarry_06: "Deep Mine Shafts"
 building_dwarven_quarry_06_desc: "Delving into the depths, the quarry expands with intricate mine shafts, reaching deeper into the mountain's heart to extract even more valuable resources."
 building_dwarven_quarry_07: "Vast Caverns"
 building_dwarven_quarry_07_desc: "Dwarven miners reveal caverns adorned with a variety of exquisite gemstones. These precious stones, after being carefully extracted, diversify the quarry's offerings."
 building_dwarven_quarry_08: "Mason's Workshops"
 building_dwarven_quarry_08_desc: "Workshops dedicated to the most skilled masons emerge, producing meticulously carved marble stones that will adorn the grand halls and facades of dwarven realms."
 building_dwarven_quarry_09: "Rune-carver's Atelier"
 building_dwarven_quarry_09_desc: "Dwarven rune-carvers establish an atelier and carve runes into stones. These runes are written in the old Dwarven script and reference multiple aspects of Dwarven culture."
 building_dwarven_quarry_10: "Grand Chasms"
 building_dwarven_quarry_10_desc: "The very pinnacle of dwarven quarrying achievement, this quarry is now a sanctuary of masterfully crafted stones and gems, representing the very soul of Dwarven architecture, and their enduring legacy has been etched into the very bedrock of Halann."
 building_dwarven_crafts_01: "Local Wares"
 building_dwarven_crafts_01_desc: "Local crafters have begun producing small trinkets of value. While unimpressive at the moment, it serves as the first step for an aspiring hold."
 building_type_dwarven_crafts_01_desc: "Crafts Guilds take the raw materials extracted from the mountain and turn them into all manner of valuables."
 building_dwarven_crafts_02: "Wrought Gold"
 building_dwarven_crafts_02_desc: "Hammers are used to beat gold into shape for ornamentation and jewelry."
 building_dwarven_crafts_03: "Decorative Trimming"
 building_dwarven_crafts_03_desc: "The Craftsdwarves of this hold have turned their talent to the inlay and trimming of precious metals in various rooms of the hold."
 building_dwarven_crafts_04: "Gemcutters"
 building_dwarven_crafts_04_desc: "Jewelers labour day and night to cut and grind gems mined in the hold. Special care is used to cut the gems to draw out their glittering beauty."
 building_dwarven_crafts_05: "Jewelers Guild"
 building_dwarven_crafts_05_desc: "Jewelers have begun organizing into guilds that ensure a consistent quality and sparkle to all gems worked within this hold."
 building_dwarven_crafts_06: "Filigree"
 building_dwarven_crafts_06_desc: "Thin, spiderweb-like veins of gold are sculpted into the jewelry crafted by this hold."
 building_dwarven_crafts_07: "Clockworks"
 building_dwarven_crafts_07_desc: "The expertise in fine detailing has allowed the guild dwarves to expand into the field of clockworks. Intricately crafted gears and springs are produced as works of art."
 building_dwarven_crafts_08: "Standardized Tools"
 building_dwarven_crafts_08_desc: "The introduction of mechanical molds allows for small levels of automation in the form of mechanical grinders. Guild efforts of standardizing jewelry-making tools ensure the same level of quality at all stages of production."
 building_dwarven_crafts_09: "Expansive Trade Networks"
 building_dwarven_crafts_09_desc: "This hold now sits at the center of a massive trading network; merchants from all corners come to buy the crafts made by the dwarves."
 building_dwarven_crafts_10: "An Exhibition of Wonders"
 building_dwarven_crafts_10_desc: "A grand hall has been set aside for the exhibition of the finest crafts of the hold. Tales of the crafts produced at this hold have a near-mythic quality to them. It is said that the crafts made here are unrivaled in all of Halann."
 building_dwarven_toolmaker_guild_01: "Local Handydwarves"
 building_dwarven_toolmaker_guild_01_desc: "Local Craftsdwarves have begun taking commissions for the construction of dwellings."
 building_type_dwarven_toolmaker_guild_01_desc: "These buildings supply all manners of tools necessary for the construction of a proper delving."
 dwarven_toolmaker_guild_01_effects_desc: "$unlocks_building_desc$Constructing the [GetBuilding('dwarven_armory_01').GetName] [building|E]\N"
 building_dwarven_toolmaker_guild_02: "Technical Drawings Office"
 building_dwarven_toolmaker_guild_02_desc: "The use of technical drawings allows for the planning and measurement of expansions to the hold, thus improving efficiency. This building consumes the most parchment of the entire hold."
 dwarven_toolmaker_guild_02_effects_desc: "$unlocks_building_desc$Constructing the [GetBuilding('dwarven_armory_02').GetName] [building|E]\N"
 building_dwarven_toolmaker_guild_03: "Dedicated Blacksmiths"
 building_dwarven_toolmaker_guild_03_desc: "Blacksmiths have been allocated for tool production full-time. Within their forges, they churn out a steady stream of tools for the hold."
 dwarven_toolmaker_guild_03_effects_desc: "$unlocks_building_desc$Constructing the [GetBuilding('dwarven_armory_03').GetName] [building|E]\N"
 building_dwarven_toolmaker_guild_04: "Journeyman Dwarves"
 building_dwarven_toolmaker_guild_04_desc: "An apprentice system has been set up for young dwarves to learn from the elder craftsdwarves... the free labour doesn't hurt either."
 dwarven_toolmaker_guild_04_effects_desc: "$unlocks_building_desc$Constructing the [GetBuilding('dwarven_armory_04').GetName] [building|E]\N"
 building_dwarven_toolmaker_guild_05: "Tool-Maker Guilds"
 building_dwarven_toolmaker_guild_05_desc: "The Tool Blacksmiths have begun to organize into guilds that act as a political entity in the hold. This has allowed for the expansion of their operations."
 dwarven_toolmaker_guild_05_effects_desc: "$unlocks_building_desc$Constructing the [GetBuilding('dwarven_armory_05').GetName] [building|E]\N"
 building_dwarven_toolmaker_guild_06: "Cranes"
 building_dwarven_toolmaker_guild_06_desc: "The importation of large quantities of wood has allowed the construction of cranes and pulleys to streamline the construction process."
 dwarven_toolmaker_guild_06_effects_desc: "$unlocks_building_desc$Constructing the [GetBuilding('dwarven_armory_06').GetName] [building|E]\N"
 building_dwarven_toolmaker_guild_07: "Steel Tools"
 building_dwarven_toolmaker_guild_07_desc: "The widescale implementation of steel tools improved the efficiency of construction efforts in the region. The dwarves of the hold have expressed a fondness for the durability of the steel tools."
 dwarven_toolmaker_guild_07_effects_desc: "$unlocks_building_desc$Constructing the [GetBuilding('dwarven_armory_07').GetName] [building|E]\N"
 building_dwarven_toolmaker_guild_08: "Standardized Molds"
 building_dwarven_toolmaker_guild_08_desc: "Standardized molds allow the blacksmiths of this hold to quickly manufacture tools of identical quality and durability. Molten metal is poured into the molds to cool into components for all manner of industry."
 dwarven_toolmaker_guild_08_effects_desc: "$unlocks_building_desc$Constructing the [GetBuilding('dwarven_armory_08').GetName] [building|E]\N"
 building_dwarven_toolmaker_guild_09: "Dwarven Inspectorate"
 building_dwarven_toolmaker_guild_09_desc: "This hold has established an inspector's office to oversee the efficiency and safety of the workshop. The permits and reports of this agency surpass the technical drawings in parchment usage."
 dwarven_toolmaker_guild_09_effects_desc: "$unlocks_building_desc$Constructing the [GetBuilding('dwarven_armory_09').GetName] [building|E]\N"
 building_dwarven_toolmaker_guild_10: "The Manufactorum"
 building_dwarven_toolmaker_guild_10_desc: "The scale of industry within this hold has reached an unfathomable scale. Within the walls of the factory complex, thousands of inhabitants live, work, and die. Tools are manufactured at a scale unseen elsewhere in Halann."
 dwarven_toolmaker_guild_10_effects_desc: "$unlocks_building_desc$Constructing the [GetBuilding('dwarven_armory_10').GetName] [building|E]\N"
 building_dwarven_vaults_01: "A Barred Door"
 building_dwarven_vaults_01_desc: "Dwarves have begun to fortify their hold, affixing a bar across the hold's main gate."
 building_type_dwarven_vaults_01_desc: "The riches of a delving are oft highly sought after by envious eyes, thus measures need to be taken to safeguard it."
 building_dwarven_vaults_02: "Earthworks"
 building_dwarven_vaults_02_desc: "Earth and Stone has been molded into a crude approximation of a wall, protecting the main gate and providing cover for stationed defenders."
 building_dwarven_vaults_03: "Gatehouse"
 building_dwarven_vaults_03_desc: "The main gate has been reinforced with a portcullis. Defenders stand watch atop stone battlements overlooking the streets below."
 building_dwarven_vaults_04: "Arrow Slits"
 building_dwarven_vaults_04_desc: "Thin arrow slits dot the towers overlooking the main gate. Archers peer through the cracks on passersby below, waiting to rain death from above."
 building_dwarven_vaults_05: "Killbox"
 building_dwarven_vaults_05_desc: "Stone walls have been erected to funnel attackers into a clearing where they are struck from all sides by all manner of bolts and stones."
 building_dwarven_vaults_06: "Moat"
 building_dwarven_vaults_06_desc: "A deep moat has been carved in the stone, filled to the brim with water pumped from underground lakes."
 building_dwarven_vaults_07: "Boiling Oil"
 building_dwarven_vaults_07_desc: "Pipes have been placed above the castle gate allowing for defenders to drop boiling oil down on besiegers."
 building_dwarven_vaults_08: "Trenches"
 building_dwarven_vaults_08_desc: "Spiked trenches have been placed between the moat and the wall, any orc or goblin looking to smash the wall must take care not to impale themselves on the spikes below."
 building_dwarven_vaults_09: "Defense in Depth"
 building_dwarven_vaults_09_desc: "Concentric Walls have been placed on each level of the hold. Any would-be besieger must fight from wall to wall while being harried from all sides."
 building_dwarven_vaults_10: "An Unassailable Stronghold"
 building_dwarven_vaults_10_desc: "This fortress has become on par with the great fortress cities of ages long past. Whole armies have retreated at the sight of these formidable defenses. A deadly array of traps and barricades litter the hold, detering all aggressors."
 building_dwarven_roads_01: "Rudimentary Tunnels"
 building_dwarven_roads_01_desc: "The construction of tunnels throughout the Hold has enabled faster travel from one end to the other."
 building_type_dwarven_roads_01_desc: "$building_dwarven_roads_01_desc$"
 building_dwarven_roads_02: "Pulley Systems"
 building_dwarven_roads_02_desc: "The implementation of pulley systems has helped connect different levels of the Hold far more efficiently. This connection also allows for easier transportation of materials and messages."
 building_type_dwarven_roads_02_desc: "$building_dwarven_roads_02_desc$"
 building_dwarven_roads_03: "Arches"
 building_dwarven_roads_03_desc: "Supporting Arches have been erected to hold up the multilayered passages threaded across the mountain."
 building_type_dwarven_roads_03_desc: "$building_dwarven_roads_03_desc$"
 building_dwarven_roads_04: "Torch-lit Caverns"
 building_dwarven_roads_04_desc: "The Denizens of this Hold have fully illuminated the caverns, bypassing the need for natural light."
 building_type_dwarven_roads_04_desc: "$building_dwarven_roads_04_desc$"
 building_dwarven_roads_05: "Dwarven Concrete"
 building_dwarven_roads_05_desc: "Dwarven experiments have produced a semi-liquid substance that hardens into stone. The substance's unparalled strength allows for the creation of more advanced structures."
 building_type_dwarven_roads_05_desc: "$building_dwarven_roads_05_desc$"
 building_dwarven_roads_06: "Standardized Timekeeping"
 building_dwarven_roads_06_desc: "Clocks have been placed throughout the hold in order to create one local time observed throughout the Hold."
 building_type_dwarven_roads_06_desc: "$building_dwarven_roads_06_desc$"
 building_dwarven_roads_07: "Load Bearing Stones"
 building_dwarven_roads_07_desc: "Well placed stones are used to reduce the number of required pillars, and enables some open spaces."
 building_type_dwarven_roads_07_desc: "$building_dwarven_roads_07_desc$"
 building_dwarven_roads_08: "Earthquake Resistance"
 building_dwarven_roads_08_desc: "Dampers have been set in key load bearing areas to lessen the damage caused by Earthquakes."
 building_type_dwarven_roads_08_desc: "$building_dwarven_roads_08_desc$"
 building_dwarven_roads_09: "Domes"
 building_dwarven_roads_09_desc: "With the construction of Domes, large amounts of space has been opened up. These areas are used to support the increasing population of the Hold."
 building_type_dwarven_roads_09_desc: "$building_dwarven_roads_09_desc$"
 building_dwarven_roads_10: "Mastery of the Mountain"
 building_dwarven_roads_10_desc: "This Hold has become a logistical marvel. People from far-flung areas visit to stare in awe, or furiously jot down notes. Despite all the obstacles that the Denizens faced, the Hold can be said to have overcome every challenge the Mountain has thrown at them."
 building_type_dwarven_roads_10_desc: "$building_dwarven_roads_10_desc$"
 building_dwarven_forge_01: "Charcoal Hearth"
 building_dwarven_forge_01_desc: "A small hearth of stone, fueled by charcoal. It can smelt only limited quantities of ore, but it marks the beginning of organised metalworking."
 building_type_dwarven_forge_01_desc: "Forges take the best materials and tools of the Dwarven people to forge artifacts to show off to the peoples of Halann."
 dwarven_forge_cap: "You can only have one active Forge in your domain and it must be in your capital"
 building_dwarven_forge_02: "Twin Bellows"
 building_dwarven_forge_02_desc: "Large, hand-pumped bellows allow higher and more consistent heat, producing stronger ingots and sturdier tools."
 building_dwarven_forge_03: "Stone Forges"
 building_dwarven_forge_03_desc: "Durable stone-lined forges provide better insulation and efficiency. The fires now reach hotter and steadier temperatures for advanced smithing."
 building_dwarven_forge_04: "Bloomery Forges"
 building_dwarven_forge_04_desc: "Enclosed bloomeries refine ore more efficiently, producing purer iron and the first reliable steels. Weapons and armor gain in quality."
 building_dwarven_forge_05: "Water-driven Bellows"
 building_dwarven_forge_05_desc: "Ingenious mechanisms use flowing water to drive great bellows. The forges burn hotter with less labor, allowing larger and more complex works."
 building_dwarven_forge_06: "Blast Furnaces"
 building_dwarven_forge_06_desc: "Towering furnaces smelt ore in great quantities, yielding consistent high-quality steel. Smithing output increases dramatically."
 building_dwarven_forge_07: "Forge Complexes"
 building_dwarven_forge_07_desc: "Entire halls are now devoted to smelting and smithing, with multiple furnaces, anvils, and workstations. Mass production of arms, tools, and armor is achieved."
 building_dwarven_forge_08: "Mechanised Hammers"
 building_dwarven_forge_08_desc: "Waterwheels and gears drive enormous hammers, striking with perfect rhythm. Heavy forging tasks are automated, freeing artisans for precise finishing."
 building_dwarven_forge_09: "Integrated Foundries"
 building_dwarven_forge_09_desc: "Ore smelting, forging, and finishing are integrated within vast foundries. Efficiency and scale reach heights no other folk can match."
 building_dwarven_forge_10: "The Great Forge"
 building_dwarven_forge_10_desc: "A central forge of unmatched design dominates the hold, combining the most advanced furnaces, mechanization, and ventilation systems. Here, the finest works of dwarven craft are produced in unending fire."
 building_dwarven_hoard_01: "Hall of Ingots"
 building_dwarven_hoard_01_desc: "In this initial chamber, dwarven blacksmiths proudly display freshly forged ingots of precious metal. The flickering light from the myriad metals adds a warm glow to the surroundings, signaling the beginning of the hoard's collection."
 building_type_dwarven_hoard_01_desc: "The dwarven Treasure Hoard stands as a majestic repository for treasures gathered from the depths of the mountain; meticulously curated and fiercely guarded."
 has_mines_06_or_higher: "Has any mineral deposit Mine [building|E] of Level VI or higher"
 building_dwarven_hoard_02: "Gemstone Gallery"
 building_dwarven_hoard_02_desc: "The hoard has expanded into vaults adorned with carefully embedded gemstones, creating a dazzling mosaic of luster and light. Each gem tells a story of fine dwarven craftsmanship and adds a vibrant allure to the accumulating treasures."
 has_mines_07_or_higher: "Has any mineral deposit Mine [building|E] of Level VII or higher"
 building_dwarven_hoard_03: "Ancestral Reliquary"
 building_dwarven_hoard_03_desc: "Within these hallowed halls, ancient relics and ancestral heirlooms find their place. Dwarves honour their heritage, showcasing artifacts passed down through generations, each item contributing to the hoard's cultural significance."
 has_mines_08_or_higher: "Has any mineral deposit Mine [building|E] of Level VIII or higher"
 building_dwarven_hoard_04: "Regal Treasury Chambers"
 building_dwarven_hoard_04_desc: "The hoard ascends into regal treasury chambers, featuring ornate displays of crowns, scepters, and other symbols of dwarven authority. The air is thick with an aura of opulence, showcasing the Dwarves' noble heritage."
 building_dwarven_hoard_05: "Citadel of Treasures"
 building_dwarven_hoard_05_desc: "Reaching the zenith of dwarven opulence, this Citadel is a monumental structure carved deep into the heart of the mountain. Here, the hoard is safeguarded by formidable defenses, and its treasures beyond measure are a source of awe and envy across Halann."
 building_dwarven_armory_01: "Basic Stockpiles"
 building_dwarven_armory_01_desc: "The construction of storage rooms for weapons and armour has raised the quality of the average soldier."
 building_type_dwarven_armory_01_desc: "$building_dwarven_armory_01_desc$"
 dwarven_armory_01_effects_desc: "Constructing the [GetBuilding('dwarven_hi_barracks_01').GetName] [building|E]\NConstructing the [GetBuilding('dwarven_pike_barracks_01').GetName] [building|E]\NConstructing the [GetBuilding('dwarven_archer_barracks_01').GetName] [building|E]\NConstructing the [GetBuilding('dwarven_skirmisher_barracks_01').GetName] [building|E]\NConstructing the [GetBuilding('dwarven_siege_workshop_01').GetName] [building|E]\N"
 building_dwarven_armory_02: "Gambesons"
 building_dwarven_armory_02_desc: "This Hold has standardized the use of Gambesons, and Armouries throughout are equipped to replace it."
 building_type_dwarven_armory_02_desc: "$building_dwarven_armory_02_desc$"
 dwarven_armory_02_effects_desc: "Constructing the [GetBuilding('dwarven_hi_barracks_02').GetName] [building|E]\NConstructing the [GetBuilding('dwarven_pike_barracks_02').GetName] [building|E]\NConstructing the [GetBuilding('dwarven_archer_barracks_02').GetName] [building|E]\NConstructing the [GetBuilding('dwarven_skirmisher_barracks_02').GetName] [building|E]\NConstructing the [GetBuilding('dwarven_siege_workshop_02').GetName] [building|E]\N"
 building_dwarven_armory_03: "Improved Whetstones"
 building_dwarven_armory_03_desc: "Soldiers are now equipped with their own care kit. The whetstones ensure a keen edge for every weapon."
 building_type_dwarven_armory_03_desc: "$building_dwarven_armory_03_desc$"
 dwarven_armory_03_effects_desc: "Constructing the [GetBuilding('dwarven_hi_barracks_03').GetName] [building|E]\NConstructing the [GetBuilding('dwarven_pike_barracks_03').GetName] [building|E]\NConstructing the [GetBuilding('dwarven_archer_barracks_03').GetName] [building|E]\NConstructing the [GetBuilding('dwarven_skirmisher_barracks_03').GetName] [building|E]\NConstructing the [GetBuilding('dwarven_siege_workshop_03').GetName] [building|E]\N"
 building_dwarven_armory_04: "Chain Mail"
 building_dwarven_armory_04_desc: "Links of chain are threaded together to create a more flexible armour resistant to slashing attacks and denting."
 building_type_dwarven_armory_04_desc: "$building_dwarven_armory_04_desc$"
 dwarven_armory_04_effects_desc: "Constructing the [GetBuilding('dwarven_hi_barracks_04').GetName] [building|E]\NConstructing the [GetBuilding('dwarven_pike_barracks_04').GetName] [building|E]\NConstructing the [GetBuilding('dwarven_archer_barracks_04').GetName] [building|E]\NConstructing the [GetBuilding('dwarven_skirmisher_barracks_04').GetName] [building|E]\NConstructing the [GetBuilding('dwarven_siege_workshop_04').GetName] [building|E]\N"
 building_dwarven_armory_05: "Cleaning Oil"
 building_dwarven_armory_05_desc: "Through using a more effective cleaning oil, the damage caused by rust is reduced significantly."
 building_type_dwarven_armory_05_desc: "$building_dwarven_armory_05_desc$"
 dwarven_armory_05_effects_desc: "Constructing the [GetBuilding('dwarven_hi_barracks_05').GetName] [building|E]\NConstructing the [GetBuilding('dwarven_pike_barracks_05').GetName] [building|E]\NConstructing the [GetBuilding('dwarven_archer_barracks_05').GetName] [building|E]\NConstructing the [GetBuilding('dwarven_skirmisher_barracks_05').GetName] [building|E]\NConstructing the [GetBuilding('dwarven_siege_workshop_05').GetName] [building|E]\N"
 building_dwarven_armory_06: "Grindstones"
 building_dwarven_armory_06_desc: "Advanced Grindstones enable the use of sharper weapons and makes sure they are well maintained."
 building_type_dwarven_armory_06_desc: "$building_dwarven_armory_06_desc$"
 dwarven_armory_06_effects_desc: "Constructing the [GetBuilding('dwarven_hi_barracks_06').GetName] [building|E]\NConstructing the [GetBuilding('dwarven_pike_barracks_06').GetName] [building|E]\NConstructing the [GetBuilding('dwarven_archer_barracks_06').GetName] [building|E]\NConstructing the [GetBuilding('dwarven_skirmisher_barracks_06').GetName] [building|E]\N"
 building_dwarven_armory_07: "Lamellar Armour"
 building_dwarven_armory_07_desc: "Consisting of a series of interwoven metal strips, this design allows for improved protection and easier repair due to the ability to replace individual strips."
 building_type_dwarven_armory_07_desc: "$building_dwarven_armory_07_desc$"
 dwarven_armory_07_effects_desc: "Constructing the [GetBuilding('dwarven_hi_barracks_07').GetName] [building|E]\NConstructing the [GetBuilding('dwarven_pike_barracks_07').GetName] [building|E]\NConstructing the [GetBuilding('dwarven_archer_barracks_07').GetName] [building|E]\NConstructing the [GetBuilding('dwarven_skirmisher_barracks_07').GetName] [building|E]\N"
 building_dwarven_armory_08: "Reinforced Shields"
 building_dwarven_armory_08_desc: "The use of Iron enables more protective shields that also require less replacement. Attacks slide off the shields with nary a scratch."
 building_type_dwarven_armory_08_desc: "$building_dwarven_armory_08_desc$"
 dwarven_armory_08_effects_desc: "Constructing the [GetBuilding('dwarven_hi_barracks_08').GetName] [building|E]\NConstructing the [GetBuilding('dwarven_pike_barracks_08').GetName] [building|E]\NConstructing the [GetBuilding('dwarven_archer_barracks_08').GetName] [building|E]\NConstructing the [GetBuilding('dwarven_skirmisher_barracks_08').GetName] [building|E]\N"
 building_dwarven_armory_09: "Plate Armour"
 building_dwarven_armory_09_desc: "Compared to previous sets, plate armour offers full body coverage. Any soldier wearing this would strike fear into the hearts of enemies."
 building_type_dwarven_armory_09_desc: "$building_dwarven_armory_09_desc$"
 dwarven_armory_09_effects_desc: "Constructing the [GetBuilding('dwarven_hi_barracks_09').GetName] [building|E]\NConstructing the [GetBuilding('dwarven_pike_barracks_09').GetName] [building|E]\NConstructing the [GetBuilding('dwarven_archer_barracks_09').GetName] [building|E]\NConstructing the [GetBuilding('dwarven_skirmisher_barracks_09').GetName] [building|E]\N"
 building_dwarven_armory_10: "Arsenal of Balgar"
 building_dwarven_armory_10_desc: "Armouries of this Hold have reached a dizzying level. The Quartermasters have organized into a veritable army capable of repairing or replacing nearly anything. It is said that if a Dwarf scratches his helm, he cannot walk three steps without receiving a new one."
 building_type_dwarven_armory_10_desc: "$building_dwarven_armory_10_desc$"
 dwarven_armory_10_effects_desc: "Constructing the [GetBuilding('dwarven_hi_barracks_10').GetName] [building|E]\NConstructing the [GetBuilding('dwarven_pike_barracks_10').GetName] [building|E]\NConstructing the [GetBuilding('dwarven_archer_barracks_10').GetName] [building|E]\NConstructing the [GetBuilding('dwarven_skirmisher_barracks_10').GetName] [building|E]\N"
 building_dwarven_hi_barracks_01: "Short Swords"
 building_dwarven_hi_barracks_01_desc: "By equipping heavily armored units with a short sword, they can wield a shield with one hand and thrust with the other."
 building_type_dwarven_hi_barracks_01_desc: "The small stature of the dwarves has left them without the means to strike and retreat as quickly as other races, by fielding units clad in heavy armor they can form an immovable rock upon which the enemy waves will crash."
 building_dwarven_hi_barracks_02: "Tip of the Sword"
 building_dwarven_hi_barracks_02_desc: "Our enemies shall break upon our armored vanguard, they shall advance in an unyielding wall of iron to reclaim what is ours."
 building_dwarven_hi_barracks_03: "Swordsmiths"
 building_dwarven_hi_barracks_03_desc: "The addition of dedicated swordsmiths allows for improved maintenance and honing of this unit's weapons. "
 building_dwarven_hi_barracks_04: "Squad Tactics"
 building_dwarven_hi_barracks_04_desc: "By forming dedicated squads within our lines we can allow for independent action and adaptation in the event that our line breaks."
 building_dwarven_hi_barracks_05: "Axedwarf Regiments"
 building_dwarven_hi_barracks_05_desc: "The addition of Axedwarves as auxiliaries provides the damage needed to topple much larger foes while the shield walls pin them."
 building_dwarven_hi_barracks_06: "Improved Armoring"
 building_dwarven_hi_barracks_06_desc: "The Blacksmiths of this hold have begun to slope armor in sch a way that most enemy attacks slide off it with ease."
 building_dwarven_hi_barracks_07: "Advanced Tactics"
 building_dwarven_hi_barracks_07_desc: "Commanders of this hold have been educated in the best way to utilize the combination of the shield wall and the Axedwarves, wringing the most effectiveness possible out of the combination."
 building_dwarven_hi_barracks_08: "Arms Honed and Sharp"
 building_dwarven_hi_barracks_08_desc: "Fierce training and maintenance has yielded a unit that is ready to defend the hold at a minutes notice."
 building_dwarven_hi_barracks_09: "Dwarven Steel"
 building_dwarven_hi_barracks_09_desc: "Blacksmiths of this hold have begun producing swords and axes woven with powerful magic and durability. The blades forged have a strange wavy design in the steel, the edges of these blades stay sharp for much longer than their less developed counterparts."
 building_dwarven_hi_barracks_10: "Iron Tortoise"
 building_dwarven_hi_barracks_10_desc: "The Tactical knowledge and material advancements have led the Dwarves to adopt an innovative new strategy. By interlocking shields on the sides and above the regiment, arrows and projectiles bounce off with nary a scratch. Rumor has it that one Iron Tortoise can withstand the attack of an entire goblin tribe."
 building_dwarven_pike_barracks_01: "Lockstep Formations"
 building_dwarven_pike_barracks_01_desc: "In the tight quarters of an underground tunnel, a spear formation can lock down an area and prevent entry into more vulnerable sections of a hold. By training speardwarves in this style of defense, they can maximize the effectiveness of their warriors."
 building_type_dwarven_pike_barracks_01_desc: "While the confines of the a delving are generally bereft of mounted riders to counter, dwarves have discovered another use for the spear wall as a means to deny access to a chokepoint."
 building_dwarven_pike_barracks_02: "A Keen Edge"
 building_dwarven_pike_barracks_02_desc: "Dwarven craftsmen are renowned for their ability to hone a mere metal ingot into a lethal weapon of exacting sharpness. The edge of such a spear is able to pierce flesh and leather in a single thrust."
 building_dwarven_pike_barracks_03: "Reinforced Haft"
 building_dwarven_pike_barracks_03_desc: "Due to the use of iron bolts to bind the head of the spear to the haft, this allows the spear to hold up to more damage before needing repairs."
 building_dwarven_pike_barracks_04: "Longer Pikes"
 building_dwarven_pike_barracks_04_desc: "Dwarves have enhanced their spear hafts such that they can support a increased length."
 building_dwarven_pike_barracks_05: "Pike Storage"
 building_dwarven_pike_barracks_05_desc: "Army camps have begun organizing a central stockpile for units on campaign. This cuts down of lost or damaged weapons and improves efficiency."
 building_dwarven_pike_barracks_06: "Pike Maintenance Kits"
 building_dwarven_pike_barracks_06_desc: "maintenance, kits including spare spearheads, allows dwarven pikemen to remain in the fray for longer periods of time without the blade chipping or growing dull."
 building_dwarven_pike_barracks_07: "Spear Guards"
 building_dwarven_pike_barracks_07_desc: "Small wing-like protrusions on either side of the spearhead allow for a speardwarf to redirect enemy attacks or force their weapons away."
 building_dwarven_pike_barracks_08: "Aggressive Tactics"
 building_dwarven_pike_barracks_08_desc: "While defensive formations are useful in the tunnels below, compact defensive formations suffer on the surface where archers can pelt spearmen with arrows. Coordiated spear charges preserve the strengths of a spear wall but remain mobile enough to mitigate ranged damage."
 building_dwarven_pike_barracks_09: "Shield Wall"
 building_dwarven_pike_barracks_09_desc: "With the addition of shields to spear formations are a boon to our military. Shields and spears can halt the strongest cavalry charge or shelter dwarves from arrows above."
 building_dwarven_pike_barracks_10: "Pike and Bolts"
 building_dwarven_pike_barracks_10_desc: "Dwarven pikes squads have been supplemented with the odd crossbowdwarf. As the Archers rain death onto those below, the speardwarves form an unyielding wall of iron."
 building_dwarven_archer_barracks_01: "Recurve Bows"
 building_dwarven_archer_barracks_01_desc: "This design helps make up for the small stature of dwarves by more efficiently storing power."
 building_type_dwarven_archer_barracks_01_desc: "The use of Archers is invaluable for the dwarves, as the ranged attacks help defend against orc threats while reducing casualties."
 building_dwarven_archer_barracks_02: "Specialized Wood"
 building_dwarven_archer_barracks_02_desc: "The use of wood specifically for making bows and arrows allows for stronger and longer lasting weapons."
 building_dwarven_archer_barracks_03: "Archer Tactics"
 building_dwarven_archer_barracks_03_desc: "By training Archers in firing as a group, the arrows are much more likely to hit their targets. The morale damage caused by this is also significant."
 building_dwarven_archer_barracks_04: "Personal Storage Cases"
 building_dwarven_archer_barracks_04_desc: "All Archers in this Hold have been issued their own personal boxes for storing bows, extra strings, and any other necessities. This shall ensure that the regiments will always be prepared, no matter where they fight."
 building_dwarven_archer_barracks_05: "Crossbows"
 building_dwarven_archer_barracks_05_desc: "The widespread use of Crossbows has greatly improved the fighting power of the Hold, as they require vastly less training and strength in order to achieve the same effectiveness as other bows."
 building_dwarven_archer_barracks_06: "Improved Maintenance"
 building_dwarven_archer_barracks_06_desc: "Quartermasters throughout the Hold have standardized Bow maintenance, and the use of tools like wax is now common practice."
 building_dwarven_archer_barracks_07: "Sharpened Arrowheads"
 building_dwarven_archer_barracks_07_desc: "Blacksmiths in this hold have begun phasing out the old Iron arrowheads in favor of newer Dwarven Steel. The Arrows will now be sharper than ever before, and be able to pierce the armour of nearly any foe."
 building_dwarven_archer_barracks_08: "Advanced Fletching"
 building_dwarven_archer_barracks_08_desc: "The creation of a Fletchers Guild has greatly increased the quality of feathers used in arrows and bolts. This results in much more accurate Archer fire."
 building_dwarven_archer_barracks_09: "Heat Resistance"
 building_dwarven_archer_barracks_09_desc: "Improved bow-making practices help increase the heat resistance of bows and arrows both in the Hold and on the field."
 building_dwarven_archer_barracks_10: "Steel Rain"
 building_dwarven_archer_barracks_10_desc: "The Archer regiments in this Hold have become so accurate at such long distances, that it is rare for enemies to ever notice the death that awaits them. When they do notice, the arrows are numerous enough that they fall down on their foes like a sudden Avalanche."
 building_dwarven_skirmisher_barracks_01: "Training Grounds"
 building_dwarven_skirmisher_barracks_01_desc: "An open area has been set up, and Skirmishers practice sprinting from one end to the other. This increases the fitness and mobility of the troops."
 building_type_dwarven_skirmisher_barracks_01_desc: "Dwarves have a major weakness, as they have far less mobility due to their use of heavy weapons and armor. Skirmishers play a key role to address this; though they are not as equipped, they make use of their natural ability to sprint across short distances and chase their foes."
 building_dwarven_skirmisher_barracks_02: "Javelins"
 building_dwarven_skirmisher_barracks_02_desc: "Skirmishers are now equipped with Javelins, which can be used to harass enemy forces before any engagement."
 building_dwarven_skirmisher_barracks_03: "Improved Boots"
 building_dwarven_skirmisher_barracks_03_desc: "New footwear has been designed to accommodate the needs of the troops, and pursuing the enemy is easier than ever before."
 building_dwarven_skirmisher_barracks_04: "Skirmisher Tactics"
 building_dwarven_skirmisher_barracks_04_desc: "Skirmishers are now trained in envelopment tactics. This allows them to surround and destroy slower moving enemies."
 building_dwarven_skirmisher_barracks_05: "Falchions"
 building_dwarven_skirmisher_barracks_05_desc: "The Blacksmiths of this Hold on request have created lighter, thinner curved blades that can be held in one hand. These swords significantly increase the fighting capabilities of Skirmishers."
 building_dwarven_skirmisher_barracks_06: "Open Order"
 building_dwarven_skirmisher_barracks_06_desc: "The men have become skilled enough that they can operate on their own initiative, and are able to make quick decisions to turn the tide of battle."
 building_dwarven_skirmisher_barracks_07: "Standard Issue Daggers"
 building_dwarven_skirmisher_barracks_07_desc: "The troops have also been equipped with Dwarven Steel daggers, which enable more effective combat in close quarters."
 building_dwarven_skirmisher_barracks_08: "Advanced Surveys"
 building_dwarven_skirmisher_barracks_08_desc: "By scouting out the terrain beforehand, the Skirmishers maintain a great advantage in any battle."
 building_dwarven_skirmisher_barracks_09: "Field Supplies"
 building_dwarven_skirmisher_barracks_09_desc: "The Quartermasters of this Hold have prepared kits for the Skirmishers, which allow them to move and fight through even the roughest of terrain."
 building_dwarven_skirmisher_barracks_10: "Espionage Masters"
 building_dwarven_skirmisher_barracks_10_desc: "These Skirmishers have become unrivaled in their understanding of terrain, and are fast enough to utilize this knowledge to the greatest advantage. It is said that any enemy who dares challenge these troops is surrounded before they even have time to blink."
 building_dwarven_siege_workshop_01: "Slings"
 building_dwarven_siege_workshop_01_desc: "Dwarven Engineers have devised a way to utilize slings in order to increase the length of the throwing arm, which allows for a greater range of fire."
 building_type_dwarven_siege_workshop_01_desc: "In order to break through the immense fortifications that Delvings possess, dwarves have developed advanced Siege Engines capable of tearing down the Bastions of their foes."
 building_dwarven_siege_workshop_02: "Iron Sights"
 building_dwarven_siege_workshop_02_desc: "Two iron markers have been attached to the front and rear end of the Siege Engines. This helps the crew aim easier at longer distances."
 building_dwarven_siege_workshop_03: "Specialization"
 building_dwarven_siege_workshop_03_desc: "Dwarves in this Hold have created different types of ammunition, with each type serving a unique purpose. Due to this, sieges have become much faster."
 building_dwarven_siege_workshop_04: "Improved Maintenance"
 building_dwarven_siege_workshop_04_desc: "After many years spent training, the dwarves have become extremely efficient in disassembling and reassembling siege engines for travel. They can also find any problems and fix them before they impact the war effort."
 building_dwarven_siege_workshop_05: "Controlled Demolition"
 building_dwarven_siege_workshop_05_desc: "The dwarves have perfected the art of besieging to a terrifying degree. It is said that these siege engines have become so powerful that they could bring down the walls of Barad-dûr itself."
 building_military_specialization_01: "Conscription Rolls"
 building_military_specialization_01_desc: "The first step to ensuring an organized, professional army is to ensure we have the Dwarves to fight in it. A quick census of our mansion and we can have the name of every Dwarf living here, their age, health and with a bit of extra effort, their skill with an axe or a spear. Once this is implemented, we'll be able to call upon those with the most promise to come and join the ranks of our army. "
 building_type_military_specialization_01_desc: "A change is being seen in the people of our mansion. Dwarves are no strangers to warfare, but even we can see that the world has been turning dark as of late. All around us we can see the signs of war to come, and the only way to survive is to ensure we can defeat our enemies in the field, all whilst maintaining the safety of our homes our brave soldiers leave behind. We must make sure that our outer holds conform to our new standards of quality, and centralize the army in this Mansion. Only by organizing a standard, professional army can we hope to survive the coming days."
 military_specialization_01_effects_desc: "$unlocks_building_desc$Constructing the [GetBuilding('dwarven_kings_armory_military_01').GetName] [building|E]\N"
 building_military_specialization_02: "Uniform Regiments"
 building_military_specialization_02_desc: "What good is having an army of Dwarves if we have nothing to arm them with? What good is a wall of spears if the Dwarf at the end has one a foot shorter than the others? And what good is a unit of axes if half are better at felling trees than hacking off limbs? Only by establishing strict regulations about the materials and designs of our arms and armor can we avoid these flaws. Specialty craft will be reserved for our greatest, and noble warriors, while our rank and file will be indistinguishable. While our soldiers might feel as if they are just another mass produced tool like their equipment, it will help keep them and their families alive, and none can argue with that."
 military_specialization_02_effects_desc: "$unlocks_building_desc$Constructing the [GetBuilding('dwarven_kings_armory_military_02').GetName] [building|E]\N"
 building_military_specialization_03: "The Weight of a Mountain"
 building_military_specialization_03_desc: "As our foes gather around us, it comes time to send our brave Dwarves off to war. With a rhythmic tune from their lock step mixed with long trumpet blares and slow beating drums, they sing a song of goodbye to those who gathered around to watch the parade. A song for their families. A song for their friends. A song for their loved ones. Those who many might never see again. But these warriors go not because they are forced to, but because they are brave enough to know that they must defend their homes. All so that those left behind can live in safety. It's never an easy choice, but these Dwarves carry a heavy burden on their shoulders. The fate of our home rests with them, and we shall give them everything for their sacrifice."
 military_specialization_03_effects_desc: "$unlocks_building_desc$Constructing the [GetBuilding('dwarven_kings_armory_military_03').GetName] [building|E]\N"
 building_economic_specialization_01: "Dug-out Trading Squares"
 building_economic_specialization_01_desc: "It's not easy to trade when you live on a mountain. It's even harder when you live under one. While we cannot compromise the safety of our mansion by creating weaknesses, through great effort we can carve out carefully monitored tunnels to the outside, and create some manner of infrastructure that is designed in such a way to encourage the people of our home to congregate in this market square."
 building_type_economic_specialization_01_desc: "Our home stands on the threshold of unparalleled wealth and prosperity. Everyday, mines are dug deeper and more buildings are constructed for our people to live and work in. We are on the right track, but now it is time to do what Dwarves do best. It is time to begin to truly extract all the value we possibly can from our great mansion and see the wealth of our realm overflow."
 economic_specialization_01_effects_desc: "$unlocks_building_desc$Constructing the [GetBuilding('dwarven_bank_economic_01').GetName] [building|E]\N"
 building_economic_specialization_02: "A Conclave of Merchants"
 building_economic_specialization_02_desc: "With us opening ourselves to the world and allowing the wealth of our people to flow freely, the shrewdest among us have begun to accumulate vast amounts of wealth. Clearly these Dwarves understand trade, and our lord could only benefit from their wisdom. By constructing extravagant meeting halls and seating our lord at the top, we can bring these wise folk in to offer their advice on matters of trade and profit. With their help, everyone will be richer. "
 economic_specialization_02_effects_desc: "$unlocks_building_desc$Constructing the [GetBuilding('dwarven_bank_economic_02').GetName] [building|E]\N"
 building_economic_specialization_03: "Gold Beyond Measure"
 building_economic_specialization_03_desc: "Our home has been utterly transformed. Our mansion has been filled with markets that are abuzz with the constant bustle of trade and finance, spurred on by the cleverly crafted infrastructure centralizing these locations. The wealth of Halann is brought from the depths below and sculpted into the grandest finery that is the desire of the world. Our great hoard is stacked to the ceiling, and even our people are achieving such wealth that many have small hoards of their own within their homes."
 economic_specialization_03_effects_desc: "$unlocks_building_desc$Constructing the [GetBuilding('dwarven_bank_economic_03').GetName] [building|E]\N"
 building_glory_specialization_01: "Expert Architecture"
 building_glory_specialization_01_desc: "To build something is a difficult task. To built it in such a way as to be deserving of the word 'beautiful' is even harder. And to do it in such a way as to not destroy the natural beauty around it, but enhance it is the hardest of all. But time is something that we have, and so a Dwarf can spend years making sure the stone is chiseled just right."
 building_type_glory_specialization_01_desc: "Dwarves have built great and beautiful things many times before. And now we shall do so again. Through Dwarven ingenuity and diligence we shall build an eloquent home that incorporates the natural beauty of these caverns with the craftsmanship we know we possess. It will be a long and hard process to create a home that all would gaze upon and weep for with its beauty, but there is much to be said for the stubbornness of Dwarves."
 glory_specialization_01_effects_desc: "$unlocks_building_desc$Constructing the [GetBuilding('dwarven_grand_library_01').GetName] [building|E]\N"
 building_glory_specialization_02: "The Great Halls"
 building_glory_specialization_02_desc: "Every mansion has its ruler, and every ruler needs their seat. Ours however, must stand higher than the rest, both literally and figuratively. All will stand in awe at the magnificence of our halls, filled with the highest pillars of the sturdiest rock, each lined with an ever burning torch. Atop the ceiling it shall be littered with sapphires and diamonds, and given just enough light to cause them to twinkle like stars in the night sky. And at the end of the hall sits a magnificent throne of gold, silver and stone atop perfectly even steps. Just right for those visiting to kneel upon and show their fealty."
 glory_specialization_02_effects_desc: "$unlocks_building_desc$Constructing the [GetBuilding('dwarven_grand_library_02').GetName] [building|E]\N"
 building_glory_specialization_03: "A Subterranean Paradise"
 building_glory_specialization_03_desc: "Where once there was a dark, dank cave, we have built a paradise. Our artisans have worked day and night to ensure that every building, bridge and path has been crafted to exquisite perfection. Quaint bridges span over the subterranean waters, their crystalline waters reflecting the radiant hues of light that spill in through cleverly dug out cracks in the rocky ceiling above. And in the center of it all is our grand palace. Intricately designed and excessive in all manners, it is a place the Fathers themselves would hold in esteem. We had to grind much stone to achieve this view, but it was all worth it."
 glory_specialization_03_effects_desc: "$unlocks_building_desc$Constructing the [GetBuilding('dwarven_grand_library_03').GetName] [building|E]\N"
 building_dwarven_bank_economic_01: "Prospector's Vault"
 building_dwarven_bank_economic_01_desc: "The Prospector's Vault serves as the foundational establishment of any dwarven bank, safeguarding the hard-earned treasures of miners and traders. Sturdy vaults house the initial deposits, providing a secure space to house the guild's growing reserves."
 building_type_dwarven_bank_economic_01_desc: "With astute financial acumen, the Banker's Guild oversees investments and lends resources to fuel the development of the hold, fostering trade, innovation, and infrastructure."
 building_dwarven_bank_economic_02: "Chamber of Ledgers"
 building_dwarven_bank_economic_02_desc: "In the heart of the Guildhall, the Chamber of Ledgers sits. Dwarven accountants meticulously record transactions, investments and loans on stone tablets, keeping track of the Guild's many activities."
 building_dwarven_bank_economic_03: "Grand Exchange"
 building_dwarven_bank_economic_03_desc: "Within the Grand Exchange's walls, traders from neighboring holds and distant realms converge to engage in prosperous exchanges, while dwarven bankers orchestrate complex transactions that shape the destiny of the hold's wealth."
 building_dwarven_kings_armory_military_01: "Guardian's Arsenal"
 building_dwarven_kings_armory_military_01_desc: "The Guardian's Arsenal serves as the foundational storage for the hold's weaponry and armor. Sturdy racks and shelves hold rows of meticulously organized weapons and finely crafted armor, ensuring the readiness of the dwarven warriors. The air is tinged with the scent of oiled metal, and the atmosphere resonates with the anticipation of battle."
 building_type_dwarven_kings_armory_military_01_desc: "The Great Armoury is the primary repository for the hold's weaponry and armor. Meticulously organized and well-maintained, it ensures our warriors are always ready to defend our home."
 building_dwarven_kings_armory_military_02: "Hall of Heroes"
 building_dwarven_kings_armory_military_02_desc: "In the Hall of Heroes, the armory takes on a more imposing form. Here, the most exceptional pieces of weaponry and armor are displayed in custom-crafted cases, each item a testament to the dwarven dedication to craftsmanship. Banners bearing the emblems of legendary warriors hang proudly, casting a solemn air over the vault as it showcases the pride and heritage of the hold."
 building_dwarven_kings_armory_military_03: "Royal Armament Chambers"
 building_dwarven_kings_armory_military_03_desc: "The Royal Armament Chambers stand as a testament to the hold's martial prowess. Rare and ancient armour and weaponry are housed within fortified chambers adorned with intricate carvings depicting great victories of the dwarven people. This sacred space exudes a regal air, with the finest armor gleaming under carefully placed shafts of light, awaiting the call to defend the kingdom and uphold Dwarven honour."
 building_dwarven_grand_library_01: "Stone Archives"
 building_dwarven_grand_library_01_desc: "The foundational level of the Grand Library houses the Stone Archives, where ancient scrolls and tomes are meticulously organized. Dwarven scholars diligently record and preserve the accumulated knowledge of the hold."
 building_type_dwarven_grand_library_01_desc: "The Grand Library is the paramount repository of knowledge within the hold, where the accumulated wisdom of generations is meticulously preserved and studied."
 building_dwarven_grand_library_02: "Halls of Lore"
 building_dwarven_grand_library_02_desc: "In the Halls of Lore, the Grand Library unveils a more extensive collection of tomes, each meticulously categorized. Knowledge-seekers wander among towering bookshelves, while scribes diligently record new discoveries."
 building_dwarven_grand_library_03: "Lorekeeper's Sanctum"
 building_dwarven_grand_library_03_desc: "The Lorekeeper's Sanctum is adorned with intricate carvings house tomes of unparalleled insight and discovery. Dwarven scholars, bathed in the iridescent light of its many crystal chandeliers, delve into the deepest recesses of accumulated wisdom, forging a legacy of enlightenment for generations to come."
 building_dwarven_outpost_01: "Palisade"
 building_dwarven_outpost_01_desc: "Local Axedwarves have procured the logs necessary for the construction of a simple palisade surrounding the settlement. This provides marginal safety from outside threats."
 building_type_dwarven_outpost_01_desc: "While dwarves have traditionally considered surface dwellings a last resort, it remains necessary to protect those unlucky few who make their living under the open sky."
 building_dwarven_outpost_02: "Watchtowers"
 building_dwarven_outpost_02_desc: "Watchtowers dot the area around the settlement. Atop each stands a guard, their gaze ever fixed upon the horizon, fully capable of discerning friend from foe."
 building_dwarven_outpost_03: "Rudimentary Earthworks"
 building_dwarven_outpost_03_desc: "Miners and labourers have enclosed the palisade with a ditch. The excess dirt has been used to reinforce the lower sections of the palisade and prevent entry."
 building_dwarven_outpost_04: "Stone Walls"
 building_dwarven_outpost_04_desc: "The Dwarves of this outpost have seen fit to replace their simple palisade with a wall of stone and mortar. The only entrance has been reinforced with a mighty barred door."
 building_dwarven_outpost_05: "Trench Lines"
 building_dwarven_outpost_05_desc: "A system of ditches and trenches has been dug outside of the walls of this settlement. They both provide shelter from ranged attacks and act as a hindrance to any war machine that dares to besiege the settlement."
 building_dwarven_outpost_06: "Bunker Complex"
 building_dwarven_outpost_06_desc: "The nascent trenchlines have blossomed into a dizzyingly complex series of defences connected by a line of stone bunkers. Within these structures the dwarves can withstand any would-be besiegers."
 building_dwarven_surface_farm_01: "Planting Rows"
 building_dwarven_surface_farm_01_desc: "The dwarves in this settlement have begun organizing their agricultural efforts into larger organized rows."
 building_type_dwarven_surface_farm_01_desc: "The dwarven aversion to surface dwelling is well-known; nevertheless, a few less fortunate Dwarves make their living using their meager agricultural acumen."
 building_dwarven_surface_farm_02: "Wells"
 building_dwarven_surface_farm_02_desc: "Rudimentary irrigation has been dug for farmers to draw water from a series of wells."
 building_dwarven_surface_farm_03: "Dwarf-Drawn Plows"
 building_dwarven_surface_farm_03_desc: "As dwarves are notoriously reluctant to domesticate animals, special harnesses have been fashioned that allow a team of two Dwarves to pull a plow around the field, albeit with less efficiency than a team of oxen."
 building_dwarven_surface_farm_04: "Efficient Fertilizers"
 building_dwarven_surface_farm_04_desc: "Observations of the outpost's neighbors have allowed for dwarven farmers to discover more easily accessible and efficient fertilization."
 building_dwarven_surface_farm_05: "Efficient Irrigation"
 building_dwarven_surface_farm_05_desc: "The establishment of dedicated channels and artificial estuaries has boosted crop yields among the dwarven farms in the region. "
 building_dwarven_surface_farm_06: "Dwarven Vineyards"
 building_dwarven_surface_farm_06_desc: " The labour and ingenuity of the outpost have culminated in farming complexes that stand among the most esteemed farms in the realms of men. The liquor produced from the fruits in these vast fields is said to possess a unique terroir quite unlike any produced elsewhere."
 building_dwarven_market_01: "Bartering System"
 building_dwarven_market_01_desc: "A formalized bartering system has been established to account for the lack of currency in their settlement."
 building_type_dwarven_market_01_desc: "Dwarven surface settlements can not sustain themselves on their labour alone, they require a steady trickle of goods and manpower from proper holds to break even."
 building_dwarven_market_02: "Weights and Measures"
 building_dwarven_market_02_desc: "A system of weights and measures has been established to judge the quality of goods in the market. This is marred by the insistence on local weights unrelated to other trade systems."
 building_dwarven_market_03: "Minor Trade Hub"
 building_dwarven_market_03_desc: "A semi-steady flow of trade goods runs through the market; craftsdwarves and farmers sell their excess in various stalls."
 building_dwarven_market_04: "Standardized Weights and Measures"
 building_dwarven_market_04_desc: "The idiosyncratic system of local weights has been stamped out, and a system of standardized measurements has been implemented. This allows for smoother trade with both dwarven merchants and outsiders. "
 building_dwarven_market_05: "Trade Caravans"
 building_dwarven_market_05_desc: "A hub has been established to facilitate the trade flowing to and from the outposts. The establishment of dwarven caravans has entrenched the outpost more deeply in the local trading ecosystem. "
 building_dwarven_market_06: "Notable Trade Center"
 building_dwarven_market_06_desc: "The outpost has thoroughly enmeshed itself in all trade coming through the region. Their connections are said to stretch far, from Lokhas-Drus to Lindon."
 building_dwarven_surface_forge_01: "Local Blacksmith"
 building_dwarven_surface_forge_01_desc: "Skilled craftsdwarves have been requisitioned to provide for the needs of the outpost, fashioning all manner of sword and spear that one could desire."
 building_type_dwarven_surface_forge_01_desc: "Dwarves of all stripes are renowned for their metallurgy. An outpost requires all manner of forgework from struts to spears."
 building_dwarven_surface_forge_02: "Fine Hafts"
 building_dwarven_surface_forge_02_desc: "The Dwarves have begun to furnish their blades with lighter weight hafts and hilts. This preserves the cutting power while allowing for faster swings."
 building_dwarven_surface_forge_03: "Standardized Molds"
 building_dwarven_surface_forge_03_desc: "Standardized molds allow dwarven blacksmiths of the outpost to produce weapons and tools of consistent quality. Many dwarves still prefer to wield artisan weaponry if they can afford it, however. "
 building_dwarven_surface_forge_04: "Great Bellows"
 building_dwarven_surface_forge_04_desc: "Larger bellows have begun furnishing the smithies of this outpost; the increased heat allows for new alloys to be used in the crafting of arms and armor."
 building_dwarven_surface_forge_05: "Blast Furnances"
 building_dwarven_surface_forge_05_desc: "Blast furnaces use alchemical processes to render iron ores into pure iron. This 'Pig Iron' is a vital ingredient in the creation of steel. This allows the outpost to streamline the process of steel crafting for their troops."
 building_dwarven_surface_forge_06: "Rippled Steel"
 building_dwarven_surface_forge_06_desc: " Advancements in forging processes and equipment have allowed the local blacksmiths to produce a stronger variant of common steel. The process lends the blades forged an unnatural durability and dark wavy ripples in the metal."
 building_dwarven_surface_workshop_01: "Fledging Workshops"
 building_dwarven_surface_workshop_01_desc: "A workshop has been designated for the construction of siege engines to enhance the outpost's military. Journeydwarves from across the region flock to the workshop to create all manner of siegeworks."
 building_type_dwarven_surface_workshop_01_desc: "A proper outpost requires weapons of war to smite any orcish strongholds in the region. This outpost will allow for a smoother expansion of the outpost's control as nearby Orcish forts are dealt with."
 building_dwarven_surface_workshop_02: "Sapper's Guilds"
 building_dwarven_surface_workshop_02_desc: "Sappers attached to the army have begun to organize into guilds where they pool their knowledge for the betterment of their craft. "
 building_dwarven_surface_workshop_03: "Firing Ranges"
 building_dwarven_surface_workshop_03_desc: "A firing range has been constructed to allow soldiers to train in the operation of siege weapons. This practice allows for better marksdwarves and more accurate targeting."
 building_dwarven_surface_workshop_04: "Surface Siege Engineers"
 building_dwarven_surface_workshop_04_desc: "The guilds at this hold have established a small school to train prospective engineers in the art of sieging on the surface as compared to the halls of their kin."
 building_dwarven_mustering_grounds_01: "A Designated Mustering Point"
 building_dwarven_mustering_grounds_01_desc: "A space has been cleared outside the settlement for the training and mustering of soldiers."
 building_type_dwarven_mustering_grounds_01_desc: "A local guard needs to be organized to ensure safety from orcish raids. By prioritizing the training of light infantry tactics, the outpost can quickly react to potential threats."
 building_dwarven_mustering_grounds_02: "Weapon Storehouses"
 building_dwarven_mustering_grounds_02_desc: "A stockpile of weapons has been set aside for furnishing the hands of skirmishers and the odd levy. With spear and bow, the dwarves march in defense of their surface home."
 building_dwarven_mustering_grounds_03: "Militia Drills"
 building_dwarven_mustering_grounds_03_desc: "Drills have begun to whip the substandard soldiers guarding this outpost into something resembling a proper dwarvenn army. The regiment's lack of heavy armor draws the scorn of the mountain dwarves, but their ease of maneuverability is undeniable."
 building_dwarven_mustering_grounds_04: "Forced March"
 building_dwarven_mustering_grounds_04_desc: " Drill instructors have begun forcing their units to embark on arduous treks in their combat gear to get them acclimated to the weight. Every drop of sweat shed during training prevents a drop of blood lost in battle."
 building_dwarven_mustering_grounds_05: "Wargames"
 building_dwarven_mustering_grounds_05_desc: "As recruits advance, gone are the days of monotonous drilling into the small hours of the night. In their place a trial of combat pits veteran soldiers against the new recruits in mock battles. Instincts are honed and friendships forged in the crucible of combat."
 building_dwarven_mustering_grounds_06: "Strike Like Lightning"
 building_dwarven_mustering_grounds_06_desc: "Dwarven commanders of this outpost practice the innovative strategy wholly distinct from their subterranean kin, favoring rapid deployment and decisive strikes over defensive walls. Dubbed the 'Lightning Strike' by its advocates, it has proven to be a devastatingly effective form of warfare. Many an orcish army has been routed as they mustered by a surprise attack by these forces."
 building_dwarven_pit_mine_01: "Sifting Sieves"
 building_dwarven_pit_mine_01_desc: "Sieves are composed of a fine mesh screen that uses water to allow silt and sediment to pass through while any precious minerals remain. This allows for more efficient mining, requiring less dwarf-power for the same amount of labour."
 building_type_dwarven_pit_mine_01_desc: "A pit mine can supplement the income of an outpost bereft of any notable precious mineral deposits by prioritizing quantity over quality."
 building_dwarven_pit_mine_02: "Foremen"
 building_dwarven_pit_mine_02_desc: "By designating a specific foreman to oversee the excavation, the outpost can coordinate the mining effort more effectively."
 building_dwarven_pit_mine_03: "Better tools"
 building_dwarven_pit_mine_03_desc: "Reinforcements to the shovels and tools used by the miners of this outpost allow for them to work longer hours without the need for maintenance. Whilst this may cost the outpost gold in the short-term, the prospect of less busywork is too enticing to ignore..."
 building_dwarven_pit_mine_04: "Fire-Setting"
 building_dwarven_pit_mine_04_desc: "'Fire-Setting' is a technique where bonfires are lit next to a stone wall before cold water is thrown on it. The ensuing thermal change causes great fissures to appear in stone, making it far easier to mine."
 building_dwarven_pit_mine_05: "The Yawning Abyss"
 building_dwarven_pit_mine_05_desc: "The dig site now encompasses a large plot of land outside the city walls, merging all the previous excavations into one large open pit. The labourers raise their voices in hymns to Balgar the Builder as their picks and sieves form a melody of labour."
 building_dwarven_pit_mine_06: "Cranes and Pullies"
 building_dwarven_pit_mine_06_desc: "A crane and pulley system allows for the miners to heave great clumps of rock and earth up from the depths. The earth is then broken apart and sifted at the work camps circling the pit."
 building_dwarven_pit_mine_07: "Sluice Gates"
 building_dwarven_pit_mine_07_desc: "Sluice gates have been erected to control the flow of water to and from the dig site. This allows for the sifters and Fire-Setters to continue their work without any need for delays."
 building_dwarven_pit_mine_08: "A Pockmark on the Face of Halann"
 building_dwarven_pit_mine_08_desc: "The mine's impact on the land is nearly omnipresent. Great towers of smoke reach the horizon as any metal excavated is forged into ingots, brackish waters from the mines flood the estuaries, and the clanging can be heard at all hours of the day. Yet despite the detractors, this mine stands as a testament to the resilience of its inhabitants."
 building_dwarven_tavern_01: "Local Watering Hole"
 building_dwarven_tavern_01_desc: "The Dwarves of this hold have established a tavern capable of fulfilling the bare necessities required to sustain a Dwarf."
 building_type_dwarven_tavern_01_desc: "Alcohol forms the cornerstone of Dwarven civilization, allowing a Dwarf to avoid the sad fate of drinking alone."
 building_dwarven_tavern_02: "Roadside Inns"
 building_dwarven_tavern_02_desc: "Roadside inns have been constructed to house travelers and merchants journeying through the settlement. The additional revenue will allow for this investment to pay itself back over time."
 building_dwarven_tavern_03: "Breweries"
 building_dwarven_tavern_03_desc: "Brewmasters labour day and night in front of colossal distilling tanks. Using the labours of the forests and fields, a bevy of fine liquors of all varieties are produced."
 building_dwarven_tavern_04: "Keg Storage"
 building_dwarven_tavern_04_desc: "The construction of dedicated storage allows for the aging of various alcohols brewed by the Craftsdwarves. The days of swill and grog are behind them."
 building_dwarven_tavern_05: "Exotic Distilleries"
 building_dwarven_tavern_05_desc: "Exotic ingredients borne upon the backs of far-flung merchants provide rare opportunities for drink experimentation. Bubbling beakers and colorful cauldrons leave the mouths watering and throats parched for miles surrounding the Brewhalls."
 building_dwarven_tavern_06: "Crossroads of Continents"
 building_dwarven_tavern_06_desc: "The taverns of this settlement stand at the conflux of trade and adventure. Each day more and more bright-eyed and bushy-tailed wanderers pass through on the way to parts unknown. In these halls, parties of prospective heroes band together to right wrongs and make safe the realms of the virtuous."
 building_dwarven_forestry_01: "Saw Pits"
 building_dwarven_forestry_01_desc: "The use of saw pits necessitates the use of two Handydwarves; one is perched atop a log whilst the other stands in a pit below. In unison, they saw through the log using a two-handed whipsaw. Despite the efficiency of the process, the labour remains tiring, demanding, and dangerous."
 building_type_dwarven_forestry_01_desc: "While most Dwarves prefer to shape stone, the realities of a surface settlement often leave wood as the most readily available source of construction material. In places of particular abundance, lumber yards are established to extract the maximum amount of utility from nature's bounty."
 building_dwarven_forestry_02: "Controlled Burnings"
 building_dwarven_forestry_02_desc: "Dwarves at this logging camp have adopted a strategy of lighting controlled fires to burn through the most dense of thickets. The ashes of these fires provide a fine fertilizer and more land cleared for settlement."
 building_dwarven_forestry_03: "Fine Axes"
 building_dwarven_forestry_03_desc: "Advancements in the production of wood axes have allowed the dwarves of this settlement to harvest a greater amount of lumber individually. To while away the long hours, Lumberdwarves compose a bevy of bawdy songs to lift their spirits."
 building_dwarven_forestry_04: "Woodworking Workshops"
 building_dwarven_forestry_04_desc: "The fruits of the lumber mills make their way to the nearby workshops where carpenters refine it into all manner of finished goods. Dwarven chairs are known for their durability, if not their beauty."
 building_dwarven_forestry_05: "Water-Wheel Sawmills"
 building_dwarven_forestry_05_desc: "By harnessing the natural power of nearby streams, the inefficient sawpit can be replaced by a sawmill. The water wheel raises the saw blade up and down as the workers feed logs onto the track, thus removing the need for handsaws."
 building_dwarven_forestry_06: "Industrial Logging"
 building_dwarven_forestry_06_desc: "Where once a pristine forest sat, now a hub of industry roars. Tree by tree, the primeval wilderness is hewn and shaped to fit the needs of its new masters. The constant flow of wood fuels construction within the settlement and with all that trade with it."
 building_goat_pastures_01: "Grazing Fields"
 building_goat_pastures_01_desc: "The Dwarves of these hills have established grazing fields for the newly introduced goat farms. The goats roam free during the day and return to the temporary shelters that have been arranged by night."
 building_type_goat_pastures_01_desc: "The dwarves of these hills are among the few dwarves to domesticate animals. They have tamed the mountain goats native to the area and use them for work and war in equal measure."
 building_goat_pastures_02: "Goat-Drawn Plows"
 building_goat_pastures_02_desc: "The traditional dwarf-drawn plows have been phased out in the vicinity of the ranches. In its place, a harness is used to utilize the superior strength of the goats to accomplish all manner of agricultural work, with the added benefit of strengthening the rams."
 building_goat_pastures_03: "Fence and Paddocks"
 building_goat_pastures_03_desc: "Fences and padlocks have been constructed on the periphery of the grazing fields to protect against predators and to keep track of the growing herds of goats."
 building_goat_pastures_04: "Goatshoes"
 building_goat_pastures_04_desc: "By adapting the human horseshoes to fit goats, the hooves of the goats are protected from excessive wear by the crags and hills. This allows the ranchers to work the rams harder and longer without fear of injury."
 building_goat_pastures_05: "Selective Breeding"
 building_goat_pastures_05_desc: "By encouraging breeding of the finest goats of each generation, a rancher can encourage desirable traits in their livestock. Bigger frames, greater stamina, and fearsome aggression are all noted and selected for in pursuit of the ultimate beast of war."
 building_goat_pastures_06: "Goat Armor"
 building_goat_pastures_06_desc: " A special training program has been implemented at the ranches to acclimate the goats to the burden of plate. This will provide any war host using these goats a force to be reckoned with, provided they can pay the additional fee for the training."
 building_goat_pastures_07: "Racing Track"
 building_goat_pastures_07_desc: "A racing track has been cleared to allow for competitions between local ranches. Besides the entertainment provided to the common dwarf, this exercise pushes the beasts to greater heights. The increase in speed provides a boon on the battlefield, allowing for masterful flanks and cunning strikes."
 building_goat_pastures_08: "Beasts of War"
 building_goat_pastures_08_desc: "The rams born at these ranches are now wholly distinct from their native kin. Thick, corded muscles coil beneath their hides as they charge through danger that a lesser beast would balk at. On these ranches, ram and rider act with one mind to smite the enemies of the hold."
 building_iron_mines_01: "$building_dwarven_mine_01$"
 building_iron_mines_01_desc: "$building_dwarven_mine_01_desc$"
 building_type_iron_mines_01_desc: "Iron, a stalwart metal, forms the backbone of Halann's metallurgy. Renowned for its strength and versatility, iron is the smith's choice for crafting an array of tools, weapons, and implements essential for everyday life."
