 culture_parameter_aov_racial_levy_dwarven:0 "Holdings raise three fifths of a human holding's [levies|E], whatever levy bonuses they gain"
 culture_parameter_aov_racial_levy_gnomish:0 "Holdings raise half of a human holding's [levies|E], whatever levy bonuses they gain"
 culture_parameter_aov_racial_levy_kobold:0 "Holdings raise one and a half times a human holding's [levies|E], whatever levy bonuses they gain"
