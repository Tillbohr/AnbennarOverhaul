 building_aov_monument_zornartakel_naval_harbor_01: "Zornartakel Naval Shipyard"
 building_aov_monument_zornartakel_naval_harbor_01_desc: "The Zornartakel Naval Harbor at Baqtkhet's Retreat is an extensive military harbor designed to be a complete installation for the construction of ships, the training of sailors, and the harboring of freight. The position of the Naval Harbor on the southern side of the island of Elzina allows for natural protection against sudden storms in the Sea of Eliz, or from enemy fleets. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
