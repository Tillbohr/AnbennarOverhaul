l_english:
 aov_delve_deeper_decision:0 "Delve Deeper"
 aov_delve_deeper_decision_tooltip:0 "Send the delvers deeper into a dwarven hold to raise it one level."
 aov_delve_deeper_decision_confirm:0 "Begin the dig"
 aov_delve_deeper_decision_desc:0 "Dwarven delvers can dig deeper into the mountain beneath one of your holds, raising it one level. The gold is paid at the start; the work takes years."
 aov_delve_deeper_no_hold:0 "You hold a dwarven hold that can be dug deeper and you can afford the dig"
 aov_delve_deeper_decision_desc_1:0 "\n[GetTitleByKey('b_marrhold').GetName]: [GetTitleByKey('b_marrhold').GetProvince.MakeScope.Var('aov_dig_progress').GetValue|0] of [GetTitleByKey('b_marrhold').GetProvince.MakeScope.ScriptValue('aov_dig_months')|0] months"
 aov_delve_deeper_decision_desc_2:0 "\n[GetTitleByKey('b_anvilwright').GetName]: [GetTitleByKey('b_anvilwright').GetProvince.MakeScope.Var('aov_dig_progress').GetValue|0] of [GetTitleByKey('b_anvilwright').GetProvince.MakeScope.ScriptValue('aov_dig_months')|0] months"
