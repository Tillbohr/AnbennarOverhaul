 building_aov_monument_rainbow_hall_north_monument_03_desc: "During the eleventh century, a conflict tore fair Viswall. City politics saw the noble court of the síl Vis stuck into a push-and-pull relation with city hall and its burghers allies. A solution was found when, in typical halfling fashion, both sides were brought together: the buildings, situated on opposite banks of the river, became the dual launches for a unified bridge-palace, one governmental complex from which to govern both the city and the Kingdom. The Rainbow Hall remained the iconic symbol of the city until its destruction during the Viswall Rebellion. On the northern bank rests the Fuchsia Commons complex, city hall of Viswall, and from it a dwarven made bridge of white stone straddles the Widderoy. On top of it, a palace of bricks and cobblestones is painted in variegated hues: violet next to the common, then indigo and blue, and finally green in the middle before switching to the red tones of the southern side. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
