 building_aov_monument_krahgradir_01: "Krahgradir"
 building_aov_monument_krahgradir_01_desc: "Few gnolls are as famous - or infamous, depending on whom you ask - as Krah. Renowned for his success as a slaver, his name became synonymous with the very word 'slaver' in the gnollish tongue. Countless legends surround him, from tales of his secret treasure hoard hidden in the jungles of Horashesh to his profound influence on gnollish culture and tradition, rivaled only by that of the Xhazobines. Yet it is not only legends and traditions that endure. In the open fields of the Gol Savanna stands the Krahilzin - meaning 'Slaver's Camp' - the place where Krah is said to have originated, where he rose to prominence, where he returned after every successful raid, and, most importantly, where the bulk of his slave trades and deals were conducted. But the camp's true marvel lies at its heart: the Krahgradir, a jagged tower rising above mounds of plundered and blood-traded wealth - ancient coins, precious metals, piles of gold and gemstones glittering like a dragon's hoard. To this day, both camp and tower stand inviolate. Not even the most savage or demonic of gnollish warlords dare raid or desecrate it, for seizing Krahgradir is to claim more than riches - it is to grasp at Krah's shadow. Every self-respecting Gnollish warlord dreams of matching even half his mastery over others. And for them, to amass enough wealth to contribute to the tower's riches, immortalizing one's name alongside Krah's, is the ultimate aspiration. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
