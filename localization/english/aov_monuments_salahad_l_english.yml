 building_aov_monument_koroshesh_library_01: "Grand Library of Koroshesh"
 building_aov_monument_koroshesh_library_01_desc: "The Great Library of Koroshesh, built during the early years of Elikhet's reign, is one of, if not the greatest, centers of knowledge and learning in Halann. The library itself is just the heart of a massive complex that stands towering above the city harbor. It is formed by the many institutions that have congregated around it through the ages, including a great zoo and countless lecture halls, student residences and art expositions. Its seemingly infinite shelves contain the wisdom of five millennia, and it would take another five to read just the titles of all the works it houses. No field of knowledge lacks a place in the Library, and any contribution of the slightest significance soon finds its way to its shelves. The Library has produced some of the brightest minds of all history, and it is expected that it will continue to do so for centuries to come. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
