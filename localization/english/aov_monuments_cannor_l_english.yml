 building_aov_monument_damish_temple_moonmount_library_01: "The Moonmount Library"
 building_aov_monument_damish_temple_moonmount_library_01_desc: "The Moonmount mountain is home to both the famous Temple of the Highest Moon and the Moonmount Library, the latter of which is one of the oldest standing libraries in the world and filled with texts ranging from history, religious treatises to magical tomes and more. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
