 building_aov_monument_the_north_citadel_03_desc: "Built at the base of the Trialmount, the North Citadel served as the court of Castanor's emperors for centuries. It was from here that they would begin their journey up the Trialmount, undertaking the Trials of Castan, and it was from here that many Castans ruled over one of the greatest empires the world has ever seen and will ever see. Although the Great Aqueduct linking the North Citadel to the City of Castonath has been destroyed and the Citadel itself damaged during the Battle of Trialmount, the North Citadel remains whole. If the Court of Castan were to be restored and its halls once again crowded and roaring with life, perhaps some measure of the Empire of Castanor's former glory can yet be found. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
 building_aov_monument_the_north_citadel_morgurax_monument_01: "Morgurax, the Flying Citadel"
 building_aov_monument_the_north_citadel_morgurax_monument_01_desc: "Morgurax is a fortress that hangs in the air above the Stairs of Regency, raised by Castanorian sorcery as a refuge for the empire's regents. It looks down on the lands below as a sleepless watcher. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
