 building_aov_monument_ekha_harbor_01: "Ekha Harbor"
 building_aov_monument_ekha_harbor_01_desc: "The Ekhan people have always lived and died with their existences focused on the sea, and the great Ekhan Harbor exemplifies this. Ekhan sailors and ships have always proven themselves to be quite strong indeed."
