 aov_invention_living_mirrors: "Living Mirrors"
 aov_invention_living_mirrors_desc: "Exerting influence on the Living Mirror business will allow us to easily broadcast propaganda, as well as better distracting potential malcontents."
 aov_invention_living_mirrors_tt: "#T $aov_invention_living_mirrors$#!\n#weak $AOV_CATEGORY_SOCIETY$, $AOV_TIER_2$#!\n\n$aov_invention_living_mirrors_desc$"
 aov_invention_living_mirrors_subtitle: "$AOV_CATEGORY_SOCIETY$, $AOV_TIER_2$"
 aov_invention_mirage_detector_3000: "Miracle Detector 3000"
 aov_invention_mirage_detector_3000_desc: "A completely objective, fact-based device which calculates levels of 'Divinity,' 'Power,' and 'Morality' for each religion in the world, and calculates a sum of these three as 'God-Points.' It just so happens that the religion with the highest number of 'God-Points'... is ours! Isn't it great that we're correct about the world?"
 aov_invention_mirage_detector_3000_tt: "#T $aov_invention_mirage_detector_3000$#!\n#weak $AOV_CATEGORY_SOCIETY$, $AOV_TIER_2$#!\n\n$aov_invention_mirage_detector_3000_desc$"
 aov_invention_mirage_detector_3000_subtitle: "$AOV_CATEGORY_SOCIETY$, $AOV_TIER_2$"
 aov_invention_printing_press: "Gnomish Printing Press"
 aov_invention_printing_press_desc: "A press of movable brass type and a gear-driven platen that turns out a hundred pages in the time a scribe copies one. Books grow cheap, and a court that reads grows learned."
 aov_invention_printing_press_tt: "#T $aov_invention_printing_press$#!\n#weak $AOV_CATEGORY_SOCIETY$, $AOV_TIER_2$#!\n\n$aov_invention_printing_press_desc$"
 aov_invention_printing_press_subtitle: "$AOV_CATEGORY_SOCIETY$, $AOV_TIER_2$"
 aov_invention_remedial_tinctures: "Remedial Tinctures"
 aov_invention_remedial_tinctures_desc: "These kits contain unique potions, self-tightening tourniquets, and all required to get a soldier off of Nerat's doorstep and back to the battlefield in scarce hours."
 aov_invention_remedial_tinctures_tt: "#T $aov_invention_remedial_tinctures$#!\n#weak $AOV_CATEGORY_SOCIETY$, $AOV_TIER_2$#!\n\n$aov_invention_remedial_tinctures_desc$"
 aov_invention_remedial_tinctures_subtitle: "$AOV_CATEGORY_SOCIETY$, $AOV_TIER_2$"
 aov_invention_clerk_automatons: "Clerk-Automatons"
 aov_invention_clerk_automatons_desc: "Brass scribes that copy, file and cross-check without rest or error. A court that employs them can keep faith with more vassals and more lands than any ledger of clerks."
 aov_invention_clerk_automatons_tt: "#T $aov_invention_clerk_automatons$#!\n#weak $AOV_CATEGORY_SOCIETY$, $AOV_TIER_3$#!\n\n$aov_invention_clerk_automatons_desc$"
 aov_invention_clerk_automatons_subtitle: "$AOV_CATEGORY_SOCIETY$, $AOV_TIER_3$"
 aov_invention_clockwork_heralds: "Clockwork Heralds"
 aov_invention_clockwork_heralds_desc: "Brass heralds with bell-voices that cry the lord's decrees in every market square at the appointed hour. No law is misheard, and no village claims it never learned of one."
 aov_invention_clockwork_heralds_tt: "#T $aov_invention_clockwork_heralds$#!\n#weak $AOV_CATEGORY_SOCIETY$, $AOV_TIER_3$#!\n\n$aov_invention_clockwork_heralds_desc$"
 aov_invention_clockwork_heralds_subtitle: "$AOV_CATEGORY_SOCIETY$, $AOV_TIER_3$"
 aov_invention_gnomish_spectacles: "Gnomish Spectacles"
 aov_invention_gnomish_spectacles_desc: "Ground crystal lenses in fine wire frames, which sharpen failing eyes and let one read, aim and judge a face as in youth. Courtiers wear them as proudly as a crown."
 aov_invention_gnomish_spectacles_tt: "#T $aov_invention_gnomish_spectacles$#!\n#weak $AOV_CATEGORY_SOCIETY$, $AOV_TIER_3$#!\n\n$aov_invention_gnomish_spectacles_desc$"
 aov_invention_gnomish_spectacles_subtitle: "$AOV_CATEGORY_SOCIETY$, $AOV_TIER_3$"
 aov_invention_universal_grammarye: "Universal Grammarye"
 aov_invention_universal_grammarye_desc: "A system of rules that lays the grammars of many tongues side by side, so that an envoy can learn a new language in weeks. Foreign courts are flattered to be addressed in their own speech."
 aov_invention_universal_grammarye_tt: "#T $aov_invention_universal_grammarye$#!\n#weak $AOV_CATEGORY_SOCIETY$, $AOV_TIER_3$#!\n\n$aov_invention_universal_grammarye_desc$"
 aov_invention_universal_grammarye_subtitle: "$AOV_CATEGORY_SOCIETY$, $AOV_TIER_3$"
