l_english:
 activity_hold_dig:0 "Delving Campaign"
 activity_hold_dig_name:0 "Delving Campaign at [ACTIVITY.GetCurrentPhase.GetLocation.GetBaronyNameExplicitly]"
 activity_hold_dig_owner:0 "Delve Master"
 activity_hold_dig_desc:0 "Lead the masons and miners of a dwarven hold into the deep rock to carve out new halls. Each campaign adds to the hold's dig progress; enough progress raises the hold one level."
 activity_hold_dig_host_desc:0 "$BULLET_WITH_TAB$Dig progress toward the hold's next level\n$BULLET_WITH_TAB$A discovery when the hold rises a level"
 activity_hold_dig_guest_desc:0 ""
 activity_hold_dig_guest_help_text:0 "No guests join a Delving Campaign; the host leads the diggers alone."
 activity_hold_dig_conclusion_desc:0 "The diggers lay down their picks, and the campaign is done."
 activity_hold_dig_selection_tooltip:0 "Dig deeper into a dwarven hold you hold.\n\nAnticipated Rewards:\n$activity_hold_dig_host_desc$"
 activity_hold_dig_destination_selection:0 "Only a working dwarven hold below level 10 that you hold yourself can be dug."
 activity_hold_dig_province_desc:0 "The diggers set to work at [ROOT.Province.GetName]"
 activity_hold_dig_predicted_cost:0 "A campaign costs 50 [gold|E] per level of the hold, plus the chosen investment."
 TRAVEL_NAME_FOR_activity_hold_dig:0 "$TRAVEL_NAME_FOR_activity_tournament$"
 aov_hold_dig_can_start_hold_tt:0 "Holds a working dwarven hold below level 10 that is not already being dug, and has the [gold|E] its campaign costs"
 aov_hold_dig_base_cost:0 "Campaign"

 aov_dig_survey:0 "Survey"
 aov_dig_survey_desc:0 "Surveyors sound the rock and chart the way down."
 aov_dig_excavation:0 "Excavation"
 aov_dig_excavation_desc:0 "The long work of cutting new galleries out of the mountain."
 aov_dig_shoring:0 "Shoring"
 aov_dig_shoring_desc:0 "Masons brace the new halls before they can be used."
 aov_dig_breakthrough:0 "Breakthrough"
 aov_dig_breakthrough_desc:0 "The last wall falls and the campaign's work is counted."

 aov_dig_pace:0 "Pace"
 aov_dig_pace_careful:0 "Careful"
 aov_dig_pace_careful_desc:0 "$EFFECT_LIST_BULLET$ #N x0.75#! dig progress\n$EFFECT_LIST_BULLET$ Fewer setbacks\n\n#weak Slow and sure; the mountain does not forgive haste.#!"
 aov_dig_pace_steady:0 "Steady"
 aov_dig_pace_steady_desc:0 "$EFFECT_LIST_BULLET$ Normal dig progress\n\n#weak The pace our forebears kept.#!"
 aov_dig_pace_reckless:0 "Reckless"
 aov_dig_pace_reckless_desc:0 "$EFFECT_LIST_BULLET$ #P x1.35#! dig progress\n$EFFECT_LIST_BULLET$ More setbacks\n\n#weak Drive the crews hard and damn the cave-ins.#!"
 aov_dig_investment:0 "Investment"
 aov_dig_investment_none:0 "No Investment"
 aov_dig_investment_none_desc:0 "$EFFECT_LIST_BULLET$ Normal dig progress\n\n#weak The crews work with the tools they have.#!"
 aov_dig_investment_generous:0 "Generous"
 aov_dig_investment_generous_desc:0 "$EFFECT_LIST_BULLET$ #P x1.25#! dig progress\n\n#weak Better tools, more timber, and well-fed crews.#!"
 aov_dig_investment_lavish:0 "Lavish"
 aov_dig_investment_lavish_desc:0 "$EFFECT_LIST_BULLET$ #P x1.5#! dig progress\n\n#weak Master masons and runesmiths, paid from the treasury.#!"

 aov_hold_dig.100.t:0 "Breakthrough at [SCOPE.sTitle('hold_title').GetName]"
 aov_hold_dig.100.desc:0 "The last wall gives way, and the new halls of [SCOPE.sTitle('hold_title').GetName] open before us. The hold has risen to level #V [SCOPE.sProvince('hold_province').MakeScope.ScriptValue('aov_hold_level')|0]#!."
 aov_hold_dig.100.desc.gems:0 " In the rubble the miners found a pocket of uncut gems."
 aov_hold_dig.100.desc.vein:0 " Behind the wall runs a rich vein of ore that will fill the county's coffers for years."
 aov_hold_dig.100.desc.lore:0 " The diggers broke into a sealed chamber of our ancestors, its walls carved with forgotten lore."
 aov_hold_dig.100.a:0 "The deep rewards the patient."
 aov_hold_dig.101.t:0 "The Campaign Ends"
 aov_hold_dig.101.desc:0 "The Delving Campaign at [SCOPE.sTitle('hold_title').GetName] is over. It added #V [TopScope.GetValue('aov_campaign_gain')|0]#! to the hold's dig progress, which now stands at #V [SCOPE.sProvince('hold_province').MakeScope.Var('aov_dig_progress').GetValue|0]#!. Another #V [TopScope.GetValue('aov_dig_remaining')|0]#! is needed for the next level."
 aov_hold_dig.101.a:0 "We will dig again."
