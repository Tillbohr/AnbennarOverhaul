 # Halessi (Devouring Path)
 ##########################
 halessi_religion_adherent:0 "Pathwalker"
 halessi_religion_adherent_plural:0 "Pathwalkers"
 halessi_religion_desc:0 "The Halessi faiths are the Paths: schools of discipline that teach how the #italic chi#! of the living world may be gathered, refined or spent. The Accretive and Transmutative Paths hold that enlightenment is earned through patience and restraint; the Devouring Path holds that it is taken. All three honour the spirits of the ancestors and the great sages who first walked the Paths."
