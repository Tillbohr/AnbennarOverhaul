 building_aov_monument_eborthil_toref_citadel_01: "Toref Citadel"
 building_aov_monument_eborthil_toref_citadel_01_desc: "The Isle of Tef could be argued to be a fortress by merit of natural geography alone, but the Toref Citadel makes it into an indisputable fact. Built in antiquity by the Kheteratans at the height of their empire, then later improved with extensive dockyards when conquered by the Castanorians, the Toref Citadel makes attacking the Isle of Tef an infuriating process to any would-be conqueror. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
