 building_aov_monument_lorentaine_mage_academy_01: "Mage Academy of Lorentainé"
 building_aov_monument_lorentaine_mage_academy_01_desc: "Lorent has always been home to many mages and mage schools, but none that were fully under the control of the Lorentish Crown until the Lorentish king built a royal mage academy in the capital of Lorent, Lorentainé. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
