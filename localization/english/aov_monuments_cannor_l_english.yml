 building_aov_monument_kobildzan_kobildzex_guild_of_trapsmiths_01: "Kobildzex Guild of Trapsmiths"
 building_aov_monument_kobildzan_kobildzex_guild_of_trapsmiths_01_desc: "The Kobold Guild of Trapsmiths has existed within the Kobold realms of the Dragon Coast for many years, yet they have never had a formal home. Deep in the heart of the Dragonheights in Soxun Kobildzex, a guild hall for them to practice their art shall be made."
