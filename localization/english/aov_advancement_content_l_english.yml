 aov_advancement.1.t: "A Magical Advancement"
 aov_advancement.1.a: "The work goes on."
 aov_advancement.1.desc.magical_fortress: "The wards are laid. Lines of power run through the stones of [ROOT.Char.GetPrimaryTitle.GetNameNoTier], and no besieger will find them easy to break."
 aov_advancement.1.desc.summon_extraplanars: "The circle flares and is still. What came through it now waits on [ROOT.Char.GetFirstName]'s word."
 aov_advancement.1.desc.orb_of_omniscience: "In the depths of the orb, shapes move: what was, what is, and what may yet come."
 aov_advancement.1.desc.enchanted_artifact: "The last rune is cut and the enchantment settles into the work like a held breath let go."
 aov_advancement.1.desc.battlemage_academy: "Students drill in the courtyard, and the walls are scorched black where their spells went astray."
 aov_advancement.1.desc.mirror_image: "In every mirror of the palace, [ROOT.Char.GetFirstName] sees a face that is not quite a reflection."
 aov_advancement.1.desc.lichdom: "Another step taken on the dark road. There is no light behind, and only cold ahead."
 aov_advancement.1.desc.homunculus: "The alembic bubbles, and in the murk something small and patient opens its eyes."

 # Magical Fortress
 aov_ward_1: "Warded"
 aov_ward_1_desc: "Wards woven into the stones of this county turn back besiegers and shelter the land within."
 aov_ward_3: "Unbreakable Wards"
 aov_ward_3_desc: "Wards of great power guard this county; its walls have never been stronger."
 aov_ward_capital: "Warded Seat"
 aov_ward_capital_desc: "The heart of the wards lies here, where they are strongest."

 # Summon Extraplanars
 aov_advancement.10.t: "Summon Extraplanars"
 aov_advancement.10.desc: "The summoning circle is drawn and the words are ready. Three doors stand open beyond the veil, and only one host may come through."
 aov_advancement.10.a: "The Shining City sends its angels."
 aov_advancement.10.a.tt: "Unlocks the #V Host of the Shining City#!, heavy infantry"
 aov_advancement.10.b: "The weird ones from the far planes."
 aov_advancement.10.b.tt: "Unlocks #V The Weird Ones#!, heavy cavalry"
 aov_advancement.10.c: "Beings of fire and rage."
 aov_advancement.10.c.tt: "Unlocks the #V Beings of Fire and Rage#!, archers"
 aov_host_angels: "Host of the Shining City"
 aov_host_angels_flavor: "#F Winged soldiers of the Shining City, bound to their summoner's banner.#!"
 aov_host_eldritch: "The Weird Ones"
 aov_host_eldritch_flavor: "#F Riders from planes no map records. Horses flee from their mounts.#!"
 aov_host_devils: "Beings of Fire and Rage"
 aov_host_devils_flavor: "#F Devils who hurl fire from the back rows and laugh as it lands.#!"
 aov_host_angels_2: "Bound Host"
 aov_host_angels_3: "Host Eternal"
 aov_host_eldritch_2: "Bound Host"
 aov_host_eldritch_3: "Host Eternal"
 aov_host_devils_2: "Bound Host"
 aov_host_devils_3: "Host Eternal"

 # Orb of Omniscience
 aov_orb_of_omniscience_name: "Orb of Omniscience"
 aov_orb_of_omniscience_desc: "An orb of glass and starlight ground by [owner.GetFirstName]. Within it, shapes move: what was, what is, and what may yet come."
 aov_orb_1: "Orb of Omniscience"
 aov_orb_2: "Clear Sight"
 aov_orb_3: "All-Seeing"

 # Enchanted Artifact
 aov_adv_can_craft_enchanted_artifact_tt: "Has never crafted an enchanted artifact"
 aov_adv_owns_enchanted_artifact_tt: "Owns the enchanted artifact they crafted"
 aov_advancement.20.t: "The Enchanted Artifact"
 aov_advancement.20.desc: "A mage may pour this much of themselves into only one work in a lifetime. The materials are laid out on the workbench, each waiting to become something more."
 aov_advancement.20.weapon: "A weapon, to strike as no other can."
 aov_advancement.20.armor: "Armor, that no blade may find me."
 aov_advancement.20.crown: "A crown, to command the hearts of men."
 aov_advancement.20.regalia: "Regalia, to rule the realm well."
 aov_advancement.20.trinket: "A ring, to deepen my magic."
 aov_enchanted_weapon_name: "Enchanted Blade"
 aov_enchanted_weapon_desc: "A blade forged and spellbound by [owner.GetFirstName]. It never dulls, and it never misses its mark."
 aov_enchanted_weapon_1: "Enchanted Blade"
 aov_enchanted_weapon_2: "Deepened Enchantment"
 aov_enchanted_weapon_3: "Masterwork Enchantment"
 aov_enchanted_armor_name: "Enchanted Armor"
 aov_enchanted_armor_desc: "Plate etched with wards by [owner.GetFirstName]. Arrows turn aside before they touch it."
 aov_enchanted_armor_1: "Enchanted Armor"
 aov_enchanted_armor_2: "Deepened Enchantment"
 aov_enchanted_armor_3: "Masterwork Enchantment"
 aov_enchanted_crown_name: "Enchanted Crown"
 aov_enchanted_crown_desc: "A crown enchanted by [owner.GetFirstName]. Those who look upon it find themselves inclined to obey."
 aov_enchanted_crown_1: "Enchanted Crown"
 aov_enchanted_crown_2: "Deepened Enchantment"
 aov_enchanted_crown_3: "Masterwork Enchantment"
 aov_enchanted_regalia_name: "Enchanted Regalia"
 aov_enchanted_regalia_desc: "Regalia bound with the magic of [owner.GetFirstName]. Ledgers balance themselves in its presence."
 aov_enchanted_regalia_1: "Enchanted Regalia"
 aov_enchanted_regalia_2: "Deepened Enchantment"
 aov_enchanted_regalia_3: "Masterwork Enchantment"
 aov_enchanted_trinket_name: "Enchanted Ring"
 aov_enchanted_trinket_desc: "A ring that [owner.GetFirstName] filled with magic. It hums softly when spells are near."
 aov_enchanted_trinket_1: "Enchanted Ring"
 aov_enchanted_trinket_2: "Deepened Enchantment"
 aov_enchanted_trinket_3: "Masterwork Enchantment"

