 building_aov_monument_blaiddscal_academy_monument_01: "Blaíddscal Academy"
 building_aov_monument_blaiddscal_academy_monument_01_desc: "Blaíddscal Academy was founded by Ladrinel Heartsworn, captain of the Princess Guard, whose history of captivity within the One Xia prompted the discovery of Diranbe. After leading their violent escape from captivity and spending time in the service of Jaher, Ladrinel returned to the Elfrealm of Ibevar, having spent more time apart from it than Ibevar had yet formally existed. She brought to bear her experiences as a famous general and adept of martial techniques, founding one of Cannor's most prestigious military institutions before retiring around the end of Prince Adrahel's reign. Since then, Blaíddscal has taught generations of officers from Ibevar and occasionally guests from further abroad, boasting a teaching staff intended to give a well rounded but military minded schooling, often hand-selected from previous generations of exemplary officers. Sometimes even mercenary adepts of Diranbe, known as Rhaidd, coming and being given a home in the gentle lands of the Elfrealm in return for teaching services. Many walk through its halls and come out ready to serve a truly modern army and build discipline from top down."
