l_english:
 aov_hold_dig.1.t:0 "Old Tunnel Maps"
 aov_hold_dig.1.desc:0 "Among the hold's archives the clerks found a roll of tunnel maps, drawn by delvers long dead, showing galleries beneath [hold.GetName] that no living dwarf has walked."
 aov_hold_dig.1.a:0 "Follow the old maps."
 aov_hold_dig.1.b:0 "Pay a loremaster to check them first. (60 [gold|E])"
 aov_hold_dig.1.c:0 "Trust our own survey instead."
 aov_hold_dig.2.t:0 "Unstable Strata"
 aov_hold_dig.2.desc:0 "The surveyors' picks ring wrong against the rock. The strata beneath [hold.GetName] are cracked and shifting, and the foremen do not like the sound of it."
 aov_hold_dig.2.a:0 "Brace every span before going on. (80 [gold|E])"
 aov_hold_dig.2.b:0 "Reroute the survey around the bad rock."
 aov_hold_dig.2.c:0 "Press on regardless."
 aov_hold_dig.3.t:0 "A Prospector's Claim"
 aov_hold_dig.3.desc:0 "A grizzled prospector stands at the gate of [hold.GetName] and swears the lode in the new workings is his by right of the first strike. His beard is long and his ledger longer."
 aov_hold_dig.3.a:0 "Pay him for the claim. (70 [gold|E])"
 aov_hold_dig.3.b:0 "Seize the claim by right of the hold."
 aov_hold_dig.3.c:0 "Send him away with a hearty meal."
 aov_hold_dig.4.t:0 "A Rich Vein"
 aov_hold_dig.4.desc:0 "The picks break into a seam of bright ore beneath [hold.GetName]. The miners laugh and weep at once. The only question is whether to strip it for coin or to follow it down."
 aov_hold_dig.4.a:0 "Mine it out for coin."
 aov_hold_dig.4.b:0 "Follow it deeper."
 aov_hold_dig.4.c:0 "Take a little of both."
 aov_hold_dig.5.t:0 "Flooded Gallery"
 aov_hold_dig.5.desc:0 "The new gallery at [hold.GetName] has broken into an underground spring. Black water rises around the miners' boots and the pumps cough and choke."
 aov_hold_dig.5.a:0 "Buy pumps and drain it properly. (100 [gold|E])"
 aov_hold_dig.5.b:0 "Wait for the water to find its level."
 aov_hold_dig.5.c:0 "Drive the crews through the flood."
 aov_hold_dig.6.t:0 "The Miners' Strike"
 aov_hold_dig.6.desc:0 "The delvers have laid down their picks in the main gallery of [hold.GetName]. They want better pay, shorter shifts, and a say in where the rock is cut."
 aov_hold_dig.6.a:0 "Pay their wage demands. (120 [gold|E])"
 aov_hold_dig.6.b:0 "Break the strike."
 aov_hold_dig.6.c:0 "Hear them out over a shared cask."
 aov_hold_dig.7.t:0 "A Sealed Rune Door"
 aov_hold_dig.7.desc:0 "A great door of grey stone bars the tunnel at [hold.GetName], its face covered in runes older than the hold itself. Nothing the crews carry will open it."
 aov_hold_dig.7.a:0 "Have the loremasters read the runes."
 aov_hold_dig.7.b:0 "Smash it open."
 aov_hold_dig.7.c:0 "Leave it sealed and dig around."
 aov_hold_dig.8.t:0 "Something in the Deep"
 aov_hold_dig.8.desc:0 "A low, wet growl echoes up from the lowest gallery of [hold.GetName]. The lamps gutter. Whatever lives down there has noticed the miners, and it is hungry."
 aov_hold_dig.8.a.success:0 "Your axe rings true and the beast flees howling back into the rock. The way lies open."
 aov_hold_dig.8.a.failure:0 "The beast's claws find the gaps in your armor. The crews drag you out, and the gallery is lost to the dark."
 aov_hold_dig.8.a:0 "Lead the charge yourself (Prowess)."
 aov_hold_dig.8.b.success:0 "The shield wall holds, and the creature breaks against it. The crews return to work."
 aov_hold_dig.8.b.failure:0 "The line shatters in the narrow tunnel and the crews flee. Days of work are lost."
 aov_hold_dig.8.b:0 "Command the hold's guard to drive it off (Martial)."
 aov_hold_dig.8.c:0 "Seal the passage and dig elsewhere."
 aov_hold_dig.9.t:0 "Gallery Collapse"
 aov_hold_dig.9.desc:0 "With a roar like a falling mountain, a gallery beneath [hold.GetName] gives way. Dust fills the shafts. Somewhere under the rubble, miners are calling."
 aov_hold_dig.9.a:0 "Dig out the trapped at any cost. (100 [gold|E])"
 aov_hold_dig.9.b:0 "Seal the gallery to save the rest."
 aov_hold_dig.9.c:0 "Press on past the collapse."
 aov_hold_dig.10.t:0 "A Master Engineer Arrives"
 aov_hold_dig.10.desc:0 "A famed engineer of the deep holds has come to [hold.GetName], ink on her fingers and rune-etched tools on her belt. She offers her services, for a price."
 aov_hold_dig.10.a:0 "Hire her to oversee the work. (150 [gold|E])"
 aov_hold_dig.10.b:0 "Learn her methods and pay in thanks."
 aov_hold_dig.10.c:0 "Thank her and send her on her way."
 aov_hold_dig.11.t:0 "Shortage of Timber"
 aov_hold_dig.11.desc:0 "The timber stacks at [hold.GetName] run low and the shoring props are splintering. A hold may be carved from stone, but it is braced with oak."
 aov_hold_dig.11.a:0 "Buy timber from the surface merchants. (90 [gold|E])"
 aov_hold_dig.11.b:0 "Shorten the new galleries to save wood."
 aov_hold_dig.11.c:0 "Strip the hold's own roof beams."
