 building_aov_monument_marrhold_the_feather_academy_01: "The Feather Academy"
 building_aov_monument_marrhold_the_feather_academy_01_desc: "Griffons are local to the mountainous lands around the Serpentspine, and particularly around Marrhold. The Marrodic peoples are the only group of humans in Cannor to have successfully tamed Griffons and learned to fly them. To teach others - mostly from Marrhold but also promising candidates from the rest of Escann - The Feather Academy was created. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
