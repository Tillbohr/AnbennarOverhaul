 building_aov_monument_ger_bexamurr_01: "Ger-Bexamurr"
 building_aov_monument_ger_bexamurr_01_desc: "Located in Windsculpt Pass, far away from any settlement, the Ger-Bexamurr is a Xhazobkultist temple complex. It contains several buildings and altars within a circular layout, interrupted by a small black stone wall. Below the temple lies a vast and complex network of tunnels, a massive labyrinth in which no light can be lit. It is said that demons walk through the tunnels, killing and eating all those who they deem unworthy. In the centre of the labyrinth lies the Talazdvoger, the border with death itself: a black, bottomless pit where the remains of those sacrificed are thrown, a place fit for the Pits of Grilax, a place out of myth. The priests believe that the pit feeds on the demonic power of the dead, and once it satisfies its hunger, it will create a breach between the realm of Xhazob and the material plane. While most Xhazobkultists will principally sacrifice anyone to their demonic masters, the priests of the Ger-Bexamurr only sacrifice those who possess a great demonic power. They sacrifice living and dead beings alike, and it is said that in antiquity they managed to retrieve the remains of the Xhazobine, sacrificing her remains to the Talazdvoger. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
