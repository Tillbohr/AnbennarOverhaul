 building_aov_monument_marrhold_gate_to_the_serpentspine_01: "Marrhold, Gate to the Serpentspine"
 building_aov_monument_marrhold_gate_to_the_serpentspine_01_desc: "Marrhold is an ancient dwarven hold, but has long since been abandoned by the dwarves due to an unfortunate tunnel collapse. Now, Alenic humans reside in and around the old hold, having been rebuilt and occupied by them since 492 AA. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
