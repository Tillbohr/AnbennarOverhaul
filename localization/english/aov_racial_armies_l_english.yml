l_english:
 # Anbennar Overhaul: racial armies (new men-at-arms)
 # Moon elves
 aov_elven_knights:0 "Elven Knights"
 aov_elven_knights_flavor:0 "#F Like their human counterparts, Elven Knights ride to war in plate, but they charge only once: after the lance breaks, centuries-honed reflexes decide the melee.#!"
 aov_gladeguards:0 "Gladeguards"
 aov_gladeguards_flavor:0 "#F Trained in secret to guard the moon elves' forest vales, Gladeguards loose from the boughs of the great oaks and are gone before the enemy reaches the treeline.#!"
 # Sun elves
 aov_sunspear_phalanx:0 "Sunspear Phalanx"
 aov_sunspear_phalanx_flavor:0 "#F Jaher's phalangites hold the line of the Phoenix Empire with long spears and bronze-faced shields, a wall that Bulwari chariots have learned not to charge.#!"
 aov_phoenix_bowmen:0 "Phoenix Bowmen"
 aov_phoenix_bowmen_flavor:0 "#F Sun elf archers who learned their craft on the decks of the Sundancer fleet. Their volleys darken the desert sky before the Companions charge.#!"
 aov_sandwind_outriders:0 "Sandwind Outriders"
 aov_sandwind_outriders_flavor:0 "#F Light horsemen of the Phoenix Empire who scout ahead of the legions, run down broken enemies and vanish into the dunes as fast as the wind that names them.#!"
 aov_duneblades:0 "Duneblades"
 aov_duneblades_flavor:0 "#F Lightly armoured sun elf skirmishers who fight in loose order across the sands, screening the legions and harrying any foe slow enough to catch.#!"
 # Wood elves
 aov_greatoak_wardens:0 "Greatoak Wardens"
 aov_greatoak_wardens_flavor:0 "#F The few wood elves who wear heavy armour stand as living walls before the groves of the Deepwoods. Under the canopy, no foe has ever broken them.#!"
 # Dwarves: clan signature units
 aov_grudgebearers:0 "Grudgebearers"
 aov_grudgebearers_flavor:0 "#F Rubyhold's spearmen remember every slight, and Lorent's knights have given them many. Thorgrim the Grudgebearer's heirs meet a cavalry charge with a forest of steel.#!"
 aov_silverforge_engineers:0 "Silverforge Engineer Corps"
 aov_silverforge_engineers_flavor:0 "#F The engineers who cut Silverforge's great open-pit mines turn the same craft to war, undermining walls and raising siege engines faster than any human army.#!"
 aov_tortoise_formation:0 "Tortoise Formation"
 aov_tortoise_formation_flavor:0 "#F The life of one dwarf is worth more than the death of many foes. Behind overlapping tower shields, the tortoise turns aside arrows and blades alike.#!"
 aov_giantbane_crossbows:0 "Giantbane Crossbows"
 aov_giantbane_crossbows_flavor:0 "#F Khugdihr has fallen many times, to orcs, to dragons and to the giants of the surface. Its heavy crossbows are built to bring down the largest of them.#!"
 aov_uthojdihr_marines:0 "Uthojdihr Marines"
 aov_uthojdihr_marines_flavor:0 "#F Unlike most dwarves, the Uthojdihr clan of Ovdal Tûngr took to the sea. Its marines fight as well knee-deep in a marsh as on a copper-sheathed deck.#!"
 aov_seg_band_gnollhunters:0 "Seg Band Gnollhunters"
 aov_seg_band_gnollhunters_flavor:0 "#F The Seg Band, the Southern Gnoll Hunters' Alliance of Seghdihr, first won its fame guarding Bulwar from gnoll raiders. Its hunters run down any foe across the desert.#!"
 aov_golden_gate_guard:0 "Golden Gate Guard"
 aov_golden_gate_guard_flavor:0 "#F Sworn to the three golden gates of Verkal Gulan, these guards have never let an enemy through the Hero's Gate while they still stood.#!"
 aov_clockwork_bows:0 "Massed Clockwork Bows"
 aov_clockwork_bows_flavor:0 "#F A remnant of Aul-Dwarov kept alive by Hehodovar's Builders Guild: alloyed bows that tension their own steel strings, loosing bolts at unfathomable speed.#!"
 aov_dauvek_veker:0 "Dauvek Veker"
 aov_dauvek_veker_flavor:0 "#F The Monster Hunters, greatest of the Titanium Orders of Gor Vazumbrog. Death-seeking penitents once, they now hunt whatever crawls up from the deep.#!"
 aov_copper_road_wardens:0 "Copper Road Wardens"
 aov_copper_road_wardens_flavor:0 "#F By the Copper Road Pact, Gor Ozumbrog patrols the dwarven road to Ovdal Kanzad. Its ram riders know every tunnel and every goblin ambush along it.#!"
 aov_brightbeard_hammers:0 "Brightbeard Hammers"
 aov_brightbeard_hammers_flavor:0 "#F Shazstundihr honours Mhoki Brightbeard, who ended a 47-year siege by slaying the Precursor emperor with one blow of his warhammer. His heirs still crush armour with theirs.#!"
 aov_lens_crossbows:0 "Lens Crossbows"
 aov_lens_crossbows_flavor:0 "#F The scholars of Guntîrhug ground lenses of blue Orlghelovar glass for every science. The cobalt dwarves mount the same lenses on their crossbows, and seldom miss.#!"
 aov_lightflare_guard:0 "Lightflare Guard"
 aov_lightflare_guard_flavor:0 "#F Their armour is set with dozens of warded diamonds that throw the light of the Diamond Kings' halls into the eyes of anything waiting in the dark. Cave goblins learned long ago not to ambush them.#!"
 aov_flint_forest_rangers:0 "Flint Forest Rangers"
 aov_flint_forest_rangers_flavor:0 "#F Verkal Skomdihr's rangers spend their lives in the Deepwoods, keeping the fey at bay. The flint dwarves made the first handheld guns for them, and they trust their own eyes before any glamour.#!"
 aov_orcrend_guard:0 "Orcrend Guard"
 aov_orcrend_guard_flavor:0 "#F Gerin Orcrend came to Ovdal Lodhum to kill orcs, stayed for love and was chosen king. The pike drill he taught the garnet dwarves still breaks every charge that comes down the tunnels.#!"
 aov_basalt_berserkers:0 "Basalt Berserkers"
 aov_basalt_berserkers_flavor:0 "#F Every basalt dwarf carries the fire of Gor Bûrad inside. Its berserkers were raised on Borbordûz, the fire duel above the lava lake, and fight with little armour and no mercy.#!"
 aov_amldavhad_guard:0 "Amldavhad Guard"
 aov_amldavhad_guard_flavor:0 "#F The Shields of the Assembly are kazalûg, the clanless ones. Sworn to no clan, they can be turned by no clan's plots, and they guard the High Assembly of Amldihr against all of them.#!"
 aov_platinum_warsuits:0 "Platinum Warsuits"
 aov_platinum_warsuits_flavor:0 "#F The noblest warriors of Haraz Orldhûm wear armour said to lend them the strength of the mountain itself. Few suits were ever made, for Orldhûm keeps the secret even from its own rivals at home.#!"
 aov_mithril_warchanters:0 "Warchanters of Mithradhûm"
 aov_mithril_warchanters_flavor:0 "#F Mithril soldiers chant the names of their forerunners on the march and call one with every blow of hammer or axe. Their foes find it unnerving, and the chanters find little left to fear.#!"
 aov_mercenary_guards:0 "Er-Natvir Mercenary Guards"
 aov_mercenary_guards_flavor:0 "#F The merchants of Er-Natvir pay better than its kings, so hired clans guard their caravans and rail yards. Their loyalty lasts as long as the coin, which is long enough to stop most Opal bandits.#!"
 aov_railway_robbers:0 "Opal Railway Robbers"
 aov_railway_robbers_flavor:0 "#F The rails of Er-Natvir run close to Verkal Kozenad, and Opal dwarves have lived off them ever since. Bozan Kezdori once stole a whole train of gold tithe and nearly broke the Dwarovar's economy with it.#!"
 aov_sewer_wardens:0 "Hul-Jorkad Sewer Wardens"
 aov_sewer_wardens_flavor:0 "#F Every soldier of Hul-Jorkad comes of age in the tunnels beneath the hold, clearing skitterer webs, goblin squatters and worse from the pipes. After the sewers, few battlefields trouble them.#!"
 aov_fourfoot_chargers:0 "Fourfoot Chargers"
 aov_fourfoot_chargers_flavor:0 "#F The Ramlords of Orlazam still tell of Tednur Fourfoot, whose charge broke one of the largest goblin hordes in history. His heirs ride the same great rams and hit just as hard.#!"
 # Debug battles
 aov_racial_armies_debug_army:0 "Test Army"
