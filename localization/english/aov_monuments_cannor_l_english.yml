 building_aov_monument_elikhander_sphinx_01: "Escanni Sphinx"
 building_aov_monument_elikhander_sphinx_01_desc: "A colossal guardian of carved stone keeps watch over Silvervord. Travellers claim that it still asks riddles of anyone who would lay claim to the lands it protects."
 building_aov_monument_elikhander_sphinx_02: "Escanni Sphinx (II)"
 building_aov_monument_elikhander_sphinx_02_desc: "A colossal guardian of carved stone keeps watch over Silvervord. Travellers claim that it still asks riddles of anyone who would lay claim to the lands it protects."
