 building_aov_monument_the_north_citadel_morgurax_monument_03_desc: "Morgurax is a fortress that hangs in the air above the Stairs of Regency, raised by Castanorian sorcery as a refuge for the empire's regents. It looks down on the lands below as a sleepless watcher. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
 building_aov_monument_the_south_citadel_02: "The South Citadel (II)"
 building_aov_monument_the_south_citadel_02_desc: "Twin to the North Citadel at the foot of the Trialmount, the South Citadel guarded the southern approaches to Castonath. It housed the legions that kept the roads of the Empire of Castanor open."
