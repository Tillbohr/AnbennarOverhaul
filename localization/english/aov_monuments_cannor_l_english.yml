 building_aov_monument_toncodden_lighthouse_01: "Toncodden Lighthouse"
 building_aov_monument_toncodden_lighthouse_01_desc: "The Storm Isles have always been a dangerous place to reach, due to the very treacherous waters surrounding them. Storms constantly fill the skies, and the waters are filled with both dread creatures below the waves and hostile raider ships from abroad, threatening any ships travelling these seas. To help their ships navigate the dangerous waters around their home islands, the Storm Gnomes constructed a great towering lighthouse structure on the central island of Toncodd, so that their ships could reach their destination safer than before. For centuries, the Toncodden Lighthouse has been used by navigators familiar with local conditions to sail through these tempestuous waters and has allowed for far safer sea travel. As the gnomes of the Dragon Coast have further developed the art of Artificery and its application in the world, the Toncodden Lighthouse has gained a secondary purpose; as a lightning harvesting device. Using the great storms as a way to empower Artificery devices has found many applications across the Storm Isles. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
