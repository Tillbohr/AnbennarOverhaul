 building_aov_monument_draculas_throne_01: "Throne of the Sorceror-King"
 building_aov_monument_draculas_throne_01_desc: "Nichmer, more commonly known as the Sorcerer King was a former advisor of Korbarid origin to the Empire of Castanor. Using dark magics he enthralled Castan the Enthralled and used him to wage war on the rest of Cannor, in what would later be known as the War of the Sorcerer King. Before the war broke out however, Nichmer commissioned a grand thone for himself in Castonath, one that would demonstrate his power as the new and legitimate ruler of Castanor. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
