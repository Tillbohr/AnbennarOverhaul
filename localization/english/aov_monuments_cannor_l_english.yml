 building_aov_monument_ascajar_01: "Ascajar"
 building_aov_monument_ascajar_01_desc: "Nestled within the verdant coastal hill range of Busilar and overlooking prosperous Port Jaher at the mouth of the Hapainé, the palace of Ascajar is truly deserving of its moniker 'Citadel of Flowers'. Its origins can be traced to a fortification erected in 488 AA by the rulers of Kišakur to secure their control over the vital port of Abtanus, which would later become Port Jaher. After their descendants secured their hold over Businor, the fortress was first expanded, then demolished in 672 AA. In its place the palace of Azka-Ayaru, or Citadel of Flowers, was erected and became the royal palace of Itrahureš for the following two centuries. Around 750AA, the famed gardens of Ascajar were first established. After the fall of Itrahureš, Ascajar lost its prominence for a time under the rule of Black Castanor, but it was restored to its former glory under the Phoenix Empire and has since served as the favorite royal retreat of the ruling Silnara dynasty of Busilar. The intricately decorated interior of the palace and its soaring architecture, built in the unique Ilatani style, are remarkable enough on their own, but even they are overshadowed by the vast palace gardens, sprawling across a series of terraces surrounding the palace. A network of pools and fountains ensure a balmy clime even during the heat of the summer months and a stunning array of flowers from places as far away as Fangaula and Rahen bloom year round. Here the spirit of Itrahureš lives on: combining disparate cultures to create something better, stronger and infinitely more beautiful. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
