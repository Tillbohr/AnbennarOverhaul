 building_aov_monument_lorenans_rest_02: "Lorenan's Rest (II)"
 building_aov_monument_lorenans_rest_02_desc: "The final resting place of Lorenan the Great, his wife and his Linnati, this mausoleum was built in the late years of his long reign, when the Ruby Crown weighed heavily upon his shoulders. Excavated into the side of a hill and built with white stone, it features a long nave that gives way to a circular chamber. In its center, mirroring the ancient throne room in Lorentei, two thrones are found, featuring statues of Lorenan and his wife, Elemia, with the tombs of the couple directly under said statues. Around them, arranged in a circle, are the statues and tombs of each of the eleven Linnati of Lorenan, guarding their monarch in death as they did in life. A great equestrian statue of Lorenan armed for battle stands in the plaza in front of the mausoleum commissioned by king Lorevarn II of Lorent, Lorenan's descendant, crafted by the great artisans of the Ruby Mountains. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
 building_aov_monument_lorenans_rest_03: "Lorenan's Rest (III)"
