 AOV_SPONSOR_BRILLITES_DESC: "The Brillites chase whatever spark of genius strikes them first. They will discover a random invention."
 AOV_SPONSOR_MECHANISTS_HEADER: "#T Mechanists#! #weak (10 years)#!"
 AOV_SPONSOR_MECHANISTS_DESC: "The Mechanists work methodically within one field. Choose the field; they will discover a random invention in it."
 AOV_SPONSOR_TECHNOMANCERS_HEADER: "#T Technomancers#! #weak (15 years)#!"
 AOV_SPONSOR_TECHNOMANCERS_DESC: "The Technomancers pursue exactly what you ask of them. Choose a field, then one of the inventions they propose."
 AOV_RESEARCH_START_BRILLITES: "Sponsor the Brillites (@gold_icon! 50)"
 aov_artificery_not_researching_tt: "No research project is under way"
 aov_artificery_research_gold_tt: "Has at least @gold_icon! 50 gold"
 aov_artificery_any_discoverable_tt: "An invention is still left to discover in the unlocked tiers"
 aov_artificery_category_discoverable_tt: "An invention is still left to discover in this field"
 aov_artificery_free_slot_tt: "Has a free invention slot"
 aov_artificery.1.t: "A New Invention"
 aov_artificery.1.desc: "The [ROOT.Char.Custom('AovLastSponsorName')] present the fruit of their labours: [ROOT.Char.Custom('AovLastDiscoveredName')]. The plans are complete and the prototype works, mostly."
 aov_artificery.1.a: "Put it to use at once."
 aov_artificery.1.b: "Store the plans for now."
 aov_artificery.2.t: "Research Abandoned"
 aov_artificery.2.desc: "The [ROOT.Char.Custom('AovLastSponsorName')] report that nothing in their field is left for them to discover. The @gold_icon! 50 gold sponsorship has been returned."
 aov_artificery.2.a: "A pity."
