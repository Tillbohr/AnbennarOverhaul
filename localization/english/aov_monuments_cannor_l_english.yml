 building_aov_monument_telgeir_vanbury_steel_foundry_01: "Vanbury Steel Foundry"
 building_aov_monument_telgeir_vanbury_steel_foundry_01_desc: "Telgeir is home to the immense and influential Vanbury Guild, an ancient dynasty originally from Gawed. When the dynasty moved to their current 1444 home in Telgeir, they brought with them their traditions of smithing and armor-making, leading up to what is today the Vanbury Steel Foundry. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
