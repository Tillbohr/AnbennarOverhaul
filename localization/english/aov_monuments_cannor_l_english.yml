 building_aov_monument_bal_vroren_03_desc: "One of Balgar's Wonders, the Citadel of Bal Vroren was built in 546 BA by the Empire of Castanor to defend against the Giants and their subjects to its north. Nestled in a natural harbor along the Giant's Grave Sea, Bal Vroren would come to serve as host to the fearsome Giantsbane Legion and as an important naval center and staging ground from which Castanor influenced the whole of Gerudia. During the events of the Dragonwake of 470 AA, centuries after its founding, tens of thousands of refugees would seek shelter in Bal Vroren's mighty walls. But when the dragon Elkaesal the White came to the Citadel's gates, all of them would be frozen to death overnight. Ever since that harrowing event, Bal Vroren has attracted rumors of curses and hauntings and has been left abandoned, with its ruined walls, towers, and keeps serving as grim reminder of the terror that once afflicted Cannor. Seeing Bal Vroren refurbished and fully manned would require significant effort, and it is so thoroughly scarred and marred by would-be conquerors and invaders that most now believe it can never be fully restored. If even a measure of Bal Vroren's former glory were to be regained, however, it is certain that Cannor and Gerudia would again be divided by the towering, impenetrable heights of the Vrorenswall... Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
 building_aov_monument_baths_of_verinus_01: "Baths of Verinus"
 building_aov_monument_baths_of_verinus_01_desc: "Once the jewel of Eastbright, the Baths of Verinus remain one of the greatest feats of Damerian engineering - albeit now slumbering beneath ivy-covered arches and shattered domes. Commissioned in 97 AA by Cr. Verinus Erienticus, a controversial Luminary from East Dameshead, the baths were part of a grand vision: to elevate his standing and create a haven where the elite of the Republic could gather to rest. Inaugurated in 101 AA and expanded over two decades, the complex sprawled across multiple terraces above the Eastbright springs, featuring over forty pools of varying temperatures, colonnaded courtyards, domed pavilions, and stained-glass ceilings casting kaleidoscopic light. Mosaics depicted civic virtue and conquest, while scroll-filled libraries, banquet halls, and tranquil gardens made the Baths a sanctuary of debate and intrigue. Heated by vast hypocaust systems and staffed by hundreds, the Baths were a living theatre of power. As they symbolised the very nature of the Republic, it was natural that they declined with it - the entire complex was sundered after the invasion of the Three Tribes in the 5th century shattered an already disorganised state. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
