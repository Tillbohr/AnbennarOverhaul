 building_aov_monument_escandar_03_desc: "Escandar has always guarded contested territory. It was first built by the famed Calasandur the Magnificent as steward of the pass through the Khenak Mountains. As the main fortress separating The Borders and Businor, it served to keep Businor's gnoll infestation out of the southeastern Dameshead. Escandar has famously changed hands many times. During the War of the Sorcerer King, the Wexonard warlord Magda síl Magda was appointed to rule from the citadel, as duchess of the short-lived Duchy of Escandar. In the time of Jaher's conquests, Escandar was a stronghold for his early conquests in Southeast Cannor. When the Busilari Interregnum led to patchwork civil wars between countless petty kings and squabbling warlords, Escandar was a safe harbor for all peoples. In modern times, Escandar retains its original role of keeping the diminished Hillthrone gnoll packs at bay. Courtiers grumble that its garrison should finally wipe out the pests, and be reassigned to better things... Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
 building_aov_monument_esthili_academy_of_magic_01: "Esthíli Academy of Magic"
 building_aov_monument_esthili_academy_of_magic_01_desc: "The Esthíli Academy of Magic is the foremost magical education institution in all of Escann. In all of Cannor, only the Mage Academy of Lorentainé is able to compete with it. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
