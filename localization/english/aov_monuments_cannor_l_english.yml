 building_aov_monument_konwell_the_imperial_archives_01: "The Imperial Archives"
 building_aov_monument_konwell_the_imperial_archives_01_desc: "Traditionally the seat of the Imperial Archives, the city of Konwell has always been a hotspot for Anbennarian scholars, where books were safe from the frequent fires in Anbenncost. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
