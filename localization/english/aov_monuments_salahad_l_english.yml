 building_aov_monument_water_dreams_oasis_01: "Oasis of Water Dreams"
 building_aov_monument_water_dreams_oasis_01_desc: "Deep within the western reaches of the Salahad rises a jagged sandstone plateau riven by a network of narrow ravines. At its heart, hidden behind a labyrinth of sandstone canyons, lies the blue marvel of the desert, the Oasis of Water Dreams: a network of clear spring pools whose water nourishes a verdant paradise in this otherwise inhospitable land. Shielded from the glare of the desert sun by the surrounding steep cliffs, it has since time immemorial been a refuge and place of rest for all who traverse these parts of the Salahad. Called Jisugo Loban by the Mukarron tribe native to these lands, and Gortarkhitanda by their gnollish overlords, the Oasis of Water Dreams is not only a vital resupply stop for all who wish to traverse the unforgiving desert, but also the home of an ancient temple complex that is sacred to all, be they Fangaulan, Akasi or Gnoll. Hewn into the cliff faces surrounding the oasis are easily defendable access points to the subterranean network of temples and sanctuaries carved into the sandstone over the past millennia. The flowers blooming on the shore of the oasis ponds provide the pollen used by a hardy species of desert bee to produce a unique hallucinogenic honey, a treasured ritual substance for religious ceremonies held in the oasis temple and beyond. Guarding this unique sanctuary since before the rise of the second Fangaulan Empire are the Bermine Basugo, the Guides of the Dream, an order of planetouched sworn to defend the sanctity of the temples of Jisugo Loban and all who seek shelter there. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
