 building_aov_monument_palace_of_unity_01: "Palace Of Unity"
 building_aov_monument_palace_of_unity_01_desc: "It is a fairytale thing, to tear down a building and remake it again elsewhere - yet in such a spectacle, real meaning is found. Just as the borders of our Empire superficially resemble the old, the Palace of Unity resembles the Imperial Palace of old; yet it is a fundamentally different thing, a building intended for an entirely different purpose. Once our Pashainéy envoys walked the halls of this place as supplicants and wheedlers, cleverly building influence and protecting their fragile realm - now, the people's clerks, administrators and representatives work for the good of us all. The dynastic feuding of old Anbennar has given way to a state which serves the many, not the few. See every statue anew; take stock once more of each chamber. They have been changed forever."
