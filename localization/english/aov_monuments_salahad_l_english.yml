 building_aov_monument_aur_kes_akasik_01: "Aur-Kes-Akasik"
 building_aov_monument_aur_kes_akasik_01_desc: "Carved into the face of the mighty Akasi mountains is an ancient palace from a bygone era. It was one of many palaces created and held by the giants, until the mighty Storm Queens overthrew them with the help of the Fangaulan king Aro. After expelling the giants from Akasik, the Storm Queens reshaped the once unassuming palace into the greatest in North Sarhal; the mountains themselves were molded to form new chambers of the palace and grant it the eternal embrace of the mother. The Storm Queens brought forth many fresh springs from the earth to create wondrous gardens and an ever-running hydraulic system, and set in place powerful enchantments that still stir spring breezes through the many open spaces of the palace. While before the splintering of Akasik the palace was the primary court of many kings and queens, in recent times it has served as a pilgrimage site for the faithful and the planetouched of Akasik, bringing a semblance of centralization to an otherwise splintered faith. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
