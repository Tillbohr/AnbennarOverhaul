 building_aov_monument_bjarnrik_staple_port_of_konungrhavn_01: "Staple Port of Konungrhavn"
 building_aov_monument_bjarnrik_staple_port_of_konungrhavn_01_desc: "Situated at the mouth of the Rafn river, Konungrhavn has always been the staple port of Bjarnrik. Trade on the Giant's Grave Sea has shuffled from east to west and back, rarely moving past the Dragon Coast because of the dangerous seas and those borne upon them. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
