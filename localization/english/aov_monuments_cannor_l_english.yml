 building_aov_monument_elikhander_orbs_03_desc: "The Elikhander kings of old raised these obelisks to gather and hold the power of the land. Their carved runes still glow faintly at dusk, and scholars and priests alike make the journey to read them."
 building_aov_monument_elikhander_pyramid_01: "Elikhander Pyramid"
 building_aov_monument_elikhander_pyramid_01_desc: "A great stepped tomb raised by the Elikhander in the first age of Escann. Its sealed chambers are said to hold the bodies of dead kings together with the treasures they refused to leave behind. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
