 building_aov_monument_damescrown_grand_exchange_01: "Grand Exchange of Damescrown"
 building_aov_monument_damescrown_grand_exchange_01_desc: "The Grand Exchange is the largest market forum in Anbennar, surpassing even those of Anbenncost in selection and grandeur. The CLSTC, the largest mercantile company in the world, is headquartered in Damescrown due to the city's incredible mercantile significance. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
