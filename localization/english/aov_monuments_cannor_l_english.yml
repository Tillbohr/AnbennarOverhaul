 building_aov_monument_ibevar_temple_of_munas_01: "Temple of Munas"
 building_aov_monument_ibevar_temple_of_munas_01_desc: "The elves of Ibevar seek to build their planned temple to Munas Moonsinger, the god of travel, music, and the seas, who saved the elven Remnant Fleet and ended their 1000-year voyage after the loss of their homeland in the Day of Ashen Skies."
