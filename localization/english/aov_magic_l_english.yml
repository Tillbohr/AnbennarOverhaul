 AOV_MAGIC_MANA_TT: "Mana refills by #V [GetPlayer.MakeScope.ScriptValue('aov_mana_refill_month')|1]#! per month: 5, plus half my Learning, plus 2 per level of Magical Affinity. The maximum is 100 plus 50 per level of Magical Affinity.\n\nMagic lifestyle perks raise these.\n\nSpells cost 25, 50, 100 or 200 mana by level, before perks."
 AOV_MAGIC_STUDYING: "Studying: [GetPlayer.Custom('AovStudyingSchool')] (#V +[GetPlayer.MakeScope.ScriptValue('aov_study_gain_current_month')|0]#! per month)"
 AOV_MAGIC_STUDY_TT: "Study progress per month: my Learning plus 5 per level of Magical Affinity. A school reaches level 1 at 300, level 2 at 800 and level 3 at 2000. Study focus, school perks and the Arcane Scholar trait raise the rate for their schools. Casting a spell adds the spell's base mana cost as progress to its school."
