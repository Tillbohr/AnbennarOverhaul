 AOV_INV_LOCKED_TIER_2_TT: "#N Locked:#! requires the High Medieval era and [GetPlayer.MakeScope.ScriptValue('aov_invention_tier_gate_count')|0] Tier I inventions discovered ([GetPlayer.MakeScope.ScriptValue('aov_inventions_t1_discovered_count')|0] so far)."
 AOV_INV_LOCKED_TIER_3_TT: "#N Locked:#! requires the Late Medieval era and [GetPlayer.MakeScope.ScriptValue('aov_invention_tier_gate_count')|0] Tier II inventions discovered ([GetPlayer.MakeScope.ScriptValue('aov_inventions_t2_discovered_count')|0] so far)."
 AOV_INV_UNDISCOVERED_TT: "#weak Not yet discovered. The Brillites may discover it at random, the Mechanists when researching its field, and the Technomancers can offer it.#!"
 AOV_INV_CLICK_ACTIVATE: "#I Click to activate this invention#!"
 AOV_INV_NO_FREE_SLOT: "#N Every invention slot is in use or cooling down.#!"
 AOV_INV_CLICK_DEACTIVATE: "#P Active.#! #I Click to deactivate it#!; the emptied slot cannot be refilled for 1 year."
 AOV_INVENTIONS_SLOTS: "Invention slots: [GetPlayer.MakeScope.ScriptValue('aov_invention_active_count')|0] / [GetPlayer.MakeScope.ScriptValue('aov_invention_slots_max')|0]"
 AOV_INVENTIONS_SLOTS_TT: "4 slots in the Early Medieval era, 5 in the High Medieval era and 6 in the Late Medieval era. A slot that is emptied cannot be refilled for 1 year."
 AOV_INVENTIONS_COOLING: "#weak ([GetPlayer.MakeScope.ScriptValue('aov_invention_slots_cooling')|0] cooling down)#!"
 AOV_RESEARCH_BUTTON: "Research"
 AOV_RESEARCH_RUNNING: "The [GetPlayer.Custom('AovResearchSponsorName')] are at work: [GetPlayer.MakeScope.ScriptValue('aov_research_years_left')|1] years left"
 AOV_RESEARCH_RUNNING_TARGET: "Target: [GetPlayer.Custom('AovResearchTargetName')]"
 AOV_RESEARCH_RUNNING_CATEGORY: "Field: [GetPlayer.Custom('AovResearchCategoryName')]"
 AOV_SPONSOR_BRILLITES: "Brillites"
 AOV_SPONSOR_MECHANISTS: "Mechanists"
 AOV_SPONSOR_TECHNOMANCERS: "Technomancers"

 # Research popup (event style)
 AOV_RESEARCH_EVENT_TITLE: "Patronage of the Artificers"
 AOV_RESEARCH_EVENT_DESC: "Word that I mean to fund a new line of research has spread through the Artificer Academy, and three of its luminaries have come to make their case.\n\nThe #V Brillites#! chase whatever spark of genius strikes them first and promise a random invention within #V 5 years#!. The #V Mechanists#! work methodically within one field of my choosing for #V 10 years#!. The #V Technomancers#! will build exactly the invention I ask for, given #V 15 years#!.\n\nWhichever faction I favor will expect @gold_icon! #V 50#! gold."
 AOV_RESEARCH_EVENT_DESC_MECHANISTS: "The Mechanist unrolls a sheaf of meticulous diagrams. \"Name the field, and we shall see what can be wrought within it. Ten years, no more, no less.\"\n\nThe Mechanists will discover a random invention in the field I choose."
 AOV_RESEARCH_EVENT_DESC_TECHNOMANCERS: "The Technomancer's eyes gleam behind a pair of whirring lenses. \"Tell us where your interests lie, and we will show you what we could build for you.\"\n\nChoose a field to hear the Technomancers' proposals."
 AOV_RESEARCH_EVENT_DESC_PROPOSALS: "\"These are our proposals. Choose one, and in fifteen years it will be yours.\"\n\nThe Technomancers will discover the invention I choose."
 AOV_RESEARCH_LEADER_BRILLITES: "Speaker of the Brillites"
 AOV_RESEARCH_LEADER_MECHANISTS: "Speaker of the Mechanists"
 AOV_RESEARCH_LEADER_TECHNOMANCERS: "Speaker of the Technomancers"
 AOV_RESEARCH_OPTION_BRILLITES: "Sponsor the Brillites: a random invention"
 AOV_RESEARCH_OPTION_MECHANISTS: "Sponsor the Mechanists: choose a field"
 AOV_RESEARCH_OPTION_TECHNOMANCERS: "Sponsor the Technomancers: choose an invention"
 AOV_RESEARCH_OPTION_LEAVE: "Not now."
 AOV_RESEARCH_OPTION_BACK: "Back"
 AOV_RESEARCH_OPTION_FIELD_ECONOMIC: "The Economic field"
 AOV_RESEARCH_OPTION_FIELD_MILITARY: "The Military field"
 AOV_RESEARCH_OPTION_FIELD_SOCIETY: "The Society field"
 AOV_RESEARCH_COST_BRILLITES: "@gold_icon! [GetPlayer.MakeScope.ScriptValue('aov_research_cost_brillites')|0]"
 AOV_RESEARCH_COST_MECHANISTS: "@gold_icon! [GetPlayer.MakeScope.ScriptValue('aov_research_cost_mechanists')|0]"
 AOV_RESEARCH_COST_TECHNOMANCERS: "@gold_icon! [GetPlayer.MakeScope.ScriptValue('aov_research_cost_technomancers')|0]"
 AOV_RESEARCH_LEADER_VACANT: "Vacant"
 aov_artificery_not_researching_tt: "No research project is under way"
 aov_artificery_research_gold_brillites_tt: "Has at least @gold_icon! [ROOT.Char.MakeScope.ScriptValue('aov_research_cost_brillites')|0] gold"
 aov_artificery_research_gold_mechanists_tt: "Has at least @gold_icon! [ROOT.Char.MakeScope.ScriptValue('aov_research_cost_mechanists')|0] gold"
 aov_artificery_research_gold_technomancers_tt: "Has at least @gold_icon! [ROOT.Char.MakeScope.ScriptValue('aov_research_cost_technomancers')|0] gold"
 aov_artificery_any_discoverable_tt: "An invention is still left to discover in the unlocked tiers"
 aov_artificery_category_discoverable_tt: "An invention is still left to discover in this field"
 aov_artificery_free_slot_tt: "Has a free invention slot"
 aov_artificery.1.t: "A New Invention"
 aov_artificery.1.desc: "The [ROOT.Char.Custom('AovLastSponsorName')] present the fruit of their labours: [ROOT.Char.Custom('AovLastDiscoveredName')]. The plans are complete and the prototype works, mostly."
 aov_artificery.1.a: "Put it to use at once."
 aov_artificery.1.b: "Store the plans for now."
 aov_artificery.2.t: "Research Abandoned"
 aov_artificery.2.desc: "The [ROOT.Char.Custom('AovLastSponsorName')] report that nothing in their field is left for them to discover. The @gold_icon! [ROOT.Char.MakeScope.Var('aov_research_paid').GetValue|0] gold sponsorship has been returned."
 aov_artificery.2.a: "A pity."

 # Invention men-at-arms
 aov_war_golems: "War Golems"
 aov_war_golems_flavor: "#F Stone soldiers animated by artifice, as tireless as they are hard to break.#!\n#help Recruitable once [GetModifier('aov_invention_war_golems').GetName] is discovered.#!"
 aov_clockwork_repeaters: "Clockwork Repeaters"
 aov_clockwork_repeaters_flavor: "#F Crossbowmen whose spring-wound repeating stocks loose bolt after bolt without a pause to span the bow.#!\n#help Recruitable once [GetModifier('aov_invention_clockwork_repeaters').GetName] is discovered.#!"
 aov_gnomish_bombards: "Gnomish Bombards"
 aov_gnomish_bombards_flavor: "#F Squat iron-hooped guns on timber carriages, built to batter walls that no ram could reach.#!\n#help Recruitable once [GetModifier('aov_invention_gnomish_bombards').GetName] is discovered.#!"
