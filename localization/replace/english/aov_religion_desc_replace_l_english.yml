l_english:
 # Anbennar Overhaul: descriptions for Anbennar's religions and faiths that only had a placeholder ("TODO", "test",
 # "idk" or empty). Where EU4 Anbennar has a religion description it is used, set in the CK3 period where needed;
 # the rest are written for the overhaul. tools/tests/test_religion_descs.py fails if a placeholder is left.

 # Akasi
 mother_akasik_desc:0 "The local deity of the Akasi peoples, Mother Akasik is both the literal and spiritual representation of the Akasik Mountains - she is a firm and just god, yet caring for those who call her lands home."

 # Bulwari Sun Cults (EU4: the Cult of the Eclipse law aspect and mission)
 cult_of_the_eclipse_desc:0 "Few know about the Cult of the Eclipse, which is half myth and half nightmare to other followers of Surakel and temporal authorities. Their meetings and congregations are kept secret and hidden away from eyes deemed unworthy. They believe that the Onslaught which devastated Bulwar in antiquity and the rise of monstrous races in its aftermath were a salvation disguised as a punishment from Surakel, meant to purge those sinners who were corrupted by the Malevolent Dark. This notion is a truly heterodox theological interpretation which has led many outsiders over the centuries to consider this cult as almost heretical.\n\nNot a lot is known about the mysterious followers of the Deep Devils, but it is said that they meet in secret every new moon, in some hideout on the outskirts of Azkabar, seeking to bring back their masters to rid mankind of its sinners once more."

 # Cannorian Pantheon (EU4: the Silversea Temple and Cult of the Lightfather missions, the Cult of Uelos religion)
 west_damish_desc:0 "The West Dameshead, despite recognizing the authority of the High Luminary, follow a different version of the cult of The Dame and Munas. Named after its main temple in Windtower, the Silversea Temple does not praise The Dame as a goddess of harvest, having the position filled by a minor deity called Meris, a goddess originating in the region's Lencori past. Instead, the temple focuses on The Dame as a goddess of knowledge and magic.\n\nThe temple is renowned for its study of celestial objects; the knowledge obtained is a great help to both its priests, who use it to divine the future with more accuracy, and the region's many sailors, who are always thankful for the detailed star charts that the temple can provide."
 cult_of_the_lightfather_desc:0 "When, at the end of the White Pestilence, the Phoenix Empress Jexis offered the Ilatani that remained in Itrahureš the opportunity to repopulate the plague-ravaged region of Kišakur, most jumped at the offer, sailing across the Sea of Follies to make it a new Ilatani homeland. For most peoples, this would be a difficult affair, since the local Bahari saw them as foreigners worshipping a false religion, but the Ilatani have long believed in a syncretism of the Castanorian Pantheon and the Sun Cult. At first the Bahari were skeptical of Ilatani rule, but slowly the Ilatani convinced them of the truth of the Lightfather, the union of Castellos and Surael. With more and more converting to this new syncretism, hostile relations between the Ilatani and Bahari gradually disappeared, newfound cooperation taking its place."
 cult_of_uelos_desc:0 "Followers of the Primordial Uelos, brother of Halanna, lord of the waters. Though most Regent Courtiers do not worship Uelos, believing him either dead or inactive from grief after losing his sister, the Uelairey continue his worship, and his cult has spread to many ports throughout Cannor and beyond."

 # Fey (EU4: the Fey Court religion)
 fey_religion_desc:0 "Fey Reverence is not a religion in the classical sense, as those who practice it do not consider the Fey divine or objects of worship. Rather, it is a collection of stories, traditions, rituals, and rites employed to avoid angering the Fey, and, ideally, coexist with them."

 # Gerudian
 skaldhyrric_religion_desc:0 "Founded during the Dragonwake, the Skaldhyrric Faith is the dominant religion of Gerudia. They believe that reciting magical tales keeps Elkaesal the White, the dragon that plunged Gerudia into eternal winter, sleeping and at bay."
 skaldhyrric_faith_desc:0 "Founded during the Dragonwake, the Skaldhyrric Faith is the dominant religion of Gerudia. They believe that reciting magical tales keeps Elkaesal the White, the dragon that plunged Gerudia into eternal winter, sleeping and at bay."

 # The Hunt (harpies)
 harpy_hunts_religion_desc:0 "The Hunt is the name for the traditional religious beliefs of the Bulwari harpies. An animistic faith with elements of ancestor worship, the Hunt's teachings are passed down to the new generations via songs, whose themes traditionally include the histories of ancient matriarchs and the actions or characteristics of certain birds, among other subjects. The songs work in a similar fashion to fables, since their function is to lead to a particular moral or practical lesson about how to be a hunter, an ideal shared by most Harpy societies.\n\nHarpies see the act of hunting as the pursuit of one's objective, which could be something physical like mates or riches, or more philosophical, like knowledge.\n\nWhile the Hunt doesn't have any form of clergy, each flock has a Songster, whose duty is to remember the songs, sing in festivities and pass down their knowledge to the next generation. It's very common for a song to vary from one flock to another."

 # The Thought (gnomes)
 the_thought_religion_desc:0 "The Thought is the name given to the traditional gnomish philosophy, which emphasizes sentience and intelligence as the most vital qualities a being can possess. Followers of this philosophy are uninterested in spirituality, instead focusing on creating and refining a "Theory of Everything" that explains exactly how reality works."
 the_thought_desc:0 "The Thought is the name given to the traditional gnomish philosophy, which emphasizes sentience and intelligence as the most vital qualities a being can possess. Followers of this philosophy are uninterested in spirituality, instead focusing on creating and refining a "Theory of Everything" that explains exactly how reality works. Members are driven to observe and analyse the material world, in the hopes of being able to incorporate their discoveries into the doctrine in an act known as "Being touched by The Thought".\n\nThis drive towards material analysis and innovation leaves followers of the Thought well-suited to the pursuit of scientific advancement and the development of artifice; gnomish believers in the Thought were the first to combine magic and science into the art now known as artificery. Those who follow The Thought are usually very tolerant of other ways of thinking, as they both hold the product of other people's intelligence in high regard, and take advantage of the opportunity to research other cultures."

 # Xhazobkult (gnolls)
 xhazobkult_religion_desc:0 "The Xhazobkult venerate the Xhazobine, messianic figures believed to be possessed by a Xhazob, a primal demonic spirit that Kult folklore holds were the progenitors of their race. Previous Xhazobines have been responsible for continent-spanning invasions and their brutal achievements feature prominently in the oral traditions of many gnollish packs.\n\nStrict adherence to the Xhazobkult varies from region to region; for some packs it is a background piece of their folklore alongside animist beliefs and syncretic elements from neighbouring faiths. Others however take the Xhazobkult deadly seriously, with organised shamanic traditions, tithes of human sacrifice and active attempts to bring about the next Xhazobine to drown the world in blood."

 # Written for the overhaul where EU4 has no religion description (the Infernal cults adapt EU4's Archdevil texts)
 # Akasi
 father_amahash_desc:0 "Afkir Amahash, the Father of the Waters, is honoured by the Akasi who make their living on the Divenhal. Where Mother Akasik is the mountain, Amahash is the sea that breaks against it: generous and dangerous by turns, he carries Akasi ships to distant ports and swallows the careless. His priests keep a hidden lore of tides and stars, and charity to the poor and the shipwrecked is the surest way to earn his favour."
 mother_akhat_desc:0 "Imma Akhat, the Mother of Flame, is the fire of the Akasi hearth and of the Akasi forge. Her faithful hold the birth of a child to be the holiest of acts, and every child, born in wedlock or not, a full member of the family. Akhat gives as she receives: what is offered at her fires is returned in kind, and those who waver in their faith receive nothing. Her dead are given back to the flame."
 father_aiji_desc:0 "Afkir Aiji, the Father of the Winds, is worshipped by the herders of the high Akasik pastures. Aiji sees all from the sky and judges fairly, and his followers hold justice above every other virtue. They live apart in the mountain meadows, take lovers as freely as the wind changes, and leave their dead on the peaks so that Aiji's birds may carry them into the sky."

 # Alenic
 alenic_religion_desc:0 "The Alenic faiths are the old beliefs of the Alenic peoples of northern Cannor, held long before the Regent Court came north. They honour Ariadas, the Lord of Storms, at the head of a host of gods of the hunt, the hearth and the night, and fear the World Serpent that coils beneath the world. Though many Alenics have since knelt to Castellos, the old gods are still remembered in the hills and moors."
 ansuwir_desc:0 "Ansuwir is the old faith of the Alenic tribes as they kept it before the Gawedi turned to the Regent Court. Every warrior chooses a patron among the gods, Ariadas of the storms above all, devotes himself to them, and seeks their favour on the battlefield. Hostright, the sacred bond between host and guest, holds the clans together: whoever shares a man's meat and mead is under his protection."
 moors_cult_desc:0 "The Moormen keep their own gods, raised in the mists of the moors. Ruladag, the Crimson One, leads them; Tarindul shaped the land; Uumara rules the waters and Heirkoma the night. The faithful gather at the standing stones of their ancestors, their wise-folk practise witchcraft openly, and hostright binds every clan of the moors into one people."

 # Businori and Milcori
 businori_religion_desc:0 "The Businori faiths are the old beliefs of the human peoples of Businor, in the far south of Cannor. At their heart is Selkar-Nera, the Judge of the Dead, who weighs every soul at the end of its life. Rather than abandon their gods to conquerors, the Businori have found places for them in the Regent Court, and honour the Castanorian gods in turn."
 businori_cult_desc:0 "The Selkaran Primacy holds Selkar-Nera, the Judge of the Dead, first among all gods. Its faithful raise standing stones and tomb-mounds as their ancestors did, and are bound to one another as a single people under the Judge's gaze. They see in the Regent Court's Nerat a reflection of their own god, and are content to share their worship, so long as Selkar-Nera keeps his place at the head of it."
 milcori_religion_desc:0 "When the Milcori first moved north from Busilar into the forests, fogs and riverlands of the Borders, they were ruled by petty kings who wielded necromantic magics and were advised by the priests of their death god. Then came Morgurax, a lowly priest of Nerat who unbound himself from his mortal chains, concealed his soul within a phylactery and became the First Lich. He united the Milcori into the Kingdom of Milcorissia and ruled for centuries as an avatar of his god, duty and service made manifest."
 milcori_cult_desc:0 "The Cult of the Enduring Ones teaches that death is a beginning, not an end. Why should the dead lie idle, when a skilled necromancer can give them a new purpose serving their descendants? Greatest of the Enduring Ones are the Lich-Kings, who, like Morgurax before them, have cast off death altogether. The cult's priests are judges as well as necromancers, and the blood of sacrifice feeds their rites."

 # Cannorian Pantheon
 cult_of_falah_desc:0 "The Cult of Falah focuses on Falah, the Huntress, Cannorian goddess of the hunt and the wilds. Strongest among the Alenics and Reachmen of the northern forests and moors, it holds that the wilds are Falah's own domain, to be hunted with respect and never despoiled. Every hunt is a rite in her honour, and her shrines at Elkwood and Eyegard are among the holiest places of the north."
 vernid_adean_desc:0 "The Emulant Cults of the Vernids hold that Adean, the Divine Heir, is best worshipped not with prayer but with deeds. Every faithful is expected to emulate the god in life: to take up arms, set out on adventure and right the wrongs of the world, as Adean did before he took his place in the Regent Court. Those who would prove themselves undertake the trials of Trialmount, and the greatest of the Emulants are remembered as heroes worthy of emulation in turn."
 luna_damish_desc:0 "Along the Luna River, the cult of the Dame is bound up with the worship of her son Adean, the knight of the gods. The Dame's priests teach that the moon watches over the river and its people, and Adean defends them; together they ask the faithful to share what they have, to make pilgrimage to their holy places, and to gather under the full moon for the festivals that are the river's pride."
 adenican_adean_desc:0 "Adenica is the heartland of Adean's worship and, its people say, the birthplace of knighthood itself. Here the god of chivalry is served by the Spear-King, Adean's anointed, and by knights who swear to live as Adean lived: honest, abstemious and unafraid. The Cult of Adean preaches restraint in all things but courage, and holds that the Adenicans, above all other peoples, are bound to Adean's cause."
 northern_temple_desc:0 "The Northern Temple is the Regent Court as the Gawedi keep it. Castellos rules, Esmaryal guards the hearth and Falah the hunt, and the temple's austere priests own nothing but the robes they wear. The Gawedi believe the gods favour the strong, and see no contradiction between a priesthood sworn to poverty and a people sworn to power."
 border_cults_desc:0 "A mixture of old Milcori customs and the faith of Castanor, the Border Cults are the Regent Court as it is kept in the haunted lands of the Borders. Nerat, the Judge of the Dead, is first among the gods here, flanked by Castellos and Falah, for in a land of tombs and restless dead it is the god of death who keeps order. Monastic orders keep watch over the old necropoleis, and the rulings of the Arbiter carry the weight of law."
 reverian_cult_desc:0 "The Reverians descend from Gerudian reavers who settled the shores of Cannor, and their faith shows it. They have taken Castellos as their king of gods, yet they honour him in the Gerudian way: with tales recited by skalds, with ships blessed before every voyage, and with war. Skaldol in distant Gerudia remains as holy to them as the Pantheonway."
 tefori_damish_desc:0 "On the Isle of Tef and the shores of the Divenhal around it, the Dame is worshipped alongside Ara, goddess of fortune and trade, as the twin mistresses of the tides: the moon that pulls the sea, and the luck that brings a ship home. The Cult of the Tides is a merchant's faith; its priestesses bless cargoes and voyages, and wealth honestly won is a sign of Ara's favour. Under the full moon the faithful gather to feast and to read their fortunes in the stars."

 # Dragon Cult
 kobold_nature_cult_desc:0 "The greenscale kobolds revere the dragons as fiercely as any of their kin, but believe the greatest of the dragons' gifts is not gold but the living world itself. Where the Kobold Dragon Cult gathers treasure for Malliath's awakening, the Gift of the Dragons tends forest and field as the dragons' own hoard, and holds that to despoil them is to rob the Father of Dragons. Like all kobolds, they remember Tayekan, the blue dragon who led their ancestors out into the world."

 # Fey
 fey_cult_desc:0 "Where Fey Reverence seeks only to avoid the Fey's notice, the Fey Cult courts it. Its followers worship the Archfey as gods in all but name, chief among them the Emerald Lady, and leave offerings at the forest's edge in exchange for her boons. They shun idols and the trappings of cities, for the Fey prize the untouched wild above all, and they honour their bargains even when the price comes due."

 # Gerudian
 old_gerudian_faith_desc:0 "The Old Gerudian faith is what remains of the beliefs Gerudians held before the skalds' songs became their religion. Its followers honour Jhorgar and the spirits of their forefathers with blood and fire: feasts that end in sacrifice, and raids that end in glory. It survives among a few Dalric clans, who hold that the skalds have forgotten what the old gods demanded."

 # Tyvorkan
 tyvorkan_religion_desc:0 "The Tyvorkan faiths are the old beliefs of the Taric and their kin, the hardy peoples of the Giants' Tears. No one survives the northern winters alone, and their faith binds the living to one another, to their ancestors, and to the land that feeds them."
 taric_faith_desc:0 "The Táric Faith honours Vahio and the spirits of the land. The forests and lakes of the Giants' Tears are sacred, and may be taken from only what the clan needs to live; the ancestors watch over every family, and are fed and remembered in return. Above all, the faith teaches that a Taric belongs to their people, and that the people endure only together."

 # Halessi
 halessi_religion_desc:0 "The Halessi faiths are the spiritual and philosophical traditions of Haless, centred on chi, the flowing essence of all things. The Accretive Path seeks to perfect the self through discipline and asceticism until it transcends the cycle of reincarnation; the Transmutative Path seeks harmony with the endless river of chi until it is reborn, immortal, as its ideal self. Those who break the Paths' prohibitions in pursuit of forbidden power walk the Devouring Path."

 # The Hunt (harpies)
 hunt_of_the_crane_desc:0 "The flocks of the Hunt of the Crane take the crane as their teacher: patient, watchful and wise. Their songs tell of matriarchs who read the future in the turning of the stars, and from their Bulwari neighbours they have taken Surael into their songs as the light that guides every hunt."
 hunt_of_the_eagle_desc:0 "The Hunt of the Eagle sings of the eagle that strikes from above and takes what it wants. Its flocks are the most warlike of the harpies, and their Songsters teach that power, like prey, belongs to whoever is strong enough to seize it. A matriarch who does not hunt for more is no matriarch at all."
 hunt_of_the_myna_desc:0 "The myna can mimic any song it hears, and the Hunt of the Myna prizes the same gift. Its flocks welcome strangers to their eyries, learn their ways and their words, and take whatever is useful into their own songs. To them a guest is a lesson, and hospitality the first step of any hunt."

 # Xhazobkult
 bulwari_xhazobkult_desc:0 "In the deserts and fields of Bulwar, the gnollish packs of the Eastern Xhazobkult keep the faith at its bloodiest. They believe the next Xhazobine will rise from whichever pack proves the strongest, and so they hunt, raid and devour, offering human captives to the Xhazob in the hope that one of them will be chosen."

 # Infernal Court (EU4: the Archdevils' deity descriptions)
 cult_of_hedine_desc:0 "The Cult of Hedine worships Hedine, the Mistress of Lust. Formerly the goddess of joy, she was blamed for encouraging Agrados' lust for Halanna. Hedine was feared as the most convincing of the Agradosian Host, for though she lacked the rhetorical skills of Ildran, she always knew exactly how to tempt someone one-on-one; her cultists carry her into every act of debauchery, lust and excess."
 cult_of_forsara_desc:0 "The Cult of Forsara worships Forsara, the Countess of Greed. Formerly the goddess of luck and charity, she remained loyal to Castellos during the Godswar before being banished to the Lower Planes for her part in a conspiracy, alongside Ibberal and Canturian, to poison him and usurp his place as ruler of the gods. Her devils are perhaps responsible for the stereotype of the devil who makes outwardly fair, but secretly treacherous, deals."
 cult_of_ildran_desc:0 "The Cult of Ildran worships Ildran, the Marquis of Pride. Formerly the god of construction and great works, he became Agrados' main lieutenant and ideologue during the Godswar, preaching a vision of a world forever seeking perfection, built by the ambitious hands of humanity. He still sends visions of glorious monuments to those who follow him, all while dreaming of his promised new world inhabited only by his favoured humans."
 cult_of_kazraiel_desc:0 "The Cult of Kazraiel worships Kazraiel, the Wroth Prince. He was born when Castellos tried to absorb the divine energy of his brother Agrados and was corrupted instead; Castellos cast the corrupted portion of himself, with all he had taken from Agrados, to the Lower Planes, where it woke as the Archdevil Kazraiel. The most aggressive of the Archdevils, he rages and craves conflict, yet understands war as no other does, and considers himself the rightful master of both his fathers' peoples, the Alenics and the Escanni."
 cult_of_canturian_desc:0 "The Cult of Canturian worships Canturian, the Baron of Envy. Formerly the god of music and theatre, he was cast to the Lower Planes for taking part in Ibberal's conspiracy to poison Castellos at a victory feast. The most active member of the Triad, he claims to have made possible the first Cannorian vampires, and grants his followers boons at the expense of those they envy."
 cult_of_ibberal_desc:0 "The Cult of Ibberal worships Ibberal, the Grand Duke of Gluttony. Formerly a minor god of celebrations among Castellos' victors, he conspired to poison Castellos and the other great gods, blame it on Agrados' last loyalists, and rule in their place with Canturian and Forsara. The plot failed and the three were banished to the Lower Planes, where they remain close allies as the Triad."
 cult_of_mesner_desc:0 "The Cult of Mesner worships Mesner, the Lord of Sloth. Formerly the god of travel and communication, he was cast to the Lower Planes for failing to act for either side in the Godswar, and remains the most bitter of the Archdevils. Still the Archdevil most able to speak to the Material Plane, he whispers apathy, sorrow and the pointlessness of their deeds to those he targets, sapping their wills."
