 aov_invention_naval_mageshields: "Naval Mageshields"
 aov_invention_naval_mageshields_desc: "A coating, imbued with abjuration magic, allows a magical shield to be projected along any ship, from bow to stern."
 aov_invention_naval_mageshields_tt: "#T $aov_invention_naval_mageshields$#!\n#weak $AOV_CATEGORY_MILITARY$, $AOV_TIER_3$#!\n\n$aov_invention_naval_mageshields_desc$"
 aov_invention_naval_mageshields_subtitle: "$AOV_CATEGORY_MILITARY$, $AOV_TIER_3$"
 aov_invention_personal_mageshields: "Personal Mageshields"
 aov_invention_personal_mageshields_desc: "We can now stably project mageshields to protect the individual, allowing our war artificers to shrug off the standard projectiles and deadly blows."
 aov_invention_personal_mageshields_tt: "#T $aov_invention_personal_mageshields$#!\n#weak $AOV_CATEGORY_MILITARY$, $AOV_TIER_3$#!\n\n$aov_invention_personal_mageshields_desc$"
 aov_invention_personal_mageshields_subtitle: "$AOV_CATEGORY_MILITARY$, $AOV_TIER_3$"
 aov_invention_apparitional_communicator: "Apparitional Communicator"
 aov_invention_apparitional_communicator_desc: "By sponsoring a variant of the T-wave transmitter which transmits images as well as sound we can improve our standing in the eyes of the world."
 aov_invention_apparitional_communicator_tt: "#T $aov_invention_apparitional_communicator$#!\n#weak $AOV_CATEGORY_SOCIETY$, $AOV_TIER_1$#!\n\n$aov_invention_apparitional_communicator_desc$"
 aov_invention_apparitional_communicator_subtitle: "$AOV_CATEGORY_SOCIETY$, $AOV_TIER_1$"
 aov_invention_centipedal_chests: "Centipedal Chests"
 aov_invention_centipedal_chests_desc: "Living chests which are able to move around and carry goods, scuttling around on a 100 little legs, and fiercely loyal to their owners."
 aov_invention_centipedal_chests_tt: "#T $aov_invention_centipedal_chests$#!\n#weak $AOV_CATEGORY_SOCIETY$, $AOV_TIER_1$#!\n\n$aov_invention_centipedal_chests_desc$"
 aov_invention_centipedal_chests_subtitle: "$AOV_CATEGORY_SOCIETY$, $AOV_TIER_1$"
 aov_invention_conversation_calibrator: "Conversation Calibrator"
 aov_invention_conversation_calibrator_desc: "Devices using the power of illusion magic to create the appearance of speech that may be more comprehensible for non-gnomish understanding."
 aov_invention_conversation_calibrator_tt: "#T $aov_invention_conversation_calibrator$#!\n#weak $AOV_CATEGORY_SOCIETY$, $AOV_TIER_1$#!\n\n$aov_invention_conversation_calibrator_desc$"
 aov_invention_conversation_calibrator_subtitle: "$AOV_CATEGORY_SOCIETY$, $AOV_TIER_1$"
 aov_invention_fey_spray: "Fey Spray"
 aov_invention_fey_spray_desc: "The ability to keep the Fey away without harming them is very popular with those who have grown tired of their mischief, and the spray does not cause undue offense to these mystical beings."
 aov_invention_fey_spray_tt: "#T $aov_invention_fey_spray$#!\n#weak $AOV_CATEGORY_SOCIETY$, $AOV_TIER_1$#!\n\n$aov_invention_fey_spray_desc$"
 aov_invention_fey_spray_subtitle: "$AOV_CATEGORY_SOCIETY$, $AOV_TIER_1$"
 aov_invention_living_mirrors: "Living Mirrors"
 aov_invention_living_mirrors_desc: "Exerting influence on the Living Mirror business will allow us to easily broadcast propaganda, as well as better distracting potential malcontents."
 aov_invention_living_mirrors_tt: "#T $aov_invention_living_mirrors$#!\n#weak $AOV_CATEGORY_SOCIETY$, $AOV_TIER_1$#!\n\n$aov_invention_living_mirrors_desc$"
 aov_invention_living_mirrors_subtitle: "$AOV_CATEGORY_SOCIETY$, $AOV_TIER_1$"
 aov_invention_mystic_ciphers: "Mystic Ciphers"
 aov_invention_mystic_ciphers_desc: "Brand new magical cyphers allow us to bring our secrecy to whole new levels, making it harder than ever to identify our foreign spies or discover state secrets."
 aov_invention_mystic_ciphers_tt: "#T $aov_invention_mystic_ciphers$#!\n#weak $AOV_CATEGORY_SOCIETY$, $AOV_TIER_1$#!\n\n$aov_invention_mystic_ciphers_desc$"
 aov_invention_mystic_ciphers_subtitle: "$AOV_CATEGORY_SOCIETY$, $AOV_TIER_1$"
 aov_invention_sending_stones: "Sending Stones"
 aov_invention_sending_stones_desc: "Magical stones, created through artifice, facilitate the transmission of communications across long distances at instant speed."
 aov_invention_sending_stones_tt: "#T $aov_invention_sending_stones$#!\n#weak $AOV_CATEGORY_SOCIETY$, $AOV_TIER_1$#!\n\n$aov_invention_sending_stones_desc$"
 aov_invention_sending_stones_subtitle: "$AOV_CATEGORY_SOCIETY$, $AOV_TIER_1$"
 aov_invention_viewcatcher: "Viewcatcher"
 aov_invention_viewcatcher_desc: "A handheld machine, able to capture images for printing in a single instant, to be preserved forever."
 aov_invention_viewcatcher_tt: "#T $aov_invention_viewcatcher$#!\n#weak $AOV_CATEGORY_SOCIETY$, $AOV_TIER_1$#!\n\n$aov_invention_viewcatcher_desc$"
 aov_invention_viewcatcher_subtitle: "$AOV_CATEGORY_SOCIETY$, $AOV_TIER_1$"
 aov_invention_arithmatons: "Arithmatons"
 aov_invention_arithmatons_desc: "The Arithmatons can perform arithmetic far faster and far more accurately than most men, making many fields with heavy mathematics remarkably simpler."
 aov_invention_arithmatons_tt: "#T $aov_invention_arithmatons$#!\n#weak $AOV_CATEGORY_SOCIETY$, $AOV_TIER_2$#!\n\n$aov_invention_arithmatons_desc$"
 aov_invention_arithmatons_subtitle: "$AOV_CATEGORY_SOCIETY$, $AOV_TIER_2$"
 aov_invention_empire_engine: "Empire Engine"
 aov_invention_empire_engine_desc: "An engine which uses Wish magic from Bulwar, Runewriting from dwarves and giants, and Fey relics from Eordand and the Deepwoods to metaphysically imbue your nation with the concept of 'Power.' Its inventors are pretty sure it works: and even if it doesn't, enough people think it does for it to work in practice anyways."
 aov_invention_empire_engine_tt: "#T $aov_invention_empire_engine$#!\n#weak $AOV_CATEGORY_SOCIETY$, $AOV_TIER_2$#!\n\n$aov_invention_empire_engine_desc$"
 aov_invention_empire_engine_subtitle: "$AOV_CATEGORY_SOCIETY$, $AOV_TIER_2$"
 aov_invention_game_of_khet: "Game of the Khet"
 aov_invention_game_of_khet_desc: "An ancient game played by the Khet, using stone tablets imbued with the images of fearsome monsters. Now, through artifice, it can be distributed in the form of cards among our people, allowing the powerful and common alike to settle their disputes through a far less violent, and far more entertaining, form of duelling."
 aov_invention_game_of_khet_tt: "#T $aov_invention_game_of_khet$#!\n#weak $AOV_CATEGORY_SOCIETY$, $AOV_TIER_2$#!\n\n$aov_invention_game_of_khet_desc$"
 aov_invention_game_of_khet_subtitle: "$AOV_CATEGORY_SOCIETY$, $AOV_TIER_2$"
 aov_invention_mirage_detector_3000: "Miracle Detector 3000"
 aov_invention_mirage_detector_3000_desc: "A completely objective, fact-based device which calculates levels of 'Divinity,' 'Power,' and 'Morality' for each religion in the world, and calculates a sum of these three as 'God-Points.' It just so happens that the religion with the highest number of 'God-Points'... is ours! Isn't it great that we're correct about the world?"
 aov_invention_mirage_detector_3000_tt: "#T $aov_invention_mirage_detector_3000$#!\n#weak $AOV_CATEGORY_SOCIETY$, $AOV_TIER_2$#!\n\n$aov_invention_mirage_detector_3000_desc$"
 aov_invention_mirage_detector_3000_subtitle: "$AOV_CATEGORY_SOCIETY$, $AOV_TIER_2$"
 aov_invention_remedial_tinctures: "Remedial Tinctures"
 aov_invention_remedial_tinctures_desc: "These kits contain unique potions, self-tightening tourniquets, and all required to get a soldier off of Nerat's doorstep and back to the battlefield in scarce hours."
 aov_invention_remedial_tinctures_tt: "#T $aov_invention_remedial_tinctures$#!\n#weak $AOV_CATEGORY_SOCIETY$, $AOV_TIER_2$#!\n\n$aov_invention_remedial_tinctures_desc$"
 aov_invention_remedial_tinctures_subtitle: "$AOV_CATEGORY_SOCIETY$, $AOV_TIER_2$"
 aov_invention_think_thought_transmitters: "The Think-Thought Transmitters"
 aov_invention_think_thought_transmitters_desc: "A machine which attaches to the mind, body, and soul, and beams thoughts directly to other people. These thoughts expand past the boundary of mere 'words': with the Thinking Transmitters, everything from memories, to emotions, to patterns of thinking can be expressed without language!"
 aov_invention_think_thought_transmitters_tt: "#T $aov_invention_think_thought_transmitters$#!\n#weak $AOV_CATEGORY_SOCIETY$, $AOV_TIER_2$#!\n\n$aov_invention_think_thought_transmitters_desc$"
 aov_invention_think_thought_transmitters_subtitle: "$AOV_CATEGORY_SOCIETY$, $AOV_TIER_2$"
 aov_invention_bureaucratizer: "The Bureaucratizer"
 aov_invention_bureaucratizer_desc: "A machine which feeds performance reviews, test scores, and job reports to a temporarily mind-wiped bureaucrat. Without any loyalties or context to pull from, the bureaucrat can only use the information given to them when determining who shall be appointed to various administrative posts across our nation."
 aov_invention_bureaucratizer_tt: "#T $aov_invention_bureaucratizer$#!\n#weak $AOV_CATEGORY_SOCIETY$, $AOV_TIER_3$#!\n\n$aov_invention_bureaucratizer_desc$"
 aov_invention_bureaucratizer_subtitle: "$AOV_CATEGORY_SOCIETY$, $AOV_TIER_3$"
 aov_invention_crierless_crier_device: "Crierless Crier Device"
 aov_invention_crierless_crier_device_desc: "Large, portable machines capable of artificially recording and reproducing sounds, to be broadcast in public spaces."
 aov_invention_crierless_crier_device_tt: "#T $aov_invention_crierless_crier_device$#!\n#weak $AOV_CATEGORY_SOCIETY$, $AOV_TIER_3$#!\n\n$aov_invention_crierless_crier_device_desc$"
 aov_invention_crierless_crier_device_subtitle: "$AOV_CATEGORY_SOCIETY$, $AOV_TIER_3$"
 aov_invention_negotiation_nexus: "Negotiation Nexus"
 aov_invention_negotiation_nexus_desc: "A machine which reads the minds and behaviors of all parties in a negotiation, tabulates what each person wants, and then gives our negotiating parties access to the analyzed data. Aids in all types of negotiations and peace-deals."
 aov_invention_negotiation_nexus_tt: "#T $aov_invention_negotiation_nexus$#!\n#weak $AOV_CATEGORY_SOCIETY$, $AOV_TIER_3$#!\n\n$aov_invention_negotiation_nexus_desc$"
 aov_invention_negotiation_nexus_subtitle: "$AOV_CATEGORY_SOCIETY$, $AOV_TIER_3$"
 aov_invention_runethought_network: "The Runethought Network"
 aov_invention_runethought_network_desc: "A network of runic towers, each engraved with aspects of our language and culture, which are set up across our nation. When activated through Halessi spirit-magics, these towers imbue their runes into the minds of our citizens. Each of them learns our language, our values, and our ideals, whether or not they want to."
 aov_invention_runethought_network_tt: "#T $aov_invention_runethought_network$#!\n#weak $AOV_CATEGORY_SOCIETY$, $AOV_TIER_3$#!\n\n$aov_invention_runethought_network_desc$"
 aov_invention_runethought_network_subtitle: "$AOV_CATEGORY_SOCIETY$, $AOV_TIER_3$"
