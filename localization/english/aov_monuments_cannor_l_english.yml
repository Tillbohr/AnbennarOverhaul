 building_aov_monument_bladeskeep_monument_02: "Bladeskeep (II)"
 building_aov_monument_bladeskeep_monument_02_desc: "Sitting atop of Dragonsbane hill, the mighty Bladeskeep is a symbol of the glory days of Old Escann. It served as the training ground for some of Cannor's greatest warriors, who swore loyalty to Calindal, the Gleaming Blade and were entrusted to protect her, those amongst the warriors of the Keep who showed a great deal of martial proves would become worthy of wielding the sword, becoming thus the Stewards of the Blade. The Bladeskeep was founded by Elecast Dragonsbane, who was hailed as Blade King in 499 for his slaying of Alos the Copper. The Bladeskeep saw many periods of decadence and prosperity along the years, training generations of soldiers and generals that served throughout Escann and beyond. It was not until recently that the Keep saw an event that shook it to its core: Calindal, the Gleaming Blade destroyed during the Greentide, a traumatic event for this ancient institution. Bladeskeep however remains as a shining beacon of the Escann that once was and can still be. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
