 building_aov_monument_damish_temple_temple_of_the_highest_moon_03_desc: "The Temple of the Highest Moon is the largest temple in cannor dedicated to the goddess of tolerance, harvests, and magic: the Dame. Due to its location, it is also the highest temple in Cannor, due to its location near the summit of the Moonmount. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
 building_aov_monument_deranne_westport_gateway_to_aelantir_01: "Westport, Gateway to Aelantir"
 building_aov_monument_deranne_westport_gateway_to_aelantir_01_desc: "Deranne has many ports along its coastline for merchants, adventurers, and explorers alike, but none more prominent or influential than Westport. Many Derranians hope to use the resources and location of Westport to fuel explorations of the ruins of Aelantir, for riches and glory alike. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
