 building_aov_monument_deshak_temple_of_the_elements_01: "Temple of the Elements"
 building_aov_monument_deshak_temple_of_the_elements_01_desc: "Established by an unknown ancient civilization long before Deshak was founded, the Temple of the Elements is claimed to have been built on the site where the Planetouched first came to existence. It continues to stand as one of the most prominent houses of worship in Akan."
