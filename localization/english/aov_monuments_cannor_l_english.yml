 building_aov_monument_temple_of_ryala_01: "Temple of Ryala"
 building_aov_monument_temple_of_ryala_01_desc: "Ryala is Castellos' virginal daughter, and the goddess of true love, beauty, courtship, and chastity. Her temple worships her and honors her tenets."
