 building_aov_monument_elikhander_orbs_01: "Obelisks of Power"
 building_aov_monument_elikhander_orbs_01_desc: "The Elikhander kings of old raised these obelisks to gather and hold the power of the land. Their carved runes still glow faintly at dusk, and scholars and priests alike make the journey to read them."
