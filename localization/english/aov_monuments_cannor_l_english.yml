 building_aov_monument_bal_hyl_03_desc: "During the Dragonwake, three Alenic Tribes fled pell-mell into the eastern Dameshead. With Gawedi behind, and Damerians ahead, they turned to fight before the noose closed completely. In a desperate gambit, they put Bal Hyl at their backs and armed every man, woman and child. The Battle of the Hyl was so grave that their backline was crushed against the castle walls. Afterwards, the castellan of Bal Hyl offered vassalage but refused the tribesmen sanctuary. Surprisingly, the Wex played along: scouts had found entrance into tunnels beneath Bal Hyl. As talks stalled above, warriors delved deeper below. When Damenath fell, Wexonard braves boiled through the catacombs and slaughtered the demoralized garrison. In victory, the Wex chieftain cast the Damerian flag onto the pyre of his enemies, naming his conquest Wexkeep. Now, the House sil Wex rules Wexkeep with an iron fist. The same labyrinth that doomed the Damerians houses both supplies and spies, the full extent thereof known only to the sil Wex line. The descendants of those bloodsoaked braves still man the walls. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
 building_aov_monument_bal_mire_02: "Bal Mire (II)"
 building_aov_monument_bal_mire_02_desc: "Bal Mire was built in 457 BA, in the marshlands of western Escann, to watch over the unruly Alenic tribes to the west, long a thorn in Castanor's side. Acting as a bridge over the Alen River as well as a fortress, Bal Mire is the youngest and smallest of Balgar's Wonders. Some joke that all of Balgar's spirit had been spent on his other works, but the truth regarding Bal Mire's diminutive size lies in the uneasy ground it rests upon. Raising a fortress in such a dreadful location had been deemed impossible, and that Balgar did so without affecting the Citadel's ability to serve as an impenetrable gateway was nothing short of a miracle - one that secured Castanor's dominion over the whole of the Middle Alen. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
 building_aov_monument_bal_mire_03: "Bal Mire (III)"
 building_aov_monument_bal_mire_03_desc: "Bal Mire was built in 457 BA, in the marshlands of western Escann, to watch over the unruly Alenic tribes to the west, long a thorn in Castanor's side. Acting as a bridge over the Alen River as well as a fortress, Bal Mire is the youngest and smallest of Balgar's Wonders. Some joke that all of Balgar's spirit had been spent on his other works, but the truth regarding Bal Mire's diminutive size lies in the uneasy ground it rests upon. Raising a fortress in such a dreadful location had been deemed impossible, and that Balgar did so without affecting the Citadel's ability to serve as an impenetrable gateway was nothing short of a miracle - one that secured Castanor's dominion over the whole of the Middle Alen. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
 building_aov_monument_bal_ouord_02: "Bal Ouord (II)"
 building_aov_monument_bal_ouord_02_desc: "Built atop the same Burning Hills where the Castanites once battled the terrible First Gnoll Xhazobine, Bal Ouord's lone, gigantic central tower reaches far into the sky, serving as both the Citadel's main keep and lighthouse. Balgar the Builder, not content with merely building an unbreakable fortress, saw fit to carve for Bal Ouord a harbor surpassed only by that of nearby Ovdal Tûngr. Tunnels and hallways lead deep into the earth, converging upon a tremendous cavern against which the wind batters and the waves break. Bal Ouord's bowels may have never been host to wealthy merchant fleets, but at the height of the Empire of Castanor, they hosted an armada that saw even the prideful Damerian Republic flinch. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
 building_aov_monument_bal_ouord_03: "Bal Ouord (III)"
 building_aov_monument_bal_ouord_03_desc: "Built atop the same Burning Hills where the Castanites once battled the terrible First Gnoll Xhazobine, Bal Ouord's lone, gigantic central tower reaches far into the sky, serving as both the Citadel's main keep and lighthouse. Balgar the Builder, not content with merely building an unbreakable fortress, saw fit to carve for Bal Ouord a harbor surpassed only by that of nearby Ovdal Tûngr. Tunnels and hallways lead deep into the earth, converging upon a tremendous cavern against which the wind batters and the waves break. Bal Ouord's bowels may have never been host to wealthy merchant fleets, but at the height of the Empire of Castanor, they hosted an armada that saw even the prideful Damerian Republic flinch. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
 building_aov_monument_bal_vertesk_02: "Bal Vertesk (II)"
 building_aov_monument_bal_vertesk_02_desc: "Over the Free City of Vertesk looms the Black Tower, a spire of sinister black brick. Originally, it was built by Balgar from the same pale stone as the famed White Walls. However, during his reign as master of the Vertesk Dominion, Venac the Arrogant corrupted the tower to its very foundations, turning its stones as black as night. This tower has survived three empires and two millennia, a near-immortal symbol of fear and power. Countless lords of countless different peoples and petty kingdoms have all ruled from the same high solar, sent out the same agents with the same grim purpose: to vanish foolish dissenters behind the black spire's yawning gates, their names never to be uttered aloud again. As kings molder to dust and empires collapse like straw, the Black Tower stands as an uncaring testament set to outlive all, including the upstart Empire of Anbennar. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
 building_aov_monument_bal_vertesk_03: "Bal Vertesk (III)"
 building_aov_monument_bal_vertesk_03_desc: "Over the Free City of Vertesk looms the Black Tower, a spire of sinister black brick. Originally, it was built by Balgar from the same pale stone as the famed White Walls. However, during his reign as master of the Vertesk Dominion, Venac the Arrogant corrupted the tower to its very foundations, turning its stones as black as night. This tower has survived three empires and two millennia, a near-immortal symbol of fear and power. Countless lords of countless different peoples and petty kingdoms have all ruled from the same high solar, sent out the same agents with the same grim purpose: to vanish foolish dissenters behind the black spire's yawning gates, their names never to be uttered aloud again. As kings molder to dust and empires collapse like straw, the Black Tower stands as an uncaring testament set to outlive all, including the upstart Empire of Anbennar. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
 building_aov_monument_bal_vroren_02: "Bal Vroren (II)"
 building_aov_monument_bal_vroren_02_desc: "One of Balgar's Wonders, the Citadel of Bal Vroren was built in 546 BA by the Empire of Castanor to defend against the Giants and their subjects to its north. Nestled in a natural harbor along the Giant's Grave Sea, Bal Vroren would come to serve as host to the fearsome Giantsbane Legion and as an important naval center and staging ground from which Castanor influenced the whole of Gerudia. During the events of the Dragonwake of 470 AA, centuries after its founding, tens of thousands of refugees would seek shelter in Bal Vroren's mighty walls. But when the dragon Elkaesal the White came to the Citadel's gates, all of them would be frozen to death overnight. Ever since that harrowing event, Bal Vroren has attracted rumors of curses and hauntings and has been left abandoned, with its ruined walls, towers, and keeps serving as grim reminder of the terror that once afflicted Cannor. Seeing Bal Vroren refurbished and fully manned would require significant effort, and it is so thoroughly scarred and marred by would-be conquerors and invaders that most now believe it can never be fully restored. If even a measure of Bal Vroren's former glory were to be regained, however, it is certain that Cannor and Gerudia would again be divided by the towering, impenetrable heights of the Vrorenswall... Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
