 building_aov_monument_silvelar_silver_spires_01: "Silver Spires of the Silver Moon"
 building_aov_monument_silvelar_silver_spires_01_desc: "The Silver Moon is one of the Dame's greatest temples, with its spires sparkling in the sunlight to produce a most bewitching effect - an optical illusion that causes those who gaze upon it to mistake it for pure silver, warped and hammered into a lances that pierce the clouds themselves. Its existence is a testament to Silvelar's construction industry, which facilitated the development of the Silver Moon from a simple temple to a grand monument - an enterprise three centuries in the making, and one begun by an elf priest whose name remains lost to the ages. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
