 building_aov_monument_seinathil_institute_of_song_01: "Seinathíl Institute of Song"
 building_aov_monument_seinathil_institute_of_song_01_desc: "The Seinathil Institute of Song was formed by exiled creatives from the Konwell Institute, and is the institution of choice that any aspiring bard in Cannor aims to learn at."
