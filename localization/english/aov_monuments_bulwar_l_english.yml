 building_aov_monument_eka_idulnazzar_01: "Eka-Idulnazzar"
 building_aov_monument_eka_idulnazzar_01_desc: "The Eka-Idulnazzar - translated to 'Palace Whose Halls Shine with Wisdom' - was founded to break the hold of the insular magi clans over the treasure trove of Bulwari magic knowledge as well as to overcome the chasm between elven and human magi fostered by the Jexisian Statutes. The ultimate goal of the institution was thus to usher in a new age of cooperative innovation for Bulwari magic. It swiftly became the premier magical academy in all of Bulwar, counting not just elves and humans, but harpies, gnolls and goblins amongst its students. The academic interests of the magi-scholars assembled there were not limited to Bulwari magic and the genie wish magic which preceded it, however. Sun Elven spells, dwarven rune magic, harpy song magic and even goblin proto-artificery and gnollish shamanistic rites became subjects of study there. The Eka-Idulnazzar follows traditional Zanite architectural convention and is arranged around a vast central courtyard. Radiating outward from this central court is a veritable city within the city, comprising lecture halls, training rooms, libraries, dormitories and residences for the resident scholars. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
