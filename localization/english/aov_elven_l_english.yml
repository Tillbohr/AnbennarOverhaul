l_english:
 # Anbennar Overhaul: generated by tools/build_rie_elves.py from Realms in Exile and Anbennar.
 # Anbennar Overhaul: do not edit by hand; rerun the generator after an RiE, Anbennar or CK3 update.
 building_type_elven_settlement_01: "Elven Haven"
 building_type_elven_settlement_01_desc: "A haven of the elves, the long-lived exiles of fallen Aelantir, raised among gardens and old trees and kept by folk who measure their memories in centuries."
 building_elven_settlement_01: "Haven Glade"
 building_elven_settlement_01_desc: "A handful of elven families have made this glade their home. Their halls are few, but the flowers bloom out of season and the birds sing at every hour."
 building_elven_settlement_02: "Flowering Haven"
 building_elven_settlement_02_desc: "Elven dwellings now dot the land around the haven, linked by shaded paths. Travellers speak of lanterns hung in the branches and music in the evenings."
 building_elven_settlement_03: "Haven Hold"
 building_elven_settlement_03_desc: "The haven has grown into a hold of white stone and living wood, with estates, libraries and fountained courts for the elves who gather here."
 building_elven_settlement_04: "Renowned Haven Hold"
 building_elven_settlement_04_desc: "The name of this hold is known throughout the region. More elves arrive every year, drawn by its halls and the patience of its lords."
 building_elven_settlement_05: "High Haven Hold"
 building_elven_settlement_05_desc: "Tall towers and slender walls ring this great hold. Within lie works of peerless craft and lore carried across the sea from Aelantir."
 building_elven_settlement_06: "Haven City"
 building_elven_settlement_06_desc: "A city of the elves, its spires rising above the trees. Few places in Cannor shelter so many of the Fair Folk, and fewer still hold such learning."
 building_elven_settlement_07: "Shining Haven City"
 building_elven_settlement_07_desc: "Unrivalled in size and majesty, this haven is the pride of the elves in exile, an echo of the cities that stood in Aelantir before its ruin."
 building_type_elven_agriculture_01: "Elven Gardens"
 building_type_elven_agriculture_01_desc: "The elves tend the land rather than master it. Their gardens and orchards yield more than human fields while seeming hardly to be farmed at all."
 building_elven_agriculture_01: "Foraging Bands"
 building_elven_agriculture_01_desc: "Elven families range the countryside, gathering what the land gives freely. There is little here that a human farmer would call agriculture."
 building_elven_agriculture_02: "Homestead Gardens"
 building_elven_agriculture_02_desc: "Small gardens surround the elven homesteads, planted with herbs, fruit and grain in careful harmony."
 building_elven_agriculture_03: "Terraced Gardens"
 building_elven_agriculture_03_desc: "Gardens climb the slopes in green terraces, watered by channels the elves cut and keep with great care."
 building_elven_agriculture_04: "Silverleaf Orchards"
 building_elven_agriculture_04_desc: "Orchards of pale-barked trees bear fruit through the long seasons, tended by gardeners who planted them generations ago."
 building_elven_agriculture_05: "Grand Gardens"
 building_elven_agriculture_05_desc: "The gardens of the haven are a wonder of the region, as beautiful as they are bountiful."
 building_elven_agriculture_06: "Elven Vineyards"
 building_elven_agriculture_06_desc: "Vines planted by long-dead hands yield wines that human nobles pay fortunes to taste."
 building_elven_agriculture_07: "Gardens of Lost Aelantir"
 building_elven_agriculture_07_desc: "The gardeners grow plants whose seeds crossed the sea from Aelantir. In their shade the elves remember a homeland most of them never saw."
 building_type_elven_port_01: "Elven Harbour"
 building_type_elven_port_01_desc: "The elves came to Cannor across the sea, and they have not forgotten how to build ships or the harbours that shelter them."
 building_elven_port_01: "Fisher Flotillas"
 building_elven_port_01_desc: "Fishing boats put out from wooden wharves along the shore, their sails painted with the sigils of elven families."
 building_elven_port_02: "Stone Quays"
 building_elven_port_02_desc: "The old wharves have given way to quays of fitted stone, built to outlast the elves who laid them."
 building_elven_port_03: "Merchant Wharves"
 building_elven_port_03_desc: "Merchant ships from human ports now tie up beside elven vessels to trade for fine goods."
 building_elven_port_04: "Elven Drydocks"
 building_elven_port_04_desc: "Swan-prowed ships are built and mended here by shipwrights who learned their craft over centuries."
 building_elven_port_05: "Harbourmaster's Spire"
 building_elven_port_05_desc: "A slender tower watches over the harbour, its lamp guiding ships in through fog and storm."
 building_elven_port_06: "Sea-Gates"
 building_elven_port_06_desc: "Great gates of stone and bronze guard the harbour mouth, opened only for friends of the haven."
 building_elven_port_07: "Harbour of the Crossing"
 building_elven_port_07_desc: "The elves say this harbour is built as the havens of Aelantir were, so that every ship that leaves it might one day find the way home."
 building_type_elven_mine_01: "Elven Quarries"
 building_type_elven_mine_01_desc: "Elves take stone and ore from the earth sparingly, closing each wound in the land when they are done."
 building_elven_mine_01: "Stone Cuttings"
 building_elven_mine_01_desc: "Stone is cut from easy outcrops for the haven's buildings, and the scars are planted over."
 building_elven_mine_02: "Shallow Ore Pits"
 building_elven_mine_02_desc: "Shallow pits yield iron and copper for the haven's smiths."
 building_elven_mine_03: "Watermills"
 building_elven_mine_03_desc: "Watermills grind ore and saw stone, sparing the labour of many hands."
 building_elven_mine_04: "Great Quarries"
 building_elven_mine_04_desc: "Larger quarries supply the white stone of the haven's halls."
 building_elven_mine_05: "Deep Mines"
 building_elven_mine_05_desc: "The elves have followed the richest veins deep into the earth, shoring each tunnel with care."
 building_elven_mine_06: "Vast Quarries"
 building_elven_mine_06_desc: "Whole hillsides yield their stone, yet the elves leave the land as green as they found it."
 building_elven_mine_07: "Songs of Stone"
 building_elven_mine_07_desc: "The miners sing to the rock as they work. Dwarves scoff at the practice, but the elves seldom lose a tunnel to collapse."
 building_type_elven_forestry_01: "Elven Woodwardens"
 building_type_elven_forestry_01_desc: "Elves harvest timber as a gardener prunes a tree: a little at a time, and always with an eye to what will grow back."
 building_elven_forestry_01: "Careful Felling"
 building_elven_forestry_01_desc: "A few trees are felled where they will not be missed, and a sapling is planted for each."
 building_elven_forestry_02: "Forester Bands"
 building_elven_forestry_02_desc: "Bands of foresters tend the woods, felling old and fallen timber for the haven's needs."
 building_elven_forestry_03: "Wardens of the Wood"
 building_elven_forestry_03_desc: "The haven's lords appoint wardens to keep the woods, deciding which trees may be cut."
 building_elven_forestry_04: "Speech of the Trees"
 building_elven_forestry_04_desc: "The foresters claim to know which trees are willing to be felled. Whatever the truth, the woods around the haven thrive."
 building_elven_forestry_05: "Forest Reserves"
 building_elven_forestry_05_desc: "Great reserves of forest are kept for the haven's future, felled only in the direst need."
 building_elven_forestry_06: "Teachings of the Fey"
 building_elven_forestry_06_desc: "Elven foresters have learned from the fey of the deep woods how to coax trees to grow tall and straight in a handful of years."
 building_elven_forestry_07: "Cultivated Wildwoods"
 building_elven_forestry_07_desc: "The forests around the haven seem wild, yet every tree in them was planted or tended by elven hands."
 building_type_elven_hunting_grounds_01: "Elven Hunting Grounds"
 building_type_elven_hunting_grounds_01_desc: "Elven hunters take what the land can spare and no more, and the game of their forests never dwindles."
 building_elven_hunting_grounds_01: "Wildland Hunting"
 building_elven_hunting_grounds_01_desc: "Hunters roam the wilds alone or in pairs, taking what game they find."
 building_elven_hunting_grounds_02: "Hunting Bands"
 building_elven_hunting_grounds_02_desc: "Bands of hunters range farther afield, bringing back venison and furs for the haven."
 building_elven_hunting_grounds_03: "Hunt Masters"
 building_elven_hunting_grounds_03_desc: "Hunt masters decide where and when the bands may hunt, so that no herd is thinned too far."
 building_elven_hunting_grounds_04: "Trappers and Trackers"
 building_elven_hunting_grounds_04_desc: "Trappers and trackers of rare skill keep the haven supplied with furs and feathers."
 building_elven_hunting_grounds_05: "Keepers of the Herds"
 building_elven_hunting_grounds_05_desc: "The elves tend the wild herds as a shepherd tends his flock, culling only the old and the weak."
 building_elven_hunting_grounds_06: "Hunters' Lodge"
 building_elven_hunting_grounds_06_desc: "A great lodge houses the haven's hunters, where the young learn the old ways of bow and trail."
 building_elven_hunting_grounds_07: "The Wild Hunt"
 building_elven_hunting_grounds_07_desc: "Once a year the haven rides out on a great hunt through the forests, horns sounding under the moon, as the elves have done since before they crossed the sea."
 building_type_elven_markets_01: "Elven Markets"
 building_type_elven_markets_01_desc: "Elven goods are rare and fine, and the markets where they are sold draw merchants from far beyond the haven."
 building_elven_markets_01: "Gathering Markets"
 building_elven_markets_01_desc: "Elves gather now and then to trade their crafts and share news, with little thought of profit."
 building_elven_markets_02: "Seasonal Fairs"
 building_elven_markets_02_desc: "Fairs at the turning of the seasons draw human merchants hoping to buy elven wares."
 building_elven_markets_03: "Permanent Markets"
 building_elven_markets_03_desc: "Permanent stalls and shaded arcades now line the haven's market square."
 building_elven_markets_04: "Linked Markets"
 building_elven_markets_04_desc: "The haven's markets trade with those of other havens, moving goods along quiet roads."
 building_elven_markets_05: "Great Storehouses"
 building_elven_markets_05_desc: "Great storehouses hold the haven's wealth of wine, cloth and craft against lean years."
 building_elven_markets_06: "Regional Markets"
 building_elven_markets_06_desc: "The haven is the market of its region, where human and elf alike come to buy and sell."
 building_elven_markets_07: "Grand Markets of the Havens"
 building_elven_markets_07_desc: "The haven's markets are famed across Cannor for goods found nowhere else, and their merchants are as patient as they are shrewd."
 building_type_elven_forges_01: "Elven Forges"
 building_type_elven_forges_01_desc: "Elven smiths work slowly, but what they make outlasts the hands of any human smith."
 building_elven_forges_01: "Elven Smithies"
 building_elven_forges_01_desc: "Smiths scattered through the land make the nails, tools and horseshoes the haven needs."
 building_elven_forges_02: "Communal Forges"
 building_elven_forges_02_desc: "The haven's smiths share forges, passing their craft from master to apprentice."
 building_elven_forges_03: "Apprentice Forges"
 building_elven_forges_03_desc: "Young smiths train for decades before they may call themselves masters."
 building_elven_forges_04: "Grand Forges"
 building_elven_forges_04_desc: "Great forges turn out blades and mail of a quality few human smiths can match."
 building_elven_forges_05: "Starmetal Forges"
 building_elven_forges_05_desc: "The smiths work metal that falls from the night sky, forging blades that gleam even in darkness."
 building_elven_forges_06: "Precursor Techniques"
 building_elven_forges_06_desc: "The smiths have recovered techniques of the precursor elves of Aelantir, lost for centuries."
 building_elven_forges_07: "Hall of the Master Smiths"
 building_elven_forges_07_desc: "The greatest smiths of the elves work here, and their masterpieces are sought by kings."
 building_type_elven_barracks_01: "Elven Barracks"
 building_type_elven_barracks_01_desc: "Elves who have lived for centuries have had time to master the arts of war, and they train their warriors with the same patience they give to any craft."
 building_elven_barracks_01: "Militia Grounds"
 building_elven_barracks_01_desc: "Elven militia drill here in their free hours, learning the art of war."
 building_elven_barracks_02: "Militia Armouries"
 building_elven_barracks_02_desc: "An armoury keeps weapons ready for the militia when the haven is threatened."
 building_elven_barracks_03: "Warden Barracks"
 building_elven_barracks_03_desc: "Barracks house the haven's wardens, its standing guard."
 building_elven_barracks_04: "Warden Storehouses"
 building_elven_barracks_04_desc: "Storehouses keep the wardens supplied through long campaigns."
 building_elven_barracks_05: "Grand Barracks"
 building_elven_barracks_05_desc: "Grand barracks house a host of elven warriors trained over decades."
 building_elven_barracks_06: "Barracks Complex"
 building_elven_barracks_06_desc: "A complex of barracks, yards and armouries keeps the haven's host ready for war."
 building_elven_barracks_07: "Hall of the Host"
 building_elven_barracks_07_desc: "The haven's warriors gather in a great hall hung with the banners of wars fought before most humans' grandfathers were born."
 building_type_elven_fletchers_01: "Elven Fletchers"
 building_type_elven_fletchers_01_desc: "The elven bow is famed across Cannor, and the fletchers who make bow and arrow are honoured among the elves."
 building_elven_fletchers_01: "Hearth Fletchers"
 building_elven_fletchers_01_desc: "Archers make their own arrows at home. The work is unorganised but sufficient."
 building_elven_fletchers_02: "Guard Fletchers"
 building_elven_fletchers_02_desc: "Fletchers serve the haven's guard, keeping its archers supplied."
 building_elven_fletchers_03: "Spiral-Fletched Arrows"
 building_elven_fletchers_03_desc: "The fletchers set their feathers in a spiral, so their arrows fly farther and truer."
 building_elven_fletchers_04: "Song-Shaped Bows"
 building_elven_fletchers_04_desc: "Bowyers shape their bows to old songs, and claim the bows remember the tune."
 building_elven_fletchers_05: "Elf-Hair Bowstrings"
 building_elven_fletchers_05_desc: "Strings woven from elven hair are said never to fray or snap in the cold."
 building_elven_fletchers_06: "Silvered Arrows"
 building_elven_fletchers_06_desc: "Arrowheads chased with silver are made for the haven's finest archers."
 building_elven_fletchers_07: "Great Arrow Stores"
 building_elven_fletchers_07_desc: "Great stores of arrows are kept against war, enough to darken the sky."
 building_type_elven_stables_01: "Elven Stables"
 building_type_elven_stables_01_desc: "Elven riders and their mounts are bred for grace and speed, and few human knights can catch them."
 building_elven_stables_01: "Local Riders"
 building_elven_stables_01_desc: "The haven's folk have taken to horseback, and some ride better than any human."
 building_elven_stables_02: "Regional Stables"
 building_elven_stables_02_desc: "Stables across the region breed horses for the haven's riders."
 building_elven_stables_03: "War Stables"
 building_elven_stables_03_desc: "Horses are bred and trained for war, to carry elven riders into battle."
 building_elven_stables_04: "Armoured Riders"
 building_elven_stables_04_desc: "The haven's riders now go to war in light, fine-wrought armour."
 building_elven_stables_05: "Farrier Smithies"
 building_elven_stables_05_desc: "Smithies beside the stables shoe and armour the haven's horses."
 building_elven_stables_06: "Aelantiri Bloodlines"
 building_elven_stables_06_desc: "The haven's horses are said to descend from steeds brought from Aelantir, and they are the swiftest in the land."
 building_elven_stables_07: "The Swift Host"
 building_elven_stables_07_desc: "The haven's cavalry is famed for striking from nowhere and vanishing before its enemies can answer."
 building_type_tree_flet_01: "Canopy Watchposts"
 building_type_tree_flet_01_desc: "Platforms built high in the branches let the elves watch over their woods unseen, and rain arrows on any foe who passes beneath."
 building_tree_flet_01: "Canopy Lookout"
 building_tree_flet_01_desc: "A single platform hidden high in the canopy keeps watch over the forest roads."
 building_tree_flet_02: "Canopy Garrison"
 building_tree_flet_02_desc: "Platforms in the branches house a small garrison of archers."
 building_tree_flet_03: "Canopy Armoury"
 building_tree_flet_03_desc: "An armoury in the treetops keeps bows and arrows ready above the forest floor."
 building_tree_flet_04: "Canopy Forge"
 building_tree_flet_04_desc: "Even a forge has been raised in the branches, its smoke lost among the leaves."
 building_tree_flet_05: "Canopy Storehouses"
 building_tree_flet_05_desc: "Storehouses in the canopy hold food and arrows for a long siege."
 building_tree_flet_06: "Canopy Town"
 building_tree_flet_06_desc: "A whole town of bridges and platforms spans the treetops, home to many of the haven's folk."
 building_tree_flet_07: "City in the Boughs"
 building_tree_flet_07_desc: "A city of lanterns and walkways hangs in the great trees, invisible from the ground until one is already within it."
 building_type_elven_library_01: "Elven Library"
 building_type_elven_library_01_desc: "Elves remember much, but they write down more. Their libraries hold histories that human scholars thought lost."
 building_elven_library_01: "Private Collections"
 building_elven_library_01_desc: "The haven's nobles have begun to gather their collections in a single building."
 building_elven_library_02: "Ordered Library"
 building_elven_library_02_desc: "Librarians now catalogue the collection and copy its rarest works."
 building_elven_library_03: "Specialised Wings"
 building_elven_library_03_desc: "Wings of the library are given over to history, magic, medicine and the stars."
 building_elven_library_04: "Grand Library"
 building_elven_library_04_desc: "The library is among the greatest in Cannor, and scholars travel far to read in it."
 building_elven_library_05: "Library of the Long Memory"
 building_elven_library_05_desc: "The library holds records of Aelantir and of the elves' first years in Cannor, kept by scholars who remember some of it themselves."
 building_type_elven_guild_01: "Elven Guilds"
 building_type_elven_guild_01_desc: "Elven crafters band together in guilds that keep the secrets of their crafts for centuries."
 building_elven_guild_01: "Hunters' Guild"
 building_elven_guild_01_desc: "The haven's hunters and trappers have organised into a guild, rare among the elves."
 building_elven_guild_02: "Woodcarvers' Guild"
 building_elven_guild_02_desc: "Woodcarvers band together to keep their craft, and their work adorns the haven's halls."
 building_elven_guild_03: "Stonewrights' Guild"
 building_elven_guild_03_desc: "The stonewrights who shape the haven's halls keep their methods within their guild."
 building_elven_guild_04: "Glassmiths' Guild"
 building_elven_guild_04_desc: "Glassmiths make coloured glass for the haven's windows and lamps."
 building_elven_guild_05: "Scribes' Guild"
 building_elven_guild_05_desc: "The scribes' guild copies books and keeps the haven's records in a flowing hand."
 building_type_elven_embassy_01: "Elven Gathering Halls"
 building_type_elven_embassy_01_desc: "The elves gather to sing, debate and celebrate, and their gatherings draw guests from near and far."
 building_elven_embassy_01: "Hearth Hall"
 building_elven_embassy_01_desc: "A hall with a great hearth where minstrels play and neighbours meet."
 building_elven_embassy_02: "Open-Air Forum"
 building_elven_embassy_02_desc: "A forum under the trees where the haven's folk debate its affairs."
 building_elven_embassy_03: "Hall of Debate"
 building_elven_embassy_03_desc: "A hall where elves argue law and philosophy for days on end."
 building_elven_embassy_04: "Festival Grounds"
 building_elven_embassy_04_desc: "Grounds for the haven's festivals, which last for weeks and draw guests from far away."
 building_elven_embassy_05: "Elven Amphitheatre"
 building_elven_embassy_05_desc: "A great amphitheatre where plays and songs centuries old are performed."
 building_type_elven_mustering_grounds_01: "Elven Musters"
 building_type_elven_mustering_grounds_01_desc: "When war comes, the haven calls its folk to arms, and every elf has had long years to learn the bow and blade."
 building_elven_mustering_grounds_01: "Sparse Summons"
 building_elven_mustering_grounds_01_desc: "Riders carry the summons through the land, gathering what warriors they can."
 building_elven_mustering_grounds_02: "Regional Camps"
 building_elven_mustering_grounds_02_desc: "Camps across the region train the haven's levies."
 building_elven_mustering_grounds_03: "Warden Musters"
 building_elven_mustering_grounds_03_desc: "The haven's wardens muster and drill the levies each season."
 building_elven_mustering_grounds_04: "Free Companies"
 building_elven_mustering_grounds_04_desc: "Companies of elven warriors serve the haven under captains of their own choosing."
 building_elven_mustering_grounds_05: "Call of the Havens"
 building_elven_mustering_grounds_05_desc: "Beacons on the hills carry the haven's call to arms through the land in a single night, and the elves answer it at once."
 building_type_elven_sanctuary_01: "Elven Sanctuary"
 building_type_elven_sanctuary_01_desc: "Quiet groves and houses of healing where elves rest, mend and meditate."
 building_elven_sanctuary_01: "Secluded Groves"
 building_elven_sanctuary_01_desc: "Quiet groves are tended for rest and contemplation."
 building_elven_sanctuary_02: "Healing Sanctuaries"
 building_elven_sanctuary_02_desc: "Healers tend the sick and wounded in the haven's sanctuaries."
 building_elven_sanctuary_03: "Halls of Healing Dreams"
 building_elven_sanctuary_03_desc: "Healers guide the sick through dreams that mend body and mind alike."
 building_elven_sanctuary_04: "Starlit Gardens"
 building_elven_sanctuary_04_desc: "Gardens laid out by the stars, where the elves walk and meditate under the night sky."
 building_elven_sanctuary_05: "Gardens of Reverie"
 building_elven_sanctuary_05_desc: "Gardens of such peace that even the oldest elves find rest from their long memories."
 building_type_elven_citadel_01: "Elven Citadel"
 building_type_elven_citadel_01_desc: "Elven fortifications are slender and graceful, yet they have broken many sieges."
 building_elven_citadel_01: "Grand Redoubts"
 building_elven_citadel_01_desc: "Redoubts guard every approach to the haven, allowing a long defence."
 building_elven_citadel_02: "High Citadel"
 building_elven_citadel_02_desc: "A high citadel rises over the haven, a last refuge in war."
 building_elven_citadel_03: "Guarded Keep"
 building_elven_citadel_03_desc: "A keep guarded day and night by the haven's wardens."
 building_elven_citadel_04: "Tall Bastion"
 building_elven_citadel_04_desc: "A tall bastion of white stone from which archers command the land around."
 building_elven_citadel_05: "Unbroken Fortress"
 building_elven_citadel_05_desc: "The haven's fortress has never fallen, and its defenders mean to keep it so."
 building_type_hall_of_lords_01: "Hall of Lords"
 building_type_hall_of_lords_01_desc: "Where the haven's lords hear their people and govern their lands."
 building_hall_of_lords_01: "Audience Hall"
 building_hall_of_lords_01_desc: "Nobles, merchants, smiths and commoners petition their lord here, or the lord's steward in their absence."
 building_hall_of_lords_02: "Palace of Governance"
 building_hall_of_lords_02_desc: "A palace of offices and halls from which the haven's lords govern their lands with unhurried care."
 building_type_elven_armament_01: "Elven Armament"
 building_type_elven_armament_01_desc: "The haven's armouries and roads let its host march to war at speed."
 building_elven_armament_01: "Company of the Highborn"
 building_elven_armament_01_desc: "The haven's noble houses keep companies of warriors armed and ready."
 building_elven_armament_02: "Hall of Banners"
 building_elven_armament_02_desc: "A hall hung with the banners of every company of the haven, its armouries ringing with hammers day and night."
 building_type_hall_of_music_and_tales_01: "Hall of Song"
 building_type_hall_of_music_and_tales_01_desc: "A great hall where the elves keep their songs and stories, some older than any human kingdom."
 building_hall_of_music_and_tales_01: "Hall of Song"
 building_hall_of_music_and_tales_01_desc: "A tall hall where even the softest voice carries to every corner, home to the duchy's minstrels."
 building_hall_of_music_and_tales_02: "The Echoing Vaults"
 building_hall_of_music_and_tales_02_desc: "Vaults beneath the hall hold songs written down in centuries past, sung again on high days."
 building_hall_of_music_and_tales_03: "Choir of the Long Years"
 building_hall_of_music_and_tales_03_desc: "The hall's choir sings songs of Aelantir in voices that have practised them for centuries."
 building_type_crafting_enclaves_01: "Masters' Enclave"
 building_type_crafting_enclaves_01_desc: "An enclave where the finest elven crafters work, improving the duchy's buildings and arms alike."
 building_crafting_enclaves_01: "The Hundred Masters"
 building_crafting_enclaves_01_desc: "Skilled engineers and smiths work on new methods for building and arming."
 building_crafting_enclaves_02: "Elven Masterworks"
 building_crafting_enclaves_02_desc: "The enclave's works are prized throughout Cannor."
 building_crafting_enclaves_03: "Secrets of Starfire"
 building_crafting_enclaves_03_desc: "The masters have learned to work starmetal, making blades that never dull."
 building_type_sentinel_keeps_01: "Sentinel Keeps"
 building_type_sentinel_keeps_01_desc: "Keeps and watchtowers guard the borders of the duchy against raiders and worse."
