 activity_dwarven_expedition_predicted_cost:0 "The cost of a [GetActivityType( 'activity_dwarven_expedition' ).GetNameNoTooltip] depends on the expedition type and the crew you choose, and grows with your [culture|E]'s [era|E]."
 activity_dwarven_expedition_guest_desc:0 "$BULLET_WITH_TAB$Go down into the deep with the host's delvers"
 activity_dwarven_expedition_desc:0 "Lanterns lit and picks shouldered, a band of delvers goes down into the deep rock, to look for new veins of ore or for the halls of our ancestors."
 activity_dwarven_expedition_selection_tooltip:0 "Lead delvers underground in search of ore or old dwarven halls\n\nAnticipated Rewards:\n$EFFECT_LIST_BULLET$ A new ore deposit (Mining)\n$EFFECT_LIST_BULLET$ [prestige_i|E][prestige|E]"
 activity_dwarven_expedition_destination_selection:0 "Mining needs mountains or dwarven terrain without a discovered deposit; Archaeology needs dwarven terrain. Expeditions in a dwarven hold are more likely to succeed."
 activity_dwarven_expedition_guest_help_text:0 "[activity_guests|E] go down into the deep with the delvers and share in what befalls the expedition."
 activity_dwarven_expedition_host_desc:0 "$BULLET_WITH_TAB$A successful Mining expedition gives the [barony|E] a new ore deposit\n$BULLET_WITH_TAB$Your [stewardship|E], your crew and a dwarven hold raise the chance of success"
 activity_dwarven_expedition_province_desc:0 "You lead a Dwarven Expedition into [ROOT.Province.GetName].\n"
 activity_dwarven_expedition_province_desc_mining:0 "#P $BULLET_WITH_TAB$No deposit has been found here yet#!\n"
 activity_dwarven_expedition_province_desc_archaeology:0 "#P $BULLET_WITH_TAB$Old dwarven halls lie under this [barony|E]#!\n"
 activity_dwarven_expedition_province_desc_hold:0 "#P $BULLET_WITH_TAB$A dwarven hold: +10% chance of success#!\n"
 activity_dwarven_expedition_conclusion_desc:0 "The delvers came back with sore backs and empty sacks. The rock kept its secrets this time."
 activity_dwarven_expedition_conclusion_desc_found:0 "The delvers struck a new vein! The deposit has been marked, and a mine can now be built over it."
 activity_dwarven_expedition_conclusion_desc_archaeology:0 "The expedition walked the old halls and brought back tales of what it saw, though nothing has been catalogued yet."

