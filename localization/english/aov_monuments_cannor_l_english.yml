 building_aov_monument_kazakesh_stingport_01: "Kazakesh"
 building_aov_monument_kazakesh_stingport_01_desc: "Of the many ancient Vyzemby Ananoma, the one standing on the Dao Nako coast has the most remarkable features of them all. A towering spire, incredibly similar to those standing in the traditional lizardfolk homelands of Taneyas, emerges from the center of the beehive fortress. Most remarkably of all, what one can see is only the very top of the spire. Deep underground lie layers upon layers of un-excavated floors of this great structure. How it sank is unknown, but its discovery prompted a rush of interest in what treasures could lie at its deepest levels."
