 building_aov_monument_escandar_02: "Escandar (II)"
 building_aov_monument_escandar_02_desc: "Escandar has always guarded contested territory. It was first built by the famed Calasandur the Magnificent as steward of the pass through the Khenak Mountains. As the main fortress separating The Borders and Businor, it served to keep Businor's gnoll infestation out of the southeastern Dameshead. Escandar has famously changed hands many times. During the War of the Sorcerer King, the Wexonard warlord Magda síl Magda was appointed to rule from the citadel, as duchess of the short-lived Duchy of Escandar. In the time of Jaher's conquests, Escandar was a stronghold for his early conquests in Southeast Cannor. When the Busilari Interregnum led to patchwork civil wars between countless petty kings and squabbling warlords, Escandar was a safe harbor for all peoples. In modern times, Escandar retains its original role of keeping the diminished Hillthrone gnoll packs at bay. Courtiers grumble that its garrison should finally wipe out the pests, and be reassigned to better things... Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
