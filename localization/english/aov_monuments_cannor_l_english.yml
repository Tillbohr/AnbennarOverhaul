 building_aov_monument_sorncell_deepwater_harbor_01: "Deepwater Harbor of Sorncell"
 building_aov_monument_sorncell_deepwater_harbor_01_desc: "The Coastal city of Sorncell has an excellent deepwater port that has been in continuous use since ancient times. Large and heavy ships, usually either merchantmen or warships, could easily enter the harbor and dock safely. Further, because of this natural port, Sorncell's local economy is heavily built around shipbuilding and sailing."
