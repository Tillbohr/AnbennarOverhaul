 building_aov_monument_menibor_hall_of_the_gallant_01: "The Hall of the Gallant"
 building_aov_monument_menibor_hall_of_the_gallant_01_desc: "The dream of every adventurer hailing from the Dameshead is to have their statue and name featured in the hallowed corridors of the Hall of the Gallant, a vast memorial dedicated to those heroes that lost their lives fighting for glory and justice. With names and busts dating back to before the Dragonwake, it is the most well known and respected edifice in the city."
