 aov_expedition.1.t:0 "Into the Deep"
 aov_expedition.1.desc:0 "The delvers stand ready before the great gate, packs heavy with rope, wedges and lamp oil, picks over their shoulders. Behind us lie the lit halls; ahead, the dark roots of the Serpentspine, where no lamp has burned for longer than any of us has been alive.\n\nEvery eye turns to me. Before the first step into the dark, a word from the expedition leader is owed."
 aov_expedition.1.a:0 "Our ancestors carved these mountains. Let us prove ourselves worthy of them!"
 aov_expedition.1.b:0 "Nobody goes down with cheap lamps. Buy the best in the hold."
 aov_expedition.1.c:0 "Let the oldest delver lead the way. The stone remembers her."

 aov_expedition.101.t:0 "A Glitter in the Dark"
 aov_expedition.101.desc:0 "A lamp swings past a side passage and the wall answers it with a glitter. The delvers crowd around: a thick seam runs off into the rock, richer than anything the surveyors promised.\n\nFollowing it will take us off the planned course, but where one vein runs, others often follow."
 aov_expedition.101.a:0 "Follow the vein. The mountain is showing us the way."
 aov_expedition.101.b:0 "Send for more hands and timber, and work it properly."
 aov_expedition.101.c:0 "Chip out what the crew can carry, then back to the plan."

 aov_expedition.102.t:0 "Cave-In!"
 aov_expedition.102.desc:0 "A groan runs through the rock, then a roar. When the dust settles, the gallery behind the lead crew is a wall of broken stone, and faint knocking comes from the other side.\n\nThe delvers look to me. Every hour spent digging is an hour not spent on the search, and the roof is still creaking."
 aov_expedition.102.a:0 "Buy timber to shore it up, then dig them out."
 aov_expedition.102.b:0 "Hand me a pick. I will dig them out myself."
 aov_expedition.102.c:0 "The roof will not hold. Seal it and find another way round."

 aov_expedition.103.t:0 "The Flooded Shaft"
 aov_expedition.103.desc:0 "The old shaft we meant to descend is full to the brim with black, still water. A dropped stone sinks without a sound. Somewhere far below, the way onward lies dry, if only we can reach it."
 aov_expedition.103.a:0 "Rig pumps and bail it dry, whatever it costs."
 aov_expedition.103.b:0 "Send the strongest swimmers down on ropes."
 aov_expedition.103.c:0 "Leave it. We will work the upper galleries instead."

 aov_expedition.104.t:0 "Carvings on the Wall"
 aov_expedition.104.desc:0 "Behind a curtain of dripstone, the delvers find a wall carved long ago by dwarven hands: runes worn almost smooth, and a picture of miners following a seam deeper into the mountain. Whoever made it knew this rock long before we did.\n\nThe oldest delvers murmur that the marks point the way the old miners went."
 aov_expedition.104.a:0 "Follow the old marks. The ancestors knew where the ore lay."
 aov_expedition.104.b:0 "Copy every rune for the loremasters of the hold."

 aov_expedition.105.t:0 "A Delver Is Missing"
 aov_expedition.105.desc:0 "At the evening count, one delver is missing. He went down into the lower galleries alone to check a crack in the rock and never came back. His lamp would have burned out hours ago.\n\nThe lower galleries are a maze, and a search will cost us time we can ill afford."
 aov_expedition.105.a:0 "Send a search party with lamps and rope."
 aov_expedition.105.b:0 "I will look for him myself."
 aov_expedition.105.b.found:0 "You find him, and the passage he found too"
 aov_expedition.105.b.lost:0 "You lose your own way before you find him"
 aov_expedition.105.c:0 "The expedition cannot wait for one delver."

 aov_expedition.106.t:0 "A Quarrel Among the Delvers"
 aov_expedition.106.desc:0 "Voices echo up the gallery. The old foreman wants to cut the next passage slowly, along the grain of the rock, as his father and his grandfather did; a young delver swears that a straight, bold cut will reach the deep seams in half the time. Their crews have taken sides, and nobody is digging."
 aov_expedition.106.a:0 "The old way has kept dwarves alive for a thousand years."
 aov_expedition.106.b:0 "Let the youngster try the bold cut."
 aov_expedition.106.c:0 "A cask of ale for both crews, and an end to this."

 aov_expedition.900.t:0 "A New Vein"
 aov_expedition.900.desc:0 "For months the delvers have followed the rock beneath [aov_expedition_site.GetName], and at last their picks ring true."
 aov_expedition.900.desc.mithril:0 "\n\nIn the lamplight a pale seam gleams that no tool can scratch and no damp can tarnish: true mithril, rarest of all the metals of Halann. The scribes enter it in the hold's ledgers as a #high $mining_mithril_province_modifier$#!, and the news runs through the halls faster than any messenger."
 aov_expedition.900.desc.gold:0 "\n\nThe seam is gold, thick and yellow as butter in the lamplight. The scribes enter it in the hold's ledgers as a #high $mining_gold_province_modifier$#!, and the treasurers are already counting."
 aov_expedition.900.desc.silver:0 "\n\nA bright seam of silver runs through the dark stone like a frozen river. The scribes enter it in the hold's ledgers as a #high $mining_silver_province_modifier$#!."
 aov_expedition.900.desc.iron:0 "\n\nThe rock is heavy and red with iron ore, enough to keep the forges of the hold roaring for a generation. The scribes enter it in the hold's ledgers as an #high $mining_iron_province_modifier$#!."
 aov_expedition.900.desc.copper:0 "\n\nGreen-streaked stone gives way to a rich seam of copper. The scribes enter it in the hold's ledgers as a #high $mining_copper_province_modifier$#!, and the bronzesmiths rejoice."
 aov_expedition.900.desc.tin:0 "\n\nDark crystals of tinstone glint in the gallery walls, the very ore the bronzesmiths have long been short of. The scribes enter it in the hold's ledgers as a #high $mining_tin_province_modifier$#!."
 aov_expedition.900.desc.lead:0 "\n\nA dull grey seam of lead ore runs deep into the rock, heavy and plentiful. The scribes enter it in the hold's ledgers as a #high $mining_lead_province_modifier$#!."
 aov_expedition.900.desc.diamond:0 "\n\nA delver's pick turns up a stone that throws the lamplight back in a hundred colours: diamonds, sleeping in the deep rock since the world was young. The scribes enter it in the hold's ledgers as a #high $mining_diamond_province_modifier$#!."
 aov_expedition.900.desc.ruby:0 "\n\nRed as forge-fire, rubies glitter in the broken rock. The scribes enter it in the hold's ledgers as a #high $mining_ruby_province_modifier$#!, and the gemcutters crowd the gallery mouth."
 aov_expedition.900.desc.sapphire:0 "\n\nDeep blue stones, clear as a mountain lake, lie in the seam. The scribes enter it in the hold's ledgers as a #high $mining_sapphire_province_modifier$#!."
 aov_expedition.900.desc.emerald:0 "\n\nGreen fire flickers in the rock: emeralds, as many as the eye can see by lamplight. The scribes enter it in the hold's ledgers as an #high $mining_emerald_province_modifier$#!."
 aov_expedition.900.desc.amethyst:0 "\n\nThe gallery opens into a hollow lined with violet crystal. The scribes enter it in the hold's ledgers as an #high $mining_amethyst_province_modifier$#!."
 aov_expedition.900.desc.onyx:0 "\n\nBands of black and white stone, smooth as polished marble, run through the gallery walls. The scribes enter it in the hold's ledgers as an #high $mining_onyx_province_modifier$#!."
 aov_expedition.900.desc.peridot:0 "\n\nOlive-green stones glint in the dark basalt, lit from within. The scribes enter it in the hold's ledgers as a #high $mining_peridot_province_modifier$#!."
 aov_expedition.900.desc.quartz:0 "\n\nClear crystal spikes grow from the gallery walls, ringing softly when the picks touch them. The scribes enter it in the hold's ledgers as a #high $mining_quartz_province_modifier$#!."
 aov_expedition.900.desc.known:0 "\n\nYet when the scribes come to mark the find, they discover that this rock has already been charted: the seam is one the hold knew of, and no new deposit is entered in the ledgers. Still, the delvers come home whole, and their skill is the talk of the halls."
 aov_expedition.900.a:0 "The mountain has rewarded us."

 aov_expedition.901.t:0 "Barren Rock"
 aov_expedition.901.desc:0 "For months the delvers have followed every crack and seam beneath [aov_expedition_site.GetName], and for months the rock has given back nothing but grey dust. The last lamp oil is running low; it is time to turn back.\n\nSome of the stores and tools we bought can be sold again in the hold, at least."
 aov_expedition.901.a:0 "The mountain keeps its secrets. For now."

 aov_expedition.902.t:0 "The Old Halls"
 aov_expedition.902.desc:0 "The expedition has walked the old halls beneath [aov_expedition_site.GetName]: pillared galleries where our ancestors once lived and worked, now silent under the dust of centuries. The delvers bring back sketches, rubbings of old runes and tales of what they saw, though none of it has yet been catalogued."
 aov_expedition.902.a:0 "Let the loremasters make sense of it."

