 building_aov_monument_ovdal_tungr_port_hold_03_desc: "The Copper Dwarves of Ovdal Tûngr stand out amongst all the dwarves of Halann - not just those within the Serpentspine - as being unusually adept and capable at sea. While most dwarves have a great dislike and even fear of large bodies of open water, the Copper Dwarves prove that this fear is hardly something that is genetic to the Dwarven race, and are some of the best sailors in all of both Bulwar and Cannor. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
 building_aov_monument_quartz_cothon_01: "Quartz Cothon"
 building_aov_monument_quartz_cothon_01_desc: "The coast of the Far Salahad along the Gulf of Rahen is a desolate and forbidding landscape. Sand dunes and stony arid plains stretch from the shore to the horizon. But hidden among this barren coastline is a true marvel. A day's travel east from the coastal town of Daqalm, the barren cliffs along the coast are separated by a broad channel, hidden from view by strategically placed rock outcroppings until a ship is almost right upon it. A vessel entering this channel will soon arrive at a perfectly circular gargantuan harbor, capable of hosting an entire fleet. This is the fabled Quartz Cothon. Its wharves, buildings and walkways are fashioned not from the local sandstone but from blindingly white marble, inlaid with massive veins of quartz. These quartz veins form perfectly geometrical patterns and lend the cothon its name. Opposite the channel entrance, a white marble tower, almost delicate despite its size, stretches towards the sky and overlooks the harbor. All along the harbor front, basins are carved into the marble, easily adaptable as drydocks. And surrounding the cothon on all sides are buildings with an austere beauty supported by towering marble columns. Despite their finely wrought construction, these buildings appear to be intended as shipyards and storehouses for raw materials and trade goods alike. Who created this marvel - Djinn, God-king or other entity - has been lost to the mists of time, and the cothon itself has been discovered and then abandoned during times of conflict multiple times over the millennia. Yet whenever it has been freed from the shifting sand dunes that tend to bury it when left unattended, it is undeniably the finest harbor in the westernmost Gulf of Rahen. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
