 building_aov_monument_freecestir_mustering_grounds_01: "Mustering Grounds of Freecestir"
 building_aov_monument_freecestir_mustering_grounds_01_desc: "Freecestir has been a settlement of great importance ever since the pivotal role it played in the defeat of the Sorcerer-King. Freecestir's strategic location at the crossroads between Escann and the rest of Cannor means that it has frequently served as a mustering ground for armies (and adventurers) seeking to gain glory in Escann and beyond, as well as a stopping point for trade passing between the two regions."
