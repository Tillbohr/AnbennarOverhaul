 building_aov_monument_mines_of_yfelorr_01: "The Mines of Yfelorr"
 building_aov_monument_mines_of_yfelorr_01_desc: "Quaintly nested within pleasant clearing filled with babbling brooks, lie the silver mines of Yfelorr. Uniquely fey-marked and inexorably tied to the Feyrealm, the mines have reliably provided the Deepwoods with precious metals thanks to its ever replenishing veins. In the centuries after the Verdant Veil's fall, development of the mine would discover it had more to offer than just silver... Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
