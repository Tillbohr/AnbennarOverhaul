 building_aov_monument_rubyhold_academy_01: "Rubyhold Institute of Humanities"
 building_aov_monument_rubyhold_academy_01_desc: "The Rubyhold Institute of Humanities is an institution dedicated to the study of humans and human societies. Founded when humans first began settling in the Dameshead region, dwarven scholars from the Institute have been carefully studying humans for over a thousand years. Topics such as human construction methods, how humans conduct wars, how they order their societies, and human religion are all fascinating topics that intelligent and studious dwarves at the Institute have carefully compiled records on for thousands of years. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
