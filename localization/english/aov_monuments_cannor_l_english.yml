 building_aov_monument_hammerhome_artificers_guild_01: "Hammerhome Artificers Guild"
 building_aov_monument_hammerhome_artificers_guild_01_desc: "In 1846, various prominent dwarven artificers such as Kelgrim Kazdoran founded the Dwarven Artificers Guild in Hammerhome as a response to the immense pressure and influence from the gnomish artificer circles to think and invent their way. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
