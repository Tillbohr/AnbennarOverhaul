l_english:
 # # Anbennar Overhaul: generated by tools/build_racial_traditions.py; do not edit by hand.
 tradition_elven_high_culture_name:0 "Elven High Culture"
 tradition_elven_high_culture_desc:0 "The moon elves remember the courts of Aelantir and hold to their manners still. Human kings seek their counsel, and human sellswords take their silver gladly."
 tradition_ranger_art_name:0 "The Ranger Art"
 tradition_ranger_art_desc:0 "Since the retreat into the Deepwoods every wood elf learns to walk the forest unseen, live off what it gives and strike from where the enemy least expects."
 tradition_iorels_accords_name:0 "Ioriel's Accords"
 tradition_iorels_accords_desc:0 "In 1001 Ioriel Redrose made peace with Lorent, and the Redglades have lived by treaty ever since. Its Érhetana Sentinels keep the thorned glades for those who forget it."
 tradition_forlorn_vale_name:0 "Defense of the Forlorn Vale"
 tradition_forlorn_vale_desc:0 "Ibevar was carved out of a vale no one else wanted and has been defended ever since. The Blaiddscal academy trains its blademasters, and every Ibevari learns the bow."
 tradition_elves_of_the_reach_name:0 "Elves of the Reach"
 tradition_elves_of_the_reach_desc:0 "Maldorian the Navigator led his people to the cold coasts of the Reach, where they trade with every port and hire out their spears to escort the merchant princes."
 tradition_remnant_fleet_name:0 "Lessons of the Remnant Fleet"
 tradition_remnant_fleet_desc:0 "The Venáili never forgot the fleet that carried the elves across the sea. Their arks are the finest afloat, and their marines fight as well on a heaving deck as on a beach."
 tradition_verdant_pact_name:0 "The Verdant Pact"
 tradition_verdant_pact_desc:0 "Salla Elyn rules from Elynáile, the Eternal City, by the Verdant Pact: the lesser clans keep their groves, and in return they answer the conclave's call."
 tradition_never_to_fall_name:0 "Never to Fall"
 tradition_never_to_fall_desc:0 "Ciranmyna has never fallen, and Salla Myna means to keep it so. Its warriors still dance with the spear as the Speardancer taught them."
 tradition_closest_to_the_fey_name:0 "Closest to the Fey"
 tradition_closest_to_the_fey_desc:0 "Salla Drennen lives nearest the fey and raised the first druids of the Deepwoods. Its druids still march with its warriors, and the thorns rise against its enemies."
 tradition_bone_struggle_name:0 "The Bone Struggle"
 tradition_bone_struggle_desc:0 "Salla Cenág survived the Bone Struggle by learning to fight unseen. Its scouts wear the bones of what they have killed and slip past any wall."
 tradition_great_beast_hunters_name:0 "Great Beast Hunters"
 tradition_great_beast_hunters_desc:0 "Salla Fealgarn hunts the great beasts of the Deepwoods from the backs of its stags. Its Hyodeth riders are the best mounted, best fed and most feared in the forest."
 tradition_every_elf_a_botanist_name:0 "Every Elf a Botanist"
 tradition_every_elf_a_botanist_desc:0 "Salla Scotha knows every herb of the Deepwoods: which heals, which sells, and which kills. Its archers dip their arrows in the last kind."
 tradition_peace_and_abundance_name:0 "A Grove of Peace and Abundance"
 tradition_peace_and_abundance_desc:0 "Salla Ahain shares its springs with satyrs and fey, and its people want for nothing. Few wood elves are as content, and few groves as rich."
 tradition_greatest_archers_name:0 "Clan of the Greatest Archers"
 tradition_greatest_archers_desc:0 "Salla Ayeth gave the Ayethi their name. Its archers loose from the high branches, and its carpenters build in living wood."
 tradition_shadow_grove_name:0 "The Shadow Grove"
 tradition_shadow_grove_desc:0 "Salla Ghúl lives in the shade of the Ashentree fey and the Witch of the East. Those who come to spy on it are rarely seen again."
 tradition_our_rubies_name:0 "Our Rubies"
 tradition_our_rubies_desc:0 "The rubies of Rubyhold buy friends in Lencenor and pay the engineers who take the walls of those who will not be friends. Its Grudgebearers remember the rest."
 tradition_silverforge_name:0 "Silver Army Engineers"
 tradition_silverforge_desc:0 "Silverforge's engineers cut the greatest mines in Escann and turn the same skill to war. Their siege engines go up faster and cost less than anyone else's."
 tradition_solid_as_stone_name:0 "Solid as Stone"
 tradition_solid_as_stone_desc:0 "The stone dwarves count every life and spend none lightly. Behind their tortoise of shields they outlast foes who outnumber them ten to one."
 tradition_giantbane_name:0 "Giantbane"
 tradition_giantbane_desc:0 "Khugdihr has fallen to orcs, dragons and giants, and risen each time. The agate dwarves train to kill the largest thing on the field first."
 tradition_uthojdihr_seafarers_name:0 "Uthojdihr Seafarers"
 tradition_uthojdihr_seafarers_desc:0 "Unlike other dwarves, the copper dwarves of Ovdal Tûngr took to the sea. They sail the Bahar coast and fight as well in its marshes as in their halls."
 tradition_citrine_code_name:0 "The Citrine Code"
 tradition_citrine_code_desc:0 "Seghdihr keeps its word to the Bulwari, and the Seg Band keeps the gnolls from both. Its code binds every citrine dwarf to honest dealing."
 tradition_three_golden_gates_name:0 "The Three Golden Gates"
 tradition_three_golden_gates_desc:0 "Verkal Gulan guards its vaults behind three golden gates and pays well to keep them shut. No enemy has passed the Hero's Gate while its guard stood."
 tradition_thirteen_stages_name:0 "The Thirteen Stages of Enlightenment"
 tradition_thirteen_stages_desc:0 "Hehodovar's Builders Guild still keeps the learning of Aul-Dwarov alive. Its thinkers invent, its builders cannot stop working, and its bows tension their own strings."
 tradition_dauvek_veker_name:0 "The Titanium Orders"
 tradition_dauvek_veker_desc:0 "The titanium dwarves join holy orders sworn to hunt what crawls up from the deep. Their penitents wear the heaviest armour any dwarf can carry."
 tradition_copper_road_pact_name:0 "The Copper Road Pact"
 tradition_copper_road_pact_desc:0 "By the Copper Road Pact, Gor Ozumbrog keeps the dwarven road open to the east. Its wardens ride every tunnel of it, and every topaz dwarf stands to defend the hold."
 tradition_masons_of_the_deep_name:0 "Masons of the Deep"
 tradition_masons_of_the_deep_desc:0 "The marble dwarves carve the finest halls under the mountains. They honour Mhoki Brightbeard, whose hammer ended a siege of 47 years with one blow."
 tradition_scavengers_and_raiders_name:0 "Scavengers and Raiders"
 tradition_scavengers_and_raiders_desc:0 "The Sandfang gnolls take what they need from those too weak to keep it. Their hyena riders strike far from the desert and are gone with the loot before an army can gather."
 tradition_tight_leash_name:0 "A Tight Leash"
 tradition_tight_leash_desc:0 "The Fieldstalkers rule their fields as slave-lords and keep their packs, of hyenas and of subjects, on a tight leash."
 tradition_apple_lords_name:0 "Apple Lords"
 tradition_apple_lords_desc:0 "The ciderfoot halflings grow the best apples and pears in Cannor and drink the best cider. They live long, worry little and guard their orchards with the bow."
 tradition_beggas_two_hands_name:0 "Begga's Two Hands"
 tradition_beggas_two_hands_desc:0 "Beepeck's right hand gives and its left hand takes, and its merchants welcome any faith that pays. Its marines keep the harbour open."
 tradition_mound_forts_name:0 "Mound Forts"
 tradition_mound_forts_desc:0 "The bluefoot halflings dig their forts into the hills and hold them with stubborn hearts. Whoever comes for them has to dig them out."
 tradition_small_country_envoys_name:0 "Small Country Envoys"
 tradition_small_country_envoys_desc:0 "The visfoot halflings talk their way out of more wars than they fight. Their moots are guarded by keepers in good armour, just in case."
 tradition_charter_rights_name:0 "Charter Rights"
 tradition_charter_rights_desc:0 "Every imperial halfling town keeps its charter, and every charter names its rights. Its rangers patrol the bounds the charters draw."
 tradition_hearth_and_harvest_name:0 "Hearth and Harvest"
 tradition_hearth_and_harvest_desc:0 "The moonfoot halflings tend their fields and their hearths. When trouble comes the whole village musters, and goes home to the harvest after."
 aov_erhetana_sentinels:0 "Érhetana Sentinels"
 aov_erhetana_sentinels_flavor:0 "#F The sentinels of the Redglades keep its thorned glades. They let pass whoever comes in peace and turn the thorns themselves against whoever does not.#!"
 culture_parameter_aov_unlock_maa_erhetana_sentinels:0 "Can recruit [GetMaA('aov_erhetana_sentinels').GetName] as [men_at_arms|E]"
 aov_blaiddscal_blademasters:0 "Blaiddscal Blademasters"
 aov_blaiddscal_blademasters_flavor:0 "#F Graduates of the Blaiddscal, Ibevar's academy of arms. Each has spent a human lifetime with the glaive before taking the field.#!"
 culture_parameter_aov_unlock_maa_blaiddscal_blademasters:0 "Can recruit [GetMaA('aov_blaiddscal_blademasters').GetName] as [men_at_arms|E]"
 aov_trade_prince_escorts:0 "Escorts of the Trade Princes"
 aov_trade_prince_escorts_flavor:0 "#F Celmaldor's spearmen guard the merchant princes of the Reach on every road and quay. Their wall of spears has turned back raiders from the sea and the steppe alike.#!"
 culture_parameter_aov_unlock_maa_trade_prince_escorts:0 "Can recruit [GetMaA('aov_trade_prince_escorts').GetName] as [men_at_arms|E]"
 aov_remnant_fleet_marines:0 "Remnant Fleet Marines"
 aov_remnant_fleet_marines_flavor:0 "#F Venáil's marines descend from the warriors of the fleet that carried the elves to Cannor. They land anywhere a ship can reach and fight before the enemy has formed up.#!"
 culture_parameter_aov_unlock_maa_remnant_fleet_marines:0 "Can recruit [GetMaA('aov_remnant_fleet_marines').GetName] as [men_at_arms|E]"
 aov_oak_oath_guard:0 "Oak Oath Guard"
 aov_oak_oath_guard_flavor:0 "#F Sworn by the Oak Oath to Elynáile and its conclave, these guards stand before the Eternal City in living-wood armour.#!"
 culture_parameter_aov_unlock_maa_oak_oath_guard:0 "Can recruit [GetMaA('aov_oak_oath_guard').GetName] as [men_at_arms|E]"
 aov_speardancers:0 "Speardancers"
 aov_speardancers_flavor:0 "#F Salla Myna's warriors fight in the style of the Speardancer, whirling through the enemy line where no shield can follow the point.#!"
 culture_parameter_aov_unlock_maa_speardancers:0 "Can recruit [GetMaA('aov_speardancers').GetName] as [men_at_arms|E]"
 aov_bonecoated_infiltrators:0 "Bonecoated Infiltrators"
 aov_bonecoated_infiltrators_flavor:0 "#F Salla Cenág's scouts wear the bones of what they have hunted. They slip into camps and over walls and leave nothing behind but the bones.#!"
 culture_parameter_aov_unlock_maa_bonecoated_infiltrators:0 "Can recruit [GetMaA('aov_bonecoated_infiltrators').GetName] as [men_at_arms|E]"
 aov_scotha_poison_archers:0 "Scotha Poison Archers"
 aov_scotha_poison_archers_flavor:0 "#F Salla Scotha's archers know which herbs kill and how fast. A graze from one of their arrows is enough.#!"
 culture_parameter_aov_unlock_maa_scotha_poison_archers:0 "Can recruit [GetMaA('aov_scotha_poison_archers').GetName] as [men_at_arms|E]"
 aov_witchwood_stalkers:0 "Witchwood Stalkers"
 aov_witchwood_stalkers_flavor:0 "#F The archers of the Shadow Grove serve the Witch of the East. They are seldom seen, and those who see them rarely report it.#!"
 culture_parameter_aov_unlock_maa_witchwood_stalkers:0 "Can recruit [GetMaA('aov_witchwood_stalkers').GetName] as [men_at_arms|E]"
 aov_hyena_riders:0 "Hyena Riders"
 aov_hyena_riders_flavor:0 "#F Sandfang gnolls on great hyenas, who range far ahead of the pack and fall on anything that strays from the column.#!"
 culture_parameter_aov_unlock_maa_hyena_riders:0 "Can recruit [GetMaA('aov_hyena_riders').GetName] as [men_at_arms|E]"
 aov_fieldstalker_packs:0 "Fieldstalker Packs"
 aov_fieldstalker_packs_flavor:0 "#F Gnoll packmasters with their hyenas, who stalk the fields of their slaves and run down anyone who tries to flee them.#!"
 culture_parameter_aov_unlock_maa_fieldstalker_packs:0 "Can recruit [GetMaA('aov_fieldstalker_packs').GetName] as [men_at_arms|E]"
 aov_orchard_bowmen:0 "Orchard Bowmen"
 aov_orchard_bowmen_flavor:0 "#F Ciderfoot halflings who learned the bow guarding their orchards from thieves, and now guard the rest of the realm the same way.#!"
 culture_parameter_aov_unlock_maa_orchard_bowmen:0 "Can recruit [GetMaA('aov_orchard_bowmen').GetName] as [men_at_arms|E]"
 aov_seedoud_marines:0 "Seedoud Marines"
 aov_seedoud_marines_flavor:0 "#F Beepeck's harbour watch, armed with crossbows. They guard the quays and sail with its merchant fleet.#!"
 culture_parameter_aov_unlock_maa_seedoud_marines:0 "Can recruit [GetMaA('aov_seedoud_marines').GetName] as [men_at_arms|E]"
 aov_mound_wardens:0 "Mound Wardens"
 aov_mound_wardens_flavor:0 "#F Bluefoot halflings who hold the mound forts. Behind their earthworks and their spears they will not be moved.#!"
 culture_parameter_aov_unlock_maa_mound_wardens:0 "Can recruit [GetMaA('aov_mound_wardens').GetName] as [men_at_arms|E]"
 aov_moot_keepers:0 "Moot Keepers"
 aov_moot_keepers_flavor:0 "#F The armoured guard of the visfoot moots, who keep order while the talking goes on and settle it when the talking stops.#!"
 culture_parameter_aov_unlock_maa_moot_keepers:0 "Can recruit [GetMaA('aov_moot_keepers').GetName] as [men_at_arms|E]"
 aov_charter_rangers:0 "Charter Rangers"
 aov_charter_rangers_flavor:0 "#F Imperial halfling rangers who walk the bounds of their towns' charters with bow in hand.#!"
 culture_parameter_aov_unlock_maa_charter_rangers:0 "Can recruit [GetMaA('aov_charter_rangers').GetName] as [men_at_arms|E]"
 aov_hearth_muster:0 "Hearth Muster"
 aov_hearth_muster_flavor:0 "#F The whole moonfoot village, called up with whatever is to hand. Hard to catch and harder to drive off their own fields.#!"
 culture_parameter_aov_unlock_maa_hearth_muster:0 "Can recruit [GetMaA('aov_hearth_muster').GetName] as [men_at_arms|E]"
