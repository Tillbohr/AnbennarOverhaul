 building_aov_monument_ovdal_tungr_port_hold_01: "Port-Hold of Ovdal Tûngr"
 building_aov_monument_ovdal_tungr_port_hold_01_desc: "The Copper Dwarves of Ovdal Tûngr stand out amongst all the dwarves of Halann - not just those within the Serpentspine - as being unusually adept and capable at sea. While most dwarves have a great dislike and even fear of large bodies of open water, the Copper Dwarves prove that this fear is hardly something that is genetic to the Dwarven race, and are some of the best sailors in all of both Bulwar and Cannor. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
