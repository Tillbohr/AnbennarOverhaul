 building_aov_monument_hehodovar_school_of_architecture_01: "Hehodovar School of Architecture"
 building_aov_monument_hehodovar_school_of_architecture_01_desc: "The first hold, and the hold of the builders. Hehodovar is famous for its school of architecture, which at its prime was the definitive school in all of Halann for teaching building design and construction, though with a known *slight* bias towards dwarven styles by the professors."
 building_aov_monument_hehodovar_school_of_architecture_02: "Hehodovar School of Architecture (II)"
 building_aov_monument_hehodovar_school_of_architecture_02_desc: "The first hold, and the hold of the builders. Hehodovar is famous for its school of architecture, which at its prime was the definitive school in all of Halann for teaching building design and construction, though with a known *slight* bias towards dwarven styles by the professors."
