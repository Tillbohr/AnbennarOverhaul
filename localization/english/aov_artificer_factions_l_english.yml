 aov_revoke_not_artificer_faction_title: "Is not the leadership of an artificer faction"

 # Influence
 AOV_LEVEL_HOSTILE: "Hostile"
 AOV_LEVEL_DISPLEASED: "Displeased"
 AOV_LEVEL_NEUTRAL: "Neutral"
 AOV_LEVEL_FAVORED: "Favored"
 AOV_LEVEL_EXALTED: "Exalted"
 aov_brillites_hostile: "Scorned by the Brillites"
 aov_brillites_hostile_desc: "The Brillites take every chance to belittle my court's ideas."
 aov_brillites_displeased: "Brillite Discontent"
 aov_brillites_displeased_desc: "The Brillites grumble that their genius goes unrewarded here."
 aov_brillites_favored: "Favored by the Brillites"
 aov_brillites_favored_desc: "The Brillites share their sparks of inspiration with my court."
 aov_brillites_exalted: "Exalted by the Brillites"
 aov_brillites_exalted_desc: "The Brillites hail me as the patron of a new age of genius."
 aov_mechanists_hostile: "Scorned by the Mechanists"
 aov_mechanists_hostile_desc: "The Mechanists withhold their engineers and their ledgers from my realm."
 aov_mechanists_displeased: "Mechanist Discontent"
 aov_mechanists_displeased_desc: "The Mechanists work slowly and complain loudly."
 aov_mechanists_favored: "Favored by the Mechanists"
 aov_mechanists_favored_desc: "Mechanist engineers keep my workshops and treasuries in good order."
 aov_mechanists_exalted: "Exalted by the Mechanists"
 aov_mechanists_exalted_desc: "The Mechanist Guild puts its finest machines at my disposal."
 aov_technomancers_hostile: "Scorned by the Technomancers"
 aov_technomancers_hostile_desc: "The Technomancers' wards no longer protect my armies."
 aov_technomancers_displeased: "Technomancer Discontent"
 aov_technomancers_displeased_desc: "The Technomancers neglect the enchantments on my soldiers' arms."
 aov_technomancers_favored: "Favored by the Technomancers"
 aov_technomancers_favored_desc: "Technomancer enchantments strengthen my champions."
 aov_technomancers_exalted: "Exalted by the Technomancers"
 aov_technomancers_exalted_desc: "The Technomancer Conclave arms my warriors with its most potent artifice."

 # Sponsoring
 aov_sponsor_influence_brillites_tt: "#P +20#! influence with the Brillites, #N -10#! with the Mechanists and the Technomancers"
 aov_sponsor_influence_mechanists_tt: "#P +20#! influence with the Mechanists, #N -10#! with the Brillites and the Technomancers"
 aov_sponsor_influence_technomancers_tt: "#P +20#! influence with the Technomancers, #N -10#! with the Brillites and the Mechanists"

 # Elections
 aov_artificer_factions.1.t: "[aov_election_title.GetNameNoTooltip|U] Elects a Leader"
 aov_artificer_factions.1.desc.brillites: "The Brillites must choose who will lead [aov_election_title.GetNameNoTooltip]. Every realm that keeps an Artificer Academy has a say, and the Brillites weigh each voice by how much they owe to it. Three names have been put forward:\n"
 aov_artificer_factions.1.desc.mechanists: "The Mechanists must choose who will lead [aov_election_title.GetNameNoTooltip]. Every realm that keeps an Artificer Academy has a say, and the Mechanists weigh each voice by how much they owe to it. Three names have been put forward:\n"
 aov_artificer_factions.1.desc.technomancers: "The Technomancers must choose who will lead [aov_election_title.GetNameNoTooltip]. Every realm that keeps an Artificer Academy has a say, and the Technomancers weigh each voice by how much they owe to it. Three names have been put forward:\n"
 aov_artificer_factions.1.candidate_1: "\n$EFFECT_LIST_BULLET$[aov_candidate_1.GetName]"
 aov_artificer_factions.1.candidate_2: "\n$EFFECT_LIST_BULLET$[aov_candidate_2.GetName]"
 aov_artificer_factions.1.candidate_3: "\n$EFFECT_LIST_BULLET$[aov_candidate_3.GetName]"
 aov_artificer_factions.1.a: "Vote for [aov_candidate_1.GetShortUIName]"
 aov_artificer_factions.1.b: "Vote for [aov_candidate_2.GetShortUIName]"
 aov_artificer_factions.1.c: "Vote for [aov_candidate_3.GetShortUIName]"
 aov_artificer_factions.1.d: "I have already cast my vote."
 aov_artificer_factions.2.t: "A New Leader for [aov_election_title.GetNameNoTooltip|U]"
 aov_artificer_factions.2.desc: "The votes have been counted. [aov_winner.GetName] now leads [aov_election_title.GetNameNoTooltip], and will do so until [aov_winner.GetHerHis] last day."
 aov_artificer_factions.2.a: "So be it."
 aov_vote_weight_brillites_tt: "My vote counts #V [ROOT.Char.MakeScope.ScriptValue('aov_vote_weight_brillites')|0]#! times, by my standing with the Brillites"
 aov_vote_weight_mechanists_tt: "My vote counts #V [ROOT.Char.MakeScope.ScriptValue('aov_vote_weight_mechanists')|0]#! times, by my standing with the Mechanists"
 aov_vote_weight_technomancers_tt: "My vote counts #V [ROOT.Char.MakeScope.ScriptValue('aov_vote_weight_technomancers')|0]#! times, by my standing with the Technomancers"
