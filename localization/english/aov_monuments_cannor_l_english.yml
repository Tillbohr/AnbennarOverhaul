 building_aov_monument_portnamm_portroy_merchants_guild_01: "Portroy Merchant's Guild"
 building_aov_monument_portnamm_portroy_merchants_guild_01_desc: "The Portroy Merchants Guild of Portnamm is the foremost mercantile organization of Portnamm, and exerts a large amount of influence upon the local politics of the city. Beyond Portnamm itself, the guild is infamous for its ruthless tactics at maintaining its trading influence within the surrounding waters of Portnamm. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
 building_aov_monument_portnamm_portroy_merchants_guild_02: "Portroy Merchant's Guild (II)"
