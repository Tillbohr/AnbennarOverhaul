 building_aov_monument_refuge_of_the_glasslords_01: "Refuge of the Glasslords"
 building_aov_monument_refuge_of_the_glasslords_01_desc: "The dwarven clans of Bulghelovar are refugees thrice over: their ancestors fled first from their ancestral home of Orlghelovar to Gemisle; then from Gemisle to Rubyhold in the wake of the Onslaught, after they and their political allies were blamed for failing to adequately defend the island against the Deep Devils; and finally from Rubyhold in the 600s BA, after being given an ultimatum to reconvert to the Dwarven Pantheon or face exile. They chose the latter option, and settled in an abandoned Ruby Dwarf colony. From this refuge, they sold glassworks to the empires of antiquity. Over time, the wealth this brought attracted more and more humans to settle nearby. Though the dwarves would eventually become a minority in the city that was built around their refuge, the name of said city - Bottlepoint - serves as a reminder of its origins as a home of dwarven master glassblowers. Nowadays, the Refuge of the Glasslords forms a city within the city, a network of workshops, stores and homes for its dwarven inhabitants. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
