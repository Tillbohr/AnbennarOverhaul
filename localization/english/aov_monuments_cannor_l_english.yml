 building_aov_monument_beepeck_the_largest_small_city_01: "Beepeck, The Largest Small City"
 building_aov_monument_beepeck_the_largest_small_city_01_desc: "Beepeck and its halfling population serve as the gatekeepers of the Dameshead, exerting a large influence on trade and movement around its waters. Beepeck is also one of the most built up cities in all of Halann, due to the halfling urban design of stacking their houses upon one another. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
