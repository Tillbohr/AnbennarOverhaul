 building_aov_monument_the_dragonhoard_01: "The Dragonhoard"
 building_aov_monument_the_dragonhoard_01_desc: "Kobolds are essentially small dragons. Dragons, by their very nature, like gold. Where does a dragon put all the gold they find? In a hoard of couse. The largest hoard of gold in all of the Dragondepths (and perhaps all of Cannor as well) is located here, in Soxun Kobildzex. As greed begets greed, the more the hoard grows, so too does the desire for even more wealth grow alongside it."
