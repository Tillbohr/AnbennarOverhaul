 building_aov_monument_the_south_citadel_03_desc: "Twin to the North Citadel at the foot of the Trialmount, the South Citadel guarded the southern approaches to Castonath. It housed the legions that kept the roads of the Empire of Castanor open."
 building_aov_monument_thednakerja_01: "Thednakerja"
 building_aov_monument_thednakerja_01_desc: "As the Era of Frost came to an end and the ice and snow receded, the body of the Giants Grave´s terror, the Leviathan, was revealed to the population. Its flesh, never rotting, was used as food for generations to come. With the word spreading, Skaldhyrric priests began the construction of the Thednakerja, a temple marking the first thaw and the end of the terror that plagued the sea, using the leviathan's body as a great frame. The interior of the temple boasts innumerable stained glass constructions, built in a way that when used as a lens for refractive magic, they project colorful light. The most famous of these glassworks, 'To Slumber a City', spans the roof of the central part of the temple and simulates an aurora into the sky. Designed by Skaldhyrric architects and constructed with Reachman labor, the Thednakerja is a symbol of Reachman and Gerudian collaboration."
 building_aov_monument_thednakerja_02: "Thednakerja (II)"
 building_aov_monument_thednakerja_02_desc: "As the Era of Frost came to an end and the ice and snow receded, the body of the Giants Grave´s terror, the Leviathan, was revealed to the population. Its flesh, never rotting, was used as food for generations to come. With the word spreading, Skaldhyrric priests began the construction of the Thednakerja, a temple marking the first thaw and the end of the terror that plagued the sea, using the leviathan's body as a great frame. The interior of the temple boasts innumerable stained glass constructions, built in a way that when used as a lens for refractive magic, they project colorful light. The most famous of these glassworks, 'To Slumber a City', spans the roof of the central part of the temple and simulates an aurora into the sky. Designed by Skaldhyrric architects and constructed with Reachman labor, the Thednakerja is a symbol of Reachman and Gerudian collaboration. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
