 building_aov_monument_deranne_westport_gateway_to_aelantir_03_desc: "Deranne has many ports along its coastline for merchants, adventurers, and explorers alike, but none more prominent or influential than Westport. Many Derranians hope to use the resources and location of Westport to fuel explorations of the ruins of Aelantir, for riches and glory alike. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
 building_aov_monument_derilde_s_gateway_01: "Derhilde's Gateway"
 building_aov_monument_derilde_s_gateway_01_desc: "Derhilde's Gateway, also known as the Middanroy Gateway, sits astride the river mouth. Control over the entrance to the river is of vital economic importance, as most trade with the Small Country coming from the west is conducted via the Middanroy. It is said that Derhilde landed here, at Westport, with her first conquest being the Entebenic and Iochander garrisons of the area. The Gateway is guarded by two towers, one on each side of the river, connected by a long chain that gives the rulers of Deranne the ability to close the Gateway at will. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
