 building_aov_monument_oldhaven_memorial_01: "Oldhaven Memorial"
 building_aov_monument_oldhaven_memorial_01_desc: "Long ago, Castan Beastbane purged the so-called monstrous races of Escann in what he dubbed 'The Great Cleansing'. Not content to merely burn people, he turned his wrath on the forest itself and burned the World Tree that stood in Oldhaven. The resulting blaze deforested most of Escann and split the Oldwoods into the Greatwoods and Deepwoods. This memorial reminds us of all that was lost, and why we must never again give up the fight for our homeland. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
