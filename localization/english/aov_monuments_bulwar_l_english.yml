 building_aov_monument_ash_palace_01: "The Ash Palace"
 building_aov_monument_ash_palace_01_desc: "The sprawling palace complex nowadays known as the Ash Palace of Sareyand has a long and storied history. Once the site of a grandiose Djinn palace during the time of the Darkness Sultanates, the palace of Proxacha Eklu was erected on its ruins during the Age of Monsters, as the heart of the gnollish capital of Raxaklu. After the fall of the gnollish kingdom, the palace ruins stood untouched for many centuries due to the superstitious fear and resentment of the local human Bulwari, the city around it eventually razed to the ground by the Red Xhaz. Only after Jaher liberated Bulwar was the area finally resettled again. Eledas Sarelzuir founded Sareyand and built a palace on the hill overlooking his new city, incidentally choosing the location of both previous palace complexes. This palace would earn the epithet 'Ash Palace' after a failed assassination attempt left the palace a charred ruin and a young Jexis, the later Phoenix Empress, disfigured for life. After the first Cinder War,a limited reconstruction began, aimed at rendering one wing of the sprawling palace complex inhabitable again as an official residence of the Sarelzuir dynasty. Despite a checkered history in the last several centuries, the Ash Palace has over the millennia been chosen again and again as the seat of empires, its location making it a natural choice for anyone wishing to rule all of Bulwar and beyond. And like embers within the ashes, the fires of conquest can easily be rekindled by anyone seated on the sunfire throne of the Ash Palace. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
