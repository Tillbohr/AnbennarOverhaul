 building_aov_monument_jag_radash_monument_01: "Jag'Radash"
 building_aov_monument_jag_radash_monument_01_desc: "Jag'Radash - 'Brave Battle' in Orcish - marks the centre of a vast hunting ground, set up in the wake of a population boom amongst some of the wilder animals after the Greentide swept across Escann. Traditional hunters across Human and Orc lines were busy in the fighting or fleeing depending on the phase of the conflict, and in their absence, natural predators proliferated. Now that the dust has settled and Orcish control over this area has been cemented, their kingdoms seen as equal to the Cannorians, this natural oasis of wildlife has been marked out, safe from destruction as a primitive or monstrous aberration, should it ever be occupied by the 'civilised' realms. Orcs train against the wilds and bond with their fellows, gaining experience with the dangers of the wild without risking the full violence of battle."
