 building_aov_monument_anzarzax_palace_01: "Arzax Eklu"
 building_aov_monument_anzarzax_palace_01_desc: "Buried amidst the sandy hills of Anzarzax lay the last, crumbling edifice of a once-grand construction - the Eternal White Palace, the Arzax Eklu. Constructed in the latter years of the Bulwari Age of Monsters by packlord Arzax, the palace served as the heart of the Ever-Richer Kingdom of Arzax, a territorially small yet exceedingly wealthy state born from the waning influence of the kingdoms of Uak and Proxacha. The marble opulence of the Arxax Eklu stood in harsh contrast to the withering drylands it was built upon, its unorthodox location chosen specifically to discredit Arzax's rivals, who claimed it was daft to build a palace in a desert. Ultimately the rise of the Xhazobine would see the palace utterly destroyed, its corpulent occupants put to the torch and its marble walls scattered. Yet its legacy endured, such that whenever a gnoll looked upon fine marble they called it 'arzax'. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
