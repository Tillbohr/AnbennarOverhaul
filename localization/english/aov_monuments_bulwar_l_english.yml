 building_aov_monument_suhuskar_01: "Suhuškar"
 building_aov_monument_suhuskar_01_desc: "The Djinn Palace of Suhuškar is located west of the city of Nebar in the hilly countryside on the southern banks of the Suran river. Half-buried within the shale hills, the accessible areas still stand tall and seemingly untouched by the passage of time, a testament to the skill of its genie architects. Many theories abound regarding this monumental reminder of the very origins of Bulwari history. Some scholars even consider it the last remnant of the Djinn palace city of Ilu-Abbašlam, the capital of the Šedu Sultanates, left on the material plane. Within the upper levels of the palace, the Sultan of Suhuškar, leader of the Kigkasil brotherhood of adventurers and by tradition always a Mirzizig air planetouched, holds court. Here, the brothers - and sisters - of the brotherhood make use of the training facilities to hone their skills, recuperate from arduous quests and revel in the raucous company of their fellow brethren. But only a small fraction of the sprawling palace has been claimed by mortal occupants. Beneath the surface level, deep within the rocky soil, the palace stretches on for uncounted miles and levels. And within this vast ruined dungeon, many an enterprising Kigkasil has made their fortune by uncovering a genie relic, or has found their untimely end. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
