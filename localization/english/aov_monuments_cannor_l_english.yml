 building_aov_monument_ravioli_bastion_01: "Bastion of the God Fragment"
 building_aov_monument_ravioli_bastion_01_desc: "A fortress-temple of the Ravelian theocracy, built around what its priests insist is a fragment of a fallen god. Pilgrims and soldiers share its walls, and neither will say what the fragment does. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
