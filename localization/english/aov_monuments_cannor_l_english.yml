 building_aov_monument_silverforge_strongbellow_academy_01: "Strongbellow Academy of Metallurgy"
 building_aov_monument_silverforge_strongbellow_academy_01_desc: "During the 4th Lilac War, the dwarven armies of Silverforge were looking into new ways to combat the powerful cavalry-dominated armies fielded by Lorent and their allies, having suffered heavy losses from them in the field. This task was assigned to a dwarf named Grun Strongbellow, who, after decades of exploration into ancient dwarven weaponry in the Serpentspine, developed new rifle and artillery batteries for the armies of Silverforge. A center of higher education within the hold of Silverforge is now named in his honor."
