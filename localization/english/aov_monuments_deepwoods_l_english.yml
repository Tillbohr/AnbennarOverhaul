 building_aov_monument_ciranmyna_the_shimmering_city_01: "The Shimmering City"
 building_aov_monument_ciranmyna_the_shimmering_city_01_desc: "Upon the tallest peaks of the Deepwoods shines Ciranmyna, the heart of Wood Elven culture and its mightiest shield. Having long outgrown its humble roots as a war camp filled with disheveled Moon Elves, the fortress city now sprawls across the mountaintop, woven into the very earth itself. Its towering walls watch over the few mines responsible for the Deepwood's scant supply of metals and gems. All the while a new army, one of eager artisans, works away to shape and craft weapons and goods greedily coveted by the forest's denizens, nearby Escann and beyond. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
 building_aov_monument_ciranmyna_the_shimmering_city_02: "The Shimmering City (II)"
