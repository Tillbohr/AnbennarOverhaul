 building_aov_monument_minara_temple_01: "Temple of Minara"
 building_aov_monument_minara_temple_01_desc: "Minara, goddess of the lesser love, was raised to godhood by Ryala after Ryala witnessed her skill in the art. Her temple celebrates pleasure and desire openly, in contrast to the chaste halls of Ryala's followers."
