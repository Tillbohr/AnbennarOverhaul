 building_aov_monument_urviksten_ebonsteel_armory_01: "Ebonsteel Armory"
 building_aov_monument_urviksten_ebonsteel_armory_01_desc: "The prize of Urviksten, and of Black Castanor in the past, the Ebonsteel Armory is a vast foundry, blacksmith, and armory supplying high quality weapons and armor made of Ebonsteel, a dark, naturally alloyed metal found throughout Urviksten. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
