 building_aov_monument_nimscodd_academy_01: "Nimscodd Academy"
 building_aov_monument_nimscodd_academy_01_desc: "Nimscodd Academy was founded back when the Gnomish Hierarchy still ruled as the undisputed masters of the Dragon Coast, with a particular focus on engineering and artificery. It is here, on the isle of Nimscodd, that the secrects of artificery were first unraveled. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
