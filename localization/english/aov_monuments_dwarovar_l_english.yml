 building_aov_monument_verkal_gulan_golden_delve_01: "The Golden Delve"
 building_aov_monument_verkal_gulan_golden_delve_01_desc: "The hold of Verkal Gulan rests upon a massive chasm with countless veins of gold running through it, making it the deepest gold mine in the Serpentspine. While in a state of disrepair in 1444 AA, the Golden Delve at its peak supplied Aul-Dwarov with the majority of its minted coins before the collapse of the empire. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
