 building_aov_monument_eternal_pillar_1_01: "Pillar of Eternity"
 building_aov_monument_eternal_pillar_1_01_desc: "One of the nine Pillars of Eternity that the sorcerers of the Black Demesne raise across the Deepwoods. Each pillar draws the wealth of the forest towards it, and at its full height turns the earth around it to damestear, but the folk of the woods resent the black stone and those who serve it."
