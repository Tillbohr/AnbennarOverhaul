 building_aov_monument_aelcandar_02: "Aelcandar (II)"
 building_aov_monument_aelcandar_02_desc: "Aelcandar, another great work by Calasandur the Magnificent, was built to counter Nichmer's terror campaign against the Wescanni halflings. The guardsmen fought night and day to rebuff countless undead, grievously exhausted and injured. The stronghold was pivotal for the Free Realms cavalry, offering refuge when the slavering hordes grew too large. Aelcandar's name resounds among all Wescann halflings, especially the Coppertowners. Central to Aelcandar's fame is Candor Ale, a glimmering pale spirit only brewed in Coppertown copper kettles, and widely loved for its sweet flavor and deceptive potency. The surrounding lands are home still to the half-elven Aelcandari, descendants of the original Free Realms garrison. Initially enforcers for Viswall, the Aelcandari have fought and died protecting halflings in every Wescanni war. Nowadays, Aelcandari share much with their shorter brothers, espousing the same love for adventure, pipeweed and good food. Though kin to the smallfolk, the Aelcandari serve a mixed purpose as both protector and jailer over the halflings of Lencenor."
 building_aov_monument_aelcandar_03: "Aelcandar (III)"
 building_aov_monument_aelcandar_03_desc: "Aelcandar, another great work by Calasandur the Magnificent, was built to counter Nichmer's terror campaign against the Wescanni halflings. The guardsmen fought night and day to rebuff countless undead, grievously exhausted and injured. The stronghold was pivotal for the Free Realms cavalry, offering refuge when the slavering hordes grew too large. Aelcandar's name resounds among all Wescann halflings, especially the Coppertowners. Central to Aelcandar's fame is Candor Ale, a glimmering pale spirit only brewed in Coppertown copper kettles, and widely loved for its sweet flavor and deceptive potency. The surrounding lands are home still to the half-elven Aelcandari, descendants of the original Free Realms garrison. Initially enforcers for Viswall, the Aelcandari have fought and died protecting halflings in every Wescanni war. Nowadays, Aelcandari share much with their shorter brothers, espousing the same love for adventure, pipeweed and good food. Though kin to the smallfolk, the Aelcandari serve a mixed purpose as both protector and jailer over the halflings of Lencenor."
 building_aov_monument_ancardia_escanni_academy_of_war_01: "Escanni Academy of War"
 building_aov_monument_ancardia_escanni_academy_of_war_01_desc: "Founded in 1630, the Ancardi War School (later renamed to the Escanni Academy of War in 1718), became the foremost military academy in all of Cannor. The academy's founding members were descended from the Escanni Knights of the Sapphire Eye, who in feudal Escann safeguarded the realm and fought as champions for their country to settle disputes rather than war. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
