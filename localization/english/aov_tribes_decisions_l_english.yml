 # Anbennar Overhaul: Dwarovar tribes (docs/systems/dwarovar-tribes.md)
 aov_tribe_no_free_title:0 "Every title of this rank is already held by another tribe"
 aov_form_tribal_duchy_decision:0 "Form a Warband or Chiefdom"
 aov_form_tribal_duchy_decision_desc:0 "Enough land answers to me that I can call it more than a county. The land has its own old names and its old claimants; I care for neither."
 aov_form_tribal_duchy_decision_tooltip:0 "Take a duchy-rank title named for your dynasty, on no de jure land"
 aov_form_tribal_duchy_decision_confirm:0 "It is mine"
 aov_form_tribal_kingdom_decision:0 "Form a Warhost or High Chiefdom"
 aov_form_tribal_kingdom_decision_desc:0 "Whole tunnels and caverns answer to me now. Let every tribe in the deep know the name of my dynasty."
 aov_form_tribal_kingdom_decision_tooltip:0 "Take a kingdom-rank title named for your dynasty, on no de jure land"
 aov_form_tribal_kingdom_decision_confirm:0 "Let them kneel"
 aov_form_tribal_empire_decision:0 "Form a Horde or Swarm"
 aov_form_tribal_empire_decision_desc:0 "No one has held so much of the deep in living memory. What I have built is greater than any kingdom."
 aov_form_tribal_empire_decision_tooltip:0 "Take an empire-rank title named for your dynasty, on no de jure land"
 aov_form_tribal_empire_decision_confirm:0 "All the deep is mine"
 aov_raise_tribal_vassal_interaction:0 "Raise to Warlord"
 aov_raise_tribal_vassal_interaction_desc:0 "Give this vassal a free title one rank below yours, named for their own dynasty."
