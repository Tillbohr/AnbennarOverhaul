 building_aov_monument_nimsnoms_theatre_01: "Nimsnoms Theatre"
 building_aov_monument_nimsnoms_theatre_01_desc: "One of the oldest and greatest buildings in the old city of Portnamm, the Nimsnoms Theatre represents the culmination of Creek Gnome and Iochander culture and society. Theatre and comedy is an important aspect of Creek Gnome and Iochander Lencori culture, to the point of it being a major aspect of faith, with the theatre-temples of Iochand being found all across the old kingdom. The Nimsnoms theatre is a place where plays are enacted, while always paying homage to the three most important gods of the Iochanders: Adean the Warrior, Minara the Lover, and Wip the Jester. The Nimsnoms also serves as the main temple of Wip, the gnomish Regent Court god known as the Jester of the Court, where they serve as minor god of actors, comedians and tricksters. The theatre always leaves one isolated seat empty during every play, to let Wip sit in to watch, judge and respond to any performance in the theatre as they see fit."
