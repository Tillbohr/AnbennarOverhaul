 building_aov_monument_moonhaven_port_munas_01: "Port Munas, The Little Anbenncóst"
 building_aov_monument_moonhaven_port_munas_01_desc: "The capital of the elven electorate of Moonhaven, Port Munas is situated to control the trade that flows into the Dameshead. Despite being owned by the elven electorate, the city shares more in common culturally with Anbenncóst to its north than with the rest of Moonhaven itself. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
