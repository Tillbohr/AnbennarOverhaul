 aov_hold_ruin.3.t:0 "[SCOPE.sTitle('hold_title').GetName] Restored"
 aov_hold_ruin.3.desc.restored:0 "The rubble is cleared and the halls of [SCOPE.sTitle('hold_title').GetName] ring with hammers again. The hold is whole once more."
 aov_hold_ruin.3.desc.lost:0 "The masons were turned out of [SCOPE.sTitle('hold_title').GetName], whose holder is not of the Dwarven folk. The work is abandoned and the ruin stays."
 aov_hold_ruin.3.a:0 "So be it."
 aov_clear_ruins_decision:0 "Clear the Ruins"
 aov_clear_ruins_decision_tooltip:0 "Restore a ruined hold. The work takes 5 years."
 aov_clear_ruins_decision_desc:0 "Our ruined holds can be cleared and rebuilt by Dwarven masons."
 aov_clear_ruins_decision_confirm:0 "Send for the masons"
