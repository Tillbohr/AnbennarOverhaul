l_english:
 aov_hold_ruin.1.t:0 "A Hold in Ruins"
 aov_hold_ruin.1.desc.new:0 "The halls of [SCOPE.sTitle('hold_title').GetName] were taken by force, and in the sack its dwarven works were broken and abandoned. The hold lies in ruin until the Dwarves clear it."
 aov_hold_ruin.1.desc.old:0 "The halls of [SCOPE.sTitle('hold_title').GetName] have fallen to an invader, who has left them in ruins. Only the Dwarves can bring them back to life."
 aov_hold_ruin.1.desc.lost_dig:0 "\n\nThe delving under way there was lost with it: the gold already spent and the progress made are gone."
 aov_hold_ruin.1.a:0 "A grim sight."
 aov_hold_ruin.2.t:0 "Clear the Ruins"
 aov_hold_ruin.2.desc:0 "Dwarven masons stand ready to clear the rubble and rebuild a ruined hold. The work will take years. Which hold shall they restore?"
 aov_hold_ruin.2.hold_1:0 "Restore [GetTitleByKey('b_marrhold').GetName]"
 aov_hold_ruin.2.hold_2:0 "Restore [GetTitleByKey('b_anvilwright').GetName]"
 aov_hold_ruin.2.hold_3:0 "Restore [GetTitleByKey('b_gulandhum').GetName]"
 aov_hold_ruin.2.hold_4:0 "Restore [GetTitleByKey('b_kar_fimthrun').GetName]"
 aov_hold_ruin.2.hold_5:0 "Restore [GetTitleByKey('b_irovar').GetName]"
 aov_hold_ruin.2.hold_6:0 "Restore [GetTitleByKey('b_hul_az_amekh').GetName]"
 aov_hold_ruin.2.hold_7:0 "Restore [GetTitleByKey('b_kar_hargun').GetName]"
 aov_hold_ruin.2.hold_8:0 "Restore [GetTitleByKey('b_topazhjardan').GetName]"
 aov_hold_ruin.2.hold_9:0 "Restore [GetTitleByKey('b_aghatehargun').GetName]"
 aov_hold_ruin.3.t:0 "[SCOPE.sTitle('hold_title').GetName] Restored"
 aov_hold_ruin.3.desc.restored:0 "The rubble is cleared and the halls of [SCOPE.sTitle('hold_title').GetName] ring with hammers again. The hold is whole once more."
 aov_hold_ruin.3.desc.lost:0 "The masons were turned out of [SCOPE.sTitle('hold_title').GetName], whose holder is not of the Dwarven folk. The work is abandoned and the ruin stays."
 aov_hold_ruin.3.a:0 "So be it."
 aov_clear_ruins_decision:0 "Clear the Ruins"
 aov_clear_ruins_decision_tooltip:0 "Restore a ruined hold. The work takes 5 years."
 aov_clear_ruins_decision_desc:0 "Our ruined holds can be cleared and rebuilt by Dwarven masons."
 aov_clear_ruins_decision_confirm:0 "Send for the masons"
