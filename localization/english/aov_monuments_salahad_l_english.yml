 building_aov_monument_koroshesh_grain_port_01: "Grain Port of Koroshesh"
 building_aov_monument_koroshesh_grain_port_01_desc: "The Port of Koroshesh is the main location for all exports from the Mother's Sorrow Estuary, and the main location where Kheteratan grain is shipped to Cannor. Regardless of what happens to the North Salahad, the grain must flow. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
