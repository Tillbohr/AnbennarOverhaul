 building_castle_dameris_01: "Castle Dameris"
 building_castle_dameris_01_desc: "On top of the highest hill of the Royal Quarter of Anbenncóst, the Imperial Palace stands proudly watching over the City of the World's Desire. Built after the War of Rule on the site of old castle Dameris, and renovated and expanded multiple times throughout the centuries, the Imperial Palace is the heart of imperial politics, serving as the home of the emperor but also the seat of the imperial parliament. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
 building_castle_dameris_02: "Castle Dameris"
 building_castle_dameris_02_desc: "On top of the highest hill of the Royal Quarter of Anbenncóst, the Imperial Palace stands proudly watching over the City of the World's Desire. Built after the War of Rule on the site of old castle Dameris, and renovated and expanded multiple times throughout the centuries, the Imperial Palace is the heart of imperial politics, serving as the home of the emperor but also the seat of the imperial parliament. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
