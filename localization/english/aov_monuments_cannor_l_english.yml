 building_aov_monument_gawed_castle_gaweton_01: "Castle Gaweton"
 building_aov_monument_gawed_castle_gaweton_01_desc: "Gaweton has been the traditional home of the kings of Gawed for its history. While Gaweton itself is not as developed as Lorentainé in the south, it is still a powerful symbol of the continuing legitimacy of the Gawedi Kings. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
