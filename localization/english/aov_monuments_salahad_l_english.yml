 building_aov_monument_elikhet_pyramid_01: "Great Pyramid of Elikhet"
 building_aov_monument_elikhet_pyramid_01_desc: "The Tomb of Elikhet, being the resting place of the most powerful and famous Khet known, is one of the holiest sites in Khetism beyond the Sorrow itself. Atop this tomb a great pyramid has been constructed, acting both as a layer of protection for the tomb itself, as well as a projection of Elikhet's awe inspiring might. It stands as both a reminder of the will of the Khet as well as a monument to their glory. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
