 building_aov_monument_seghdihr_home_of_the_seg_band_01: "Home of the Seg Band"
 building_aov_monument_seghdihr_home_of_the_seg_band_01_desc: "One of the most notorious and ruthless mercenary companies in Cannor, the Seg Band (a corruption of the Segbandal, which meant Southern Alliance which Seghdir had led) first found notoriety serving as enforcers under Sun Elven Employ when the hold was shared between the Phoenix Empire and the Segbandal. Some effects of the original Europa Universalis IV project have no Crusader Kings III equivalent and are omitted."
 building_aov_monument_seghdihr_home_of_the_seg_band_02: "Home of the Seg Band (II)"
